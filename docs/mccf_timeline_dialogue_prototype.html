<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MCCF — Event Timeline &amp; Dialogue Editor (prototype)</title>
<style>
  :root{
    --bg:#10131a;
    --bg-panel:#161b24;
    --bg-lane-a:#1a2028;
    --bg-lane-b:#171c24;
    --line:#2a3142;
    --line-soft:#212734;
    --text:#e6e3da;
    --text-dim:#8a92a6;
    --text-faint:#5b6376;
    --amber:#c9915a;
    --amber-dim:#4a3a2a;
    --teal:#5fb3a3;
    --teal-dim:#22403a;
    --coral:#d9636a;
    --coral-dim:#4a2529;
    --violet:#9b8cd9;
    --violet-dim:#332e4a;
    --blue:#6f9bd1;
    --blue-dim:#25344a;
    --grey:#7c8494;
    --grey-dim:#2a303c;
    --mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace;
    --sans: -apple-system, 'Inter', 'Segoe UI', system-ui, sans-serif;
    --radius: 3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);height:100%;}
  #app{display:flex;flex-direction:column;height:100vh;}

  /* ---------- header ---------- */
  header{
    display:flex;align-items:center;gap:18px;
    padding:10px 18px;border-bottom:1px solid var(--line);
    background:var(--bg-panel);flex-shrink:0;
  }
  .brand{display:flex;align-items:baseline;gap:8px;}
  .brand .mark{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--amber);border:1px solid var(--amber-dim);padding:2px 6px;border-radius:var(--radius);}
  .brand h1{font-size:14px;font-weight:600;margin:0;color:var(--text);letter-spacing:.01em;}
  .scene-name{font-family:var(--mono);font-size:12px;color:var(--text-dim);}
  .tabs{display:flex;gap:2px;margin-left:auto;background:var(--bg-lane-b);border:1px solid var(--line);border-radius:6px;padding:2px;}
  .tab{
    font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;
    padding:7px 14px;border-radius:4px;color:var(--text-dim);cursor:pointer;border:none;background:transparent;
  }
  .tab.active{background:var(--bg-panel);color:var(--amber);box-shadow:inset 0 0 0 1px var(--line);}
  .proto-flag{font-family:var(--mono);font-size:10px;color:var(--text-faint);border:1px dashed var(--line);padding:3px 8px;border-radius:var(--radius);}

  /* ---------- verb legend (signature element) ---------- */
  .verb-legend{display:flex;gap:14px;padding:8px 18px;border-bottom:1px solid var(--line);background:var(--bg);flex-shrink:0;flex-wrap:wrap;}
  .verb-badge{
    font-family:var(--mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;
    padding:3px 8px;border-radius:10px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
  }
  .verb-badge .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .verb-legend .desc{font-size:11px;color:var(--text-faint);}
  .v-start{background:var(--blue-dim);color:var(--blue);} .v-start .dot{background:var(--blue);}
  .v-stop{background:var(--grey-dim);color:var(--grey);} .v-stop .dot{background:var(--grey);}
  .v-arrived{background:var(--teal-dim);color:var(--teal);} .v-arrived .dot{background:var(--teal);}
  .v-blocked{background:var(--coral-dim);color:var(--coral);} .v-blocked .dot{background:var(--coral);animation:pulse 1.4s infinite;}
  .v-set{background:var(--violet-dim);color:var(--violet);} .v-set .dot{background:var(--violet);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  main{flex:1;min-height:0;position:relative;}
  .view{display:none;height:100%;}
  .view.active{display:flex;}

  /* ================= TIMELINE VIEW ================= */
  .timeline-shell{display:flex;width:100%;height:100%;}
  .actor-rail{
    width:180px;flex-shrink:0;border-right:1px solid var(--line);background:var(--bg-panel);
    overflow-y:auto;padding:10px 0;
  }
  .rail-title{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);padding:4px 14px 8px;}
  .rail-item{
    padding:8px 14px;cursor:pointer;border-left:2px solid transparent;
  }
  .rail-item:hover{background:var(--bg-lane-a);}
  .rail-item.sel{border-left-color:var(--amber);background:var(--bg-lane-a);}
  .rail-item .nm{font-size:12.5px;font-weight:600;}
  .rail-item .ty{font-family:var(--mono);font-size:10px;color:var(--text-dim);}

  .timeline-scroll{flex:1;overflow:auto;position:relative;background:var(--bg);}
  .timeline-inner{position:relative;width:1720px;min-height:100%;padding:14px 0 30px;}

  .zone-lane{height:34px;position:relative;margin:0 0 6px 200px;width:1520px;border-bottom:1px dashed var(--line);}
  .zone-mark{
    position:absolute;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;
  }
  .zone-mark .diamond{width:9px;height:9px;background:var(--amber);transform:rotate(45deg);margin-top:9px;}
  .zone-mark .lbl{font-family:var(--mono);font-size:9.5px;color:var(--amber);white-space:nowrap;margin-top:3px;}

  .lanes-wrap{margin-left:0;}
  .actor-group{border-bottom:1px solid var(--line-soft);}
  .actor-group-label{
    font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--text-dim);
    padding:8px 0 2px 14px;width:200px;
  }
  .track-row{display:flex;align-items:stretch;min-height:38px;}
  .track-label{
    width:200px;flex-shrink:0;display:flex;align-items:center;gap:6px;padding:0 14px;
    font-size:11.5px;color:var(--text-dim);border-right:1px solid var(--line-soft);
  }
  .track-label .kind-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .track-lane{position:relative;flex:1;height:38px;background:var(--bg-lane-b);}
  .track-row:nth-child(even) .track-lane{background:var(--bg-lane-a);}
  .step{
    position:absolute;top:6px;height:26px;border-radius:5px;
    display:flex;align-items:center;padding:0 8px;gap:6px;cursor:pointer;
    border:1px solid var(--line);font-size:11px;white-space:nowrap;overflow:hidden;
    transition:box-shadow .12s;
  }
  .step:hover{box-shadow:0 0 0 1px var(--text-dim);}
  .step.selected{box-shadow:0 0 0 1.5px var(--amber);}
  .step .sdot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .step.st-start{background:var(--blue-dim);color:var(--blue);}
  .step.st-arrived{background:var(--teal-dim);color:var(--teal);}
  .step.st-set{background:var(--violet-dim);color:var(--violet);}
  .step.st-blocked{background:var(--coral-dim);color:var(--coral);animation:blockedGlow 1.6s infinite;}
  @keyframes blockedGlow{0%,100%{box-shadow:0 0 0 1px var(--coral);}50%{box-shadow:0 0 6px 1px var(--coral);}}

  svg.connectors{position:absolute;top:0;left:0;pointer-events:none;}
  .conn-path{fill:none;stroke:var(--text-faint);stroke-width:1.2;stroke-dasharray:3 3;opacity:.55;}
  .conn-path.zoneconn{stroke:var(--amber);opacity:.5;}

  /* inspector */
  .inspector{
    width:290px;flex-shrink:0;border-left:1px solid var(--line);background:var(--bg-panel);
    padding:16px;overflow-y:auto;
  }
  .inspector h3{margin:0 0 12px;font-size:13px;color:var(--text);}
  .insp-empty{color:var(--text-faint);font-size:12px;line-height:1.5;}
  .insp-row{margin-bottom:14px;}
  .insp-row .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-faint);margin-bottom:4px;}
  .insp-row .v{font-size:12.5px;color:var(--text);line-height:1.4;}
  .arb-badge{
    font-family:var(--mono);font-size:9.5px;padding:2px 6px;border-radius:8px;display:inline-block;margin-top:4px;
  }
  .arb-replace{background:var(--blue-dim);color:var(--blue);}
  .arb-blend{background:var(--amber-dim);color:var(--amber);}
  .arb-trackwins{background:var(--grey-dim);color:var(--grey);}

  /* ================= DIALOGUE VIEW ================= */
  .dialogue-shell{display:flex;width:100%;height:100%;}
  .dialogue-main{flex:1;overflow-y:auto;padding:20px 24px;}
  .dlg-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .dlg-header h2{font-size:15px;margin:0;}
  .dlg-header .badge-actor{font-family:var(--mono);font-size:10px;color:var(--amber);border:1px solid var(--amber-dim);padding:2px 7px;border-radius:10px;}
  .add-line-btn{
    margin-left:auto;font-family:var(--mono);font-size:11px;background:var(--amber-dim);color:var(--amber);
    border:1px solid var(--amber-dim);padding:6px 12px;border-radius:5px;cursor:pointer;
  }
  .add-line-btn:hover{background:var(--amber);color:var(--bg);}

  .dlg-card{
    border:1px solid var(--line);border-radius:7px;background:var(--bg-panel);margin-bottom:12px;overflow:hidden;
  }
  .dlg-card-top{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line-soft);background:var(--bg-lane-a);}
  .dlg-index{font-family:var(--mono);font-size:11px;color:var(--text-faint);width:20px;}
  .dlg-order-btns{display:flex;flex-direction:column;gap:1px;}
  .dlg-order-btns button{
    background:none;border:none;color:var(--text-faint);cursor:pointer;font-size:10px;line-height:1;padding:1px 4px;
  }
  .dlg-order-btns button:hover{color:var(--amber);}
  .dlg-remove{margin-left:auto;background:none;border:1px solid var(--line);color:var(--text-faint);border-radius:4px;
    font-family:var(--mono);font-size:10px;padding:3px 8px;cursor:pointer;}
  .dlg-remove:hover{color:var(--coral);border-color:var(--coral-dim);}
  .dlg-body{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field-block{display:flex;flex-direction:column;gap:5px;}
  .field-block.span2{grid-column:1/-1;}
  .field-block label{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);}
  select, textarea, input[type=text]{
    background:var(--bg-lane-b);border:1px solid var(--line);color:var(--text);border-radius:4px;
    padding:7px 9px;font-family:var(--sans);font-size:12.5px;width:100%;
  }
  textarea{resize:vertical;min-height:52px;line-height:1.4;}
  .mode-toggle{display:flex;gap:0;border:1px solid var(--line);border-radius:4px;overflow:hidden;width:fit-content;}
  .mode-toggle button{
    background:var(--bg-lane-b);border:none;color:var(--text-dim);font-family:var(--mono);font-size:10.5px;
    padding:6px 11px;cursor:pointer;
  }
  .mode-toggle button.active{background:var(--violet-dim);color:var(--violet);}
  .improv-note{font-size:11.5px;color:var(--text-faint);font-style:italic;padding:8px 0;}
  .block-row{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-dim);}
  .block-row input{width:auto;}

  .actor-rail .rail-item.dlg-only{display:flex;justify-content:space-between;align-items:center;}
  .rail-item .cnt{font-family:var(--mono);font-size:10px;color:var(--text-faint);}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px;}
  ::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="brand">
      <span class="mark">MCCF</span>
      <h1>Actor Timeline / Dialogue Editor</h1>
    </div>
    <span class="scene-name" id="sceneName"></span>
    <div class="tabs">
      <button class="tab active" data-view="timeline">Timeline</button>
      <button class="tab" data-view="dialogue">Dialogue</button>
    </div>
    <span class="proto-flag">prototype — in-memory only</span>
  </header>

  <div class="verb-legend" id="verbLegend"></div>

  <main>
    <!-- ============ TIMELINE VIEW ============ -->
    <section class="view active" id="view-timeline">
      <div class="timeline-shell">
        <aside class="actor-rail" id="actorRail"></aside>
        <div class="timeline-scroll">
          <div class="timeline-inner" id="timelineInner">
            <div class="zone-lane" id="zoneLane"></div>
            <div class="lanes-wrap" id="lanesWrap"></div>
            <svg class="connectors" id="connSvg"></svg>
          </div>
        </div>
        <aside class="inspector" id="inspector">
          <h3>Step inspector</h3>
          <div class="insp-empty" id="inspEmpty">Select a step on the timeline to see its verb, trigger, and — for <code>set</code> steps — which field-map entry and arbitration rule it uses.</div>
          <div id="inspBody" style="display:none"></div>
        </aside>
      </div>
    </section>

    <!-- ============ DIALOGUE VIEW ============ -->
    <section class="view" id="view-dialogue">
      <div class="dialogue-shell">
        <aside class="actor-rail" id="dialogueActorRail"></aside>
        <div class="dialogue-main">
          <div class="dlg-header">
            <h2 id="dlgActorName">—</h2>
            <span class="badge-actor" id="dlgActorType"></span>
            <button class="add-line-btn" id="addLineBtn">+ Add line</button>
          </div>
          <div id="dlgSteps"></div>
        </div>
      </div>
    </section>
  </main>
</div>

<script>
/* ---------------------------------------------------------------------
   MCCF Timeline / Dialogue editor — prototype
   Data model reflects the Actor architecture design doc:
   Actor -> tracks -> steps, each step carries a verb (start/stop/arrived/
   blocked/set) and a trigger. Dialogue is just one track kind among others.
   All state is in-memory for this prototype; nothing persists on reload.
--------------------------------------------------------------------- */

const VERBS = {
  start:   {label:'start',   cls:'v-start',   desc:'begin a track / next step'},
  stop:    {label:'stop',    cls:'v-stop',    desc:'halt whatever is running'},
  arrived: {label:'arrived', cls:'v-arrived', desc:'a step completed on its own'},
  blocked: {label:'blocked', cls:'v-blocked', desc:'a step failed to complete'},
  set:     {label:'set',     cls:'v-set',     desc:'direct field write (bypasses tracks)'}
};

// Field-map lookup used by the inspector when a step's verb is "set".
const FIELD_MAP = {
  idleGestureBias: {channel:'arousal', arbitration:'track-wins', range:'calm(0.0) – wary(1.0)'},
  walkPace:        {channel:'arousal', arbitration:'blend',      range:'0.9 – 1.6 m/s'},
  visibility:       {channel:'tension', arbitration:'replace',    range:'2000 – 80'},
  swingSpeed:      {channel:'tension', arbitration:'blend',      range:'0.6x – 1.3x nominal'}
};

const state = {
  sceneName: 'newDirectoryTestScene',
  zones: [
    {id:'Zone1', name:'The Garden', t:0.03},
    {id:'Pool',  name:'The Pool',   t:0.34},
    {id:'Temp1', name:'The Temple (underworld approach)', t:0.68}
  ],
  actors: [
    {
      id:'Cindy', type:'Avatar',
      tracks:[
        {id:'path', label:'Path', kind:'path', steps:[
          {id:'c-p1', label:'WP1 \u2192 WP2', verb:'start',   trigger:'Scene start', t0:0.00, t1:0.12, status:'ok'},
          {id:'c-p2', label:'WP2 \u2192 WP3', verb:'arrived', trigger:'c-p1.arrived', t0:0.12, t1:0.32, status:'ok'},
          {id:'c-p3', label:'WP3 \u2192 Meditation', verb:'arrived', trigger:'c-p2.arrived', t0:0.32, t1:0.55, status:'ok'}
        ]},
        {id:'gesture', label:'Gesture', kind:'gesture', steps:[
          {id:'c-g1', label:'Idle sway (bias)', verb:'set', field:'idleGestureBias', trigger:'affect: arousal', t0:0.00, t1:1.00, status:'ok'},
          {id:'c-g2', label:'Wary glance', verb:'start', trigger:'Temp1 zone entry', t0:0.66, t1:0.74, status:'blocked'}
        ]},
        {id:'dialogue', label:'Dialogue', kind:'dialogue', steps:[
          {id:'c-d1', label:'"This is the Garden."', verb:'start', trigger:'c-p1.arrived', t0:0.12, t1:0.17, status:'ok',
            content:'This is the Garden. It hasn\u2019t changed since I was small.', mode:'static', voice:'Cindy \u2014 warm alto', rate:'1.0', blocks:true},
          {id:'c-d2', label:'"The water is still here."', verb:'start', trigger:'c-p2.arrived', t0:0.32, t1:0.37, status:'ok',
            content:'', mode:'improv', voice:'Cindy \u2014 warm alto', rate:'1.0', blocks:true},
          {id:'c-d3', label:'"...something waits below."', verb:'start', trigger:'Temp1 zone entry', t0:0.68, t1:0.75, status:'ok',
            content:'I don\u2019t like this. Something waits below.', mode:'static', voice:'Cindy \u2014 warm alto', rate:'0.92', blocks:false}
        ]}
      ]
    },
    {
      id:'Jack', type:'Avatar',
      tracks:[
        {id:'path', label:'Path', kind:'path', steps:[
          {id:'j-p1', label:'Bench \u2192 Pool edge', verb:'start', trigger:'c-p2.arrived', t0:0.34, t1:0.50, status:'ok'}
        ]},
        {id:'dialogue', label:'Dialogue', kind:'dialogue', steps:[
          {id:'j-d1', label:'"Wait for me."', verb:'start', trigger:'c-p2.arrived', t0:0.34, t1:0.38, status:'ok',
            content:'Wait for me, will you?', mode:'static', voice:'Jack \u2014 low tenor', rate:'1.0', blocks:false}
        ]}
      ]
    },
    {
      id:'SceneFog', type:'Prop (ambient)',
      tracks:[
        {id:'affect', label:'Affect', kind:'affect', steps:[
          {id:'f-1', label:'visibility \u2190 tension', verb:'set', field:'visibility', trigger:'affect: tension', t0:0.55, t1:1.00, status:'ok'}
        ]}
      ]
    },
    {
      id:'TempleDoor', type:'Prop',
      tracks:[
        {id:'swing', label:'Swing', kind:'prop', steps:[
          {id:'d-1', label:'Open + creak', verb:'start', field:'swingSpeed', trigger:'Touch', t0:0.66, t1:0.69, status:'ok'}
        ]}
      ]
    }
  ]
};

const TIMELINE_W = 1520; // px, maps to t in [0,1]

// ---------------------------------------------------------------------
// Header / legend
// ---------------------------------------------------------------------
document.getElementById('sceneName').textContent = state.sceneName;
(function renderLegend(){
  const el = document.getElementById('verbLegend');
  el.innerHTML = Object.entries(VERBS).map(([k,v])=>`
    <span class="verb-badge ${v.cls}"><span class="dot"></span>${v.label}</span>
    <span class="desc">${v.desc}</span>
  `).join('<span style="width:6px"></span>');
})();

// ---------------------------------------------------------------------
// Tabs
// ---------------------------------------------------------------------
document.querySelectorAll('.tab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-'+btn.dataset.view).classList.add('active');
    if(btn.dataset.view==='timeline') requestAnimationFrame(drawConnectors);
  });
});

// ---------------------------------------------------------------------
// TIMELINE VIEW
// ---------------------------------------------------------------------
let selectedStep = null;

function renderActorRail(){
  const el = document.getElementById('actorRail');
  el.innerHTML = '<div class="rail-title">Actors</div>' + state.actors.map(a=>`
    <div class="rail-item" data-actor="${a.id}">
      <div class="nm">${a.id}</div>
      <div class="ty">${a.type}</div>
    </div>
  `).join('');
  el.querySelectorAll('.rail-item').forEach(item=>{
    item.addEventListener('click', ()=>{
      const row = document.querySelector(`.actor-group[data-actor="${item.dataset.actor}"]`);
      if(row) row.scrollIntoView({block:'nearest'});
    });
  });
}

function kindColor(kind){
  return {path:'var(--blue)', gesture:'var(--violet)', dialogue:'var(--amber)',
          affect:'var(--violet)', prop:'var(--grey)'}[kind] || 'var(--grey)';
}

function renderZoneLane(){
  const el = document.getElementById('zoneLane');
  el.innerHTML = state.zones.map(z=>`
    <div class="zone-mark" style="left:${z.t*TIMELINE_W}px">
      <div class="diamond"></div>
      <div class="lbl">${z.name}</div>
    </div>
  `).join('');
}

function renderLanes(){
  const wrap = document.getElementById('lanesWrap');
  wrap.innerHTML = state.actors.map(actor=>`
    <div class="actor-group" data-actor="${actor.id}">
      <div class="actor-group-label">${actor.id} <span style="color:var(--text-faint)">\u00b7 ${actor.type}</span></div>
      ${actor.tracks.map(track=>`
        <div class="track-row" data-actor="${actor.id}" data-track="${track.id}">
          <div class="track-label">
            <span class="kind-dot" style="background:${kindColor(track.kind)}"></span>
            ${track.label}
          </div>
          <div class="track-lane" data-lane="${actor.id}.${track.id}">
            ${track.steps.map(s=>{
              const v = VERBS[s.status==='blocked' ? 'blocked' : s.verb];
              const cls = s.status==='blocked' ? 'st-blocked' : ('st-' + s.verb);
              const left = (s.t0*TIMELINE_W).toFixed(1);
              const width = Math.max(((s.t1-s.t0)*TIMELINE_W), 46).toFixed(1);
              return `<div class="step ${cls}" data-id="${s.id}" style="left:${left}px;width:${width}px" title="${s.label}">
                <span class="sdot"></span>${s.label}
              </div>`;
            }).join('')}
          </div>
        </div>
      `).join('')}
    </div>
  `).join('');

  wrap.querySelectorAll('.step').forEach(stepEl=>{
    stepEl.addEventListener('click', ()=>selectStep(stepEl.dataset.id));
  });
}

function findStep(id){
  for(const a of state.actors){
    for(const t of a.tracks){
      for(const s of t.steps){
        if(s.id===id) return {actor:a, track:t, step:s};
      }
    }
  }
  return null;
}

function selectStep(id){
  selectedStep = id;
  document.querySelectorAll('.step').forEach(el=>el.classList.toggle('selected', el.dataset.id===id));
  const found = findStep(id);
  const empty = document.getElementById('inspEmpty');
  const body = document.getElementById('inspBody');
  if(!found){ empty.style.display='block'; body.style.display='none'; return; }
  empty.style.display='none';
  body.style.display='block';
  const {actor, track, step} = found;
  const v = VERBS[step.status==='blocked' ? 'blocked' : step.verb];
  let fieldRow = '';
  if(step.verb==='set' && step.field && FIELD_MAP[step.field]){
    const fm = FIELD_MAP[step.field];
    const arbCls = {replace:'arb-replace', blend:'arb-blend', 'track-wins':'arb-trackwins'}[fm.arbitration];
    fieldRow = `
      <div class="insp-row">
        <div class="k">Field map entry</div>
        <div class="v"><span style="font-family:var(--mono)">${step.field}</span><br>
        channel: ${fm.channel} &middot; range: ${fm.range}
        <div class="arb-badge ${arbCls}">arbitration: ${fm.arbitration}</div></div>
      </div>`;
  }
  body.innerHTML = `
    <div class="insp-row"><div class="k">Actor / Track</div><div class="v">${actor.id} \u2192 ${track.label}</div></div>
    <div class="insp-row"><div class="k">Step</div><div class="v">${step.label}</div></div>
    <div class="insp-row"><div class="k">Verb</div><div class="v">
      <span class="verb-badge ${v.cls}"><span class="dot"></span>${v.label}</span>
    </div></div>
    <div class="insp-row"><div class="k">Trigger</div><div class="v" style="font-family:var(--mono);font-size:11.5px">${step.trigger}</div></div>
    ${fieldRow}
    ${step.status==='blocked' ? '<div class="insp-row"><div class="k">Status</div><div class="v" style="color:var(--coral)">blocked \u2014 sensor/asset did not confirm; surfaced instead of failing silently</div></div>' : ''}
  `;
}

function drawConnectors(){
  const svg = document.getElementById('connSvg');
  const inner = document.getElementById('timelineInner');
  svg.setAttribute('width', inner.scrollWidth);
  svg.setAttribute('height', inner.scrollHeight);
  const innerRect = inner.getBoundingClientRect();
  let paths = '';
  state.actors.forEach(a=>a.tracks.forEach(t=>t.steps.forEach(s=>{
    if(typeof s.trigger === 'string' && s.trigger.includes('.arrived')){
      const srcId = s.trigger.split('.')[0];
      const srcEl = document.querySelector(`.step[data-id="${srcId}"]`);
      const dstEl = document.querySelector(`.step[data-id="${s.id}"]`);
      if(srcEl && dstEl){
        const sr = srcEl.getBoundingClientRect(), dr = dstEl.getBoundingClientRect();
        const x1 = sr.right - innerRect.left, y1 = sr.top + sr.height/2 - innerRect.top;
        const x2 = dr.left - innerRect.left, y2 = dr.top + dr.height/2 - innerRect.top;
        const mx = (x1+x2)/2;
        paths += `<path class="conn-path" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`;
      }
    } else if (typeof s.trigger === 'string' && (s.trigger.includes('zone entry') || s.trigger === 'Touch')){
      const dstEl = document.querySelector(`.step[data-id="${s.id}"]`);
      const zoneName = s.trigger.split(' zone')[0];
      const zone = state.zones.find(z=>z.name.includes(zoneName)) || null;
      if(dstEl && zone){
        const dr = dstEl.getBoundingClientRect();
        const x1 = zone.t*TIMELINE_W + 200, y1 = 24;
        const x2 = dr.left - innerRect.left, y2 = dr.top + dr.height/2 - innerRect.top;
        paths += `<path class="conn-path zoneconn" d="M${x1},${y1} C${x1},${(y1+y2)/2} ${x2},${(y1+y2)/2} ${x2},${y2}"/>`;
      }
    }
  })));
  svg.innerHTML = paths;
}

renderActorRail();
renderZoneLane();
renderLanes();
window.addEventListener('resize', drawConnectors);
requestAnimationFrame(drawConnectors);

// ---------------------------------------------------------------------
// DIALOGUE VIEW
// ---------------------------------------------------------------------
let dlgActorId = state.actors.find(a=>a.tracks.some(t=>t.kind==='dialogue')).id;

// All events in the scene a dialogue step could trigger from — this is
// the concrete demonstration that a line's trigger is chosen from any
// event in the scene, not tied to a waypoint record.
function allTriggerOptions(){
  const opts = ['Scene start', 'Touch'];
  state.zones.forEach(z=>opts.push(z.name+' zone entry'));
  state.actors.forEach(a=>a.tracks.forEach(t=>t.steps.forEach(s=>{
    opts.push(`${s.id}.arrived  (${a.id} / ${t.label}: ${s.label})`);
  })));
  return opts;
}

function renderDialogueRail(){
  const el = document.getElementById('dialogueActorRail');
  const withDlg = state.actors.filter(a=>a.tracks.some(t=>t.kind==='dialogue'));
  el.innerHTML = '<div class="rail-title">Actors with dialogue</div>' + withDlg.map(a=>{
    const track = a.tracks.find(t=>t.kind==='dialogue');
    return `<div class="rail-item dlg-only ${a.id===dlgActorId?'sel':''}" data-actor="${a.id}">
      <span><div class="nm">${a.id}</div><div class="ty">${a.type}</div></span>
      <span class="cnt">${track.steps.length}</span>
    </div>`;
  }).join('');
  el.querySelectorAll('.rail-item').forEach(item=>{
    item.addEventListener('click', ()=>{ dlgActorId = item.dataset.actor; renderDialogueRail(); renderDialogueSteps(); });
  });
}

function renderDialogueSteps(){
  const actor = state.actors.find(a=>a.id===dlgActorId);
  const track = actor.tracks.find(t=>t.kind==='dialogue');
  document.getElementById('dlgActorName').textContent = actor.id + ' \u2014 Dialogue';
  document.getElementById('dlgActorType').textContent = actor.type;

  const triggerOpts = allTriggerOptions();
  document.getElementById('dlgSteps').innerHTML = track.steps.map((s,i)=>`
    <div class="dlg-card" data-id="${s.id}">
      <div class="dlg-card-top">
        <span class="dlg-index">${String(i+1).padStart(2,'0')}</span>
        <div class="dlg-order-btns">
          <button data-act="up" ${i===0?'disabled':''}>\u25b2</button>
          <button data-act="down" ${i===track.steps.length-1?'disabled':''}>\u25bc</button>
        </div>
        <span class="verb-badge v-start"><span class="dot"></span>start</span>
        <span style="font-size:12px;color:var(--text-dim)">${s.label}</span>
        <button class="dlg-remove" data-act="remove">remove</button>
      </div>
      <div class="dlg-body">
        <div class="field-block">
          <label>Trigger source</label>
          <select data-field="trigger">
            ${triggerOpts.map(o=>`<option ${o===s.trigger || o.startsWith(s.trigger)?'selected':''}>${o}</option>`).join('')}
          </select>
        </div>
        <div class="field-block">
          <label>Voice</label>
          <select data-field="voice">
            ${['Cindy \u2014 warm alto','Jack \u2014 low tenor','Narrator \u2014 neutral'].map(v=>`<option ${v===s.voice?'selected':''}>${v}</option>`).join('')}
          </select>
        </div>
        <div class="field-block span2">
          <label>Content</label>
          <div class="mode-toggle">
            <button data-mode="static" class="${s.mode==='static'?'active':''}">Static text</button>
            <button data-mode="improv" class="${s.mode==='improv'?'active':''}">Improv (ollama)</button>
          </div>
          ${s.mode==='static'
            ? `<textarea data-field="content" placeholder="Line text...">${s.content||''}</textarea>`
            : `<div class="improv-note">Generated live via ollama at runtime, using the current affective context (coherence, zone pressure, arousal/valence). No fixed text to author here \u2014 "arrived" still fires when TTS finishes.</div>`}
        </div>
        <div class="field-block">
          <label>Rate</label>
          <select data-field="rate">
            ${['0.85','0.92','1.0','1.1','1.2'].map(r=>`<option ${r===s.rate?'selected':''}>${r}</option>`).join('')}
          </select>
        </div>
        <div class="field-block" style="justify-content:center">
          <label>Blocking</label>
          <div class="block-row">
            <input type="checkbox" data-field="blocks" ${s.blocks?'checked':''}>
            <span>Blocks next step until this line's <span style="color:var(--teal)">arrived</span></span>
          </div>
        </div>
      </div>
    </div>
  `).join('');

  // wire interactions
  document.querySelectorAll('.dlg-card').forEach(card=>{
    const id = card.dataset.id;
    const step = track.steps.find(x=>x.id===id);
    card.querySelectorAll('[data-act]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = track.steps.findIndex(x=>x.id===id);
        if(btn.dataset.act==='up' && idx>0){ [track.steps[idx-1],track.steps[idx]]=[track.steps[idx],track.steps[idx-1]]; renderDialogueSteps(); }
        if(btn.dataset.act==='down' && idx<track.steps.length-1){ [track.steps[idx+1],track.steps[idx]]=[track.steps[idx],track.steps[idx+1]]; renderDialogueSteps(); }
        if(btn.dataset.act==='remove'){ track.steps.splice(idx,1); renderDialogueSteps(); }
      });
    });
    card.querySelectorAll('.mode-toggle button').forEach(mb=>{
      mb.addEventListener('click', ()=>{ step.mode = mb.dataset.mode; if(step.mode==='improv') step.content=''; renderDialogueSteps(); });
    });
    const trigSel = card.querySelector('[data-field="trigger"]');
    if(trigSel) trigSel.addEventListener('change', e=>{ step.trigger = e.target.value; });
    const voiceSel = card.querySelector('[data-field="voice"]');
    if(voiceSel) voiceSel.addEventListener('change', e=>{ step.voice = e.target.value; });
    const rateSel = card.querySelector('[data-field="rate"]');
    if(rateSel) rateSel.addEventListener('change', e=>{ step.rate = e.target.value; });
    const contentTa = card.querySelector('[data-field="content"]');
    if(contentTa) contentTa.addEventListener('input', e=>{ step.content = e.target.value; });
    const blockCb = card.querySelector('[data-field="blocks"]');
    if(blockCb) blockCb.addEventListener('change', e=>{ step.blocks = e.target.checked; });
  });
}

document.getElementById('addLineBtn').addEventListener('click', ()=>{
  const actor = state.actors.find(a=>a.id===dlgActorId);
  const track = actor.tracks.find(t=>t.kind==='dialogue');
  const n = track.steps.length+1;
  track.steps.push({
    id: dlgActorId.toLowerCase()+'-d'+Date.now(),
    label:'New line '+n, verb:'start', trigger:'Scene start', t0:0, t1:0.05, status:'ok',
    content:'', mode:'static', voice:'Narrator \u2014 neutral', rate:'1.0', blocks:false
  });
  renderDialogueRail();
  renderDialogueSteps();
});

renderDialogueRail();
renderDialogueSteps();
</script>
</body>
