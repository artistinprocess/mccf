<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MCCF Dialogue Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #07090d;
  --s1:      #0c0f16;
  --s2:      #12161f;
  --s3:      #181d28;
  --border:  #1e2535;
  --accent:  #4af0a8;
  --warm:    #f0c060;
  --cool:    #60a8f0;
  --danger:  #f06060;
  --purple:  #a060f0;
  --text:    #b8c8e0;
  --dim:     #7a8aaa;
  --E: #f06060; --B: #60a8f0; --P: #f0c060; --S: #4af0a8;
  --mono: 'IBM Plex Mono', monospace;
  --display: 'Syne', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr;
  grid-template-columns: 300px 1fr 300px;
  grid-template-areas: "hdr hdr hdr" "left main right";
  overflow: hidden;
}
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--s3); border-radius: 4px; }
::-webkit-scrollbar-track { background: transparent; }

/* ── header ── */
#hdr {
  grid-area: hdr;
  background: var(--s1);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px 10px;
  padding: 10px 16px;
}
#hdr .logo {
  font-family: var(--display);
  font-weight: 800;
  font-size: 15px;
  color: var(--accent);
  letter-spacing: 0.02em;
  white-space: nowrap;
}
#hdr .logo span { color: var(--dim); font-weight: 600; font-size: 12px; margin-left: 6px; }
#hdr .spacer { flex: 1; }
.pill-btn {
  background: var(--s2);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
  padding: 7px 13px;
  border-radius: 6px;
  cursor: pointer;
  transition: border-color .15s, color .15s;
  white-space: nowrap;
}
.pill-btn:hover { border-color: var(--accent); color: var(--accent); }
.pill-btn.primary { background: var(--accent); color: #06110c; border-color: var(--accent); font-weight: 600; }
.pill-btn.primary:hover { opacity: .88; color: #06110c; }
.pill-btn.danger:hover { border-color: var(--danger); color: var(--danger); }
.pill-btn:disabled { opacity: .4; cursor: not-allowed; }
.pill-btn:disabled:hover { border-color: var(--border); color: var(--text); }
.pill-btn:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 1px;
}
.hdr-input {
  background: var(--s2);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--mono);
  font-size: 11.5px;
  padding: 6px 9px;
  border-radius: 6px;
  width: 130px;
}
.hdr-input::placeholder { color: var(--dim); }
.hdr-label { font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); white-space: nowrap; }
.hdr-group { display: flex; align-items: center; gap: 5px; }

/* ── validation badge ── */
.val-badge {
  font-size: 11px; padding: 5px 10px; border-radius: 6px; font-weight: 600;
  white-space: nowrap; cursor: default;
}
.val-badge.ok { background: #0f2419; color: var(--accent); }
.val-badge.err { background: #2a1414; color: var(--danger); cursor: pointer; }

/* ── left: line list ── */
#left {
  grid-area: left;
  background: var(--s1);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
#left-head { padding: 12px 14px 8px; display: flex; align-items: center; justify-content: space-between; }
#left-head h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); font-weight: 600; }
#line-list { flex: 1; overflow-y: auto; padding: 4px 8px 12px; }
.line-card {
  background: var(--s2);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 9px 10px;
  margin-bottom: 6px;
  cursor: pointer;
  transition: border-color .12s;
  position: relative;
}
.line-card:hover { border-color: #2a3348; }
.line-card.active { border-color: var(--accent); background: #10231b; }
.line-card.invalid { border-color: var(--danger); }
.line-card .lc-top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.line-card .lc-actor { font-weight: 600; color: var(--text); font-size: 12px; }
.line-card .lc-type { font-size: 10px; color: var(--dim); }
.line-card .lc-text { font-size: 11.5px; color: var(--dim); line-height: 1.4; max-height: 2.8em; overflow: hidden; }
.badge {
  font-size: 9.5px;
  padding: 1.5px 6px;
  border-radius: 999px;
  font-weight: 600;
  letter-spacing: .02em;
  white-space: nowrap;
}
.badge-trigger { background: #16202f; color: var(--cool); }
.badge-trigger.declared { color: var(--warm); }
.badge-trigger.sensed { color: var(--purple); }
.badge-trigger.legacy { color: var(--dim); font-style: italic; }
.badge-trigger.arc-complete { color: var(--danger); }
.lc-flags { display: flex; gap: 4px; margin-top: 5px; align-items: center; }
.flag-dot { width: 6px; height: 6px; border-radius: 50%; }
.flag-dot.blocking { background: var(--danger); }
.flag-dot.static { background: var(--dim); }
.flag-dot.improv { background: var(--accent); }
.flag-dot.has-audio { background: var(--cool); }
.flag-dot.invalid-mark { background: var(--danger); width: 7px; height: 7px; }

/* ── main: editor ── */
#main { grid-area: main; overflow-y: auto; padding: 20px 26px 40px; }
#main .empty { color: var(--dim); font-size: 13px; padding-top: 60px; text-align: center; }
.field-row { display: flex; gap: 12px; margin-bottom: 14px; }
.field { flex: 1; }
.field label {
  display: block;
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--dim);
  margin-bottom: 5px;
  font-weight: 600;
}
select, input[type=text], input[type=number], textarea {
  width: 100%;
  background: var(--s2);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  padding: 8px 10px;
  border-radius: 6px;
}
textarea { resize: vertical; line-height: 1.5; }
.toggle-group { display: flex; gap: 6px; }
.toggle-btn {
  flex: 1;
  background: var(--s2);
  border: 1px solid var(--border);
  color: var(--dim);
  font-family: var(--mono);
  font-size: 12px;
  padding: 8px;
  border-radius: 6px;
  cursor: pointer;
  text-align: center;
}
.toggle-btn.on { background: #10231b; border-color: var(--accent); color: var(--accent); font-weight: 600; }
.checkbox-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; }
.checkbox-row input { width: 15px; height: 15px; accent-color: var(--danger); }
.section-title {
  font-family: var(--display);
  font-weight: 700;
  font-size: 13px;
  color: var(--text);
  margin: 22px 0 10px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.section-title:first-child { margin-top: 0; padding-top: 0; border-top: none; }
.hint { font-size: 11px; color: var(--dim); margin-top: 5px; line-height: 1.5; }
.provenance-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.prov-badge {
  font-size: 10px; padding: 2px 8px; border-radius: 999px; font-weight: 600;
}
.prov-algorithmic { background: #1c2a3d; color: var(--cool); }
.prov-authored { background: #1c2a1c; color: var(--accent); }
.prov-llm { background: #2a1c3d; color: var(--purple); }
.tag-toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.tag-chip {
  font-size: 11px; padding: 4px 9px; border-radius: 5px;
  background: var(--s3); border: 1px solid var(--border); color: var(--text);
  cursor: pointer;
}
.tag-chip:hover { border-color: var(--warm); color: var(--warm); }
.audio-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.audio-path { font-size: 11.5px; color: var(--dim); flex: 1; word-break: break-all; }
.audio-path.set { color: var(--cool); }
.audio-path-input { flex: 1; font-size: 11.5px; }
.line-errors {
  background: #2a1414; border: 1px solid #4a2020; border-radius: 7px;
  padding: 10px 12px; margin-bottom: 16px; font-size: 11.5px; color: var(--danger);
  line-height: 1.6;
}
.line-errors ul { margin-left: 16px; }
.delete-row { margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--border); }

/* ── right: preview panel ── */
#right {
  grid-area: right;
  background: var(--s1);
  border-left: 1px solid var(--border);
  overflow-y: auto;
  padding: 16px 16px 30px;
}
#right h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); font-weight: 600; margin-bottom: 12px; }
.meter { margin-bottom: 14px; }
.meter-label { display: flex; justify-content: space-between; font-size: 11.5px; margin-bottom: 4px; }
.meter-label .mv { font-weight: 600; color: var(--text); }
.meter-track { height: 6px; background: var(--s3); border-radius: 3px; overflow: hidden; position: relative; }
.meter-fill { height: 100%; border-radius: 3px; transition: width .3s; }
.valence-track { position: relative; }
.valence-mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--border); }
.channels { display: flex; gap: 6px; margin-bottom: 16px; }
.ch-col { flex: 1; text-align: center; }
.ch-bar-track { height: 60px; width: 100%; background: var(--s3); border-radius: 4px; display: flex; align-items: flex-end; overflow: hidden; }
.ch-bar-fill { width: 100%; border-radius: 4px 4px 0 0; transition: height .3s; }
.ch-label { font-size: 10px; margin-top: 4px; color: var(--dim); }
.ch-val { font-size: 10.5px; font-weight: 600; }
.suggested-tag-box {
  background: var(--s2); border: 1px solid var(--border); border-radius: 7px;
  padding: 12px; margin-top: 6px; margin-bottom: 18px;
}
.suggested-tag-box .stb-tag { font-family: var(--display); font-weight: 700; font-size: 15px; color: var(--warm); }
.suggested-tag-box .stb-none { color: var(--dim); font-style: italic; font-size: 12px; }
.disclaimer {
  font-size: 10.5px; color: var(--dim); line-height: 1.5; margin-top: 10px;
  padding: 9px 10px; background: #150f08; border: 1px solid #2a2010; border-radius: 6px;
}
.disclaimer b { color: var(--warm); }
.preview-error {
  font-size: 11.5px; color: var(--danger); line-height: 1.6;
  padding: 10px 12px; background: #2a1414; border: 1px solid #4a2020; border-radius: 7px;
  margin-top: 10px;
}

/* ── modal ── */
#modal-overlay {
  position: fixed; inset: 0; background: rgba(4,6,10,.75);
  display: none; align-items: center; justify-content: center; z-index: 50;
}
#modal-overlay.show { display: flex; }
#modal {
  background: var(--s1); border: 1px solid var(--border); border-radius: 10px;
  width: 640px; max-width: 90vw; max-height: 84vh; display: flex; flex-direction: column;
}
#modal-head { padding: 16px 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
#modal-head h3 { font-family: var(--display); font-size: 15px; font-weight: 700; }
#modal-body { padding: 16px 18px; overflow-y: auto; }
#modal-body textarea { min-height: 220px; font-size: 12px; line-height: 1.6; font-family: var(--mono); }
#modal-body p { font-size: 12px; color: var(--dim); line-height: 1.6; margin-bottom: 10px; }
#modal-foot { padding: 14px 18px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
#modal-foot .modal-foot-left { display: flex; gap: 8px; }
#modal-foot .modal-foot-right { display: flex; gap: 8px; }
.close-x { background: none; border: none; color: var(--dim); font-size: 18px; cursor: pointer; line-height: 1; }
.close-x:hover { color: var(--danger); }
.modal-err {
  background: #2a1414; border: 1px solid #4a2020; border-radius: 6px;
  padding: 10px 12px; font-size: 11.5px; color: var(--danger); line-height: 1.6; margin-top: 10px;
}
.modal-ok {
  background: #0f2419; border: 1px solid #1e4030; border-radius: 6px;
  padding: 10px 12px; font-size: 11.5px; color: var(--accent); line-height: 1.6; margin-top: 10px;
}
.field-inline { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.field-inline label { font-size: 11px; color: var(--dim); white-space: nowrap; }
.file-drop {
  border: 1px dashed var(--border); border-radius: 7px; padding: 14px; text-align: center;
  font-size: 11.5px; color: var(--dim); margin-bottom: 10px; cursor: pointer;
}
.file-drop:hover { border-color: var(--cool); color: var(--cool); }

@media (max-width: 900px) {
  body { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr auto; grid-template-areas: "hdr" "left" "main" "right"; overflow-y: auto; height: auto; min-height: 100vh; }
  #left, #right { max-height: 260px; }
}
</style>
</head>
<body>

<div id="hdr">
  <div class="logo">MCCF <span>Dialogue Editor</span></div>
  <div class="hdr-group">
    <span class="hdr-label">API base</span>
    <input class="hdr-input" id="api-base-input" placeholder="(same origin)" oninput="onApiBaseChange(this.value)">
  </div>
  <div class="hdr-group">
    <span class="hdr-label">Scene</span>
    <input class="hdr-input" id="scene-name-input" placeholder="scene name" style="width:100px" oninput="sceneName=this.value">
  </div>
  <span id="val-badge" class="val-badge ok">✓ valid</span>
  <!-- Day 83: real gap found in testing — with zero lines authored, nothing
       in the UI displayed ACTORS at all (the Actor dropdown only lives
       inside the per-line editor, which only shows once a line exists and
       is selected). The scene-data roster arrived and updated correctly —
       there was just nowhere on screen to see it, which looked exactly
       like a failed sync even though it wasn't one. This makes the
       current roster visible unconditionally, independent of whether any
       lines exist yet. -->
  <span id="actor-roster-badge" class="hdr-label" style="margin-left:8px"></span>
  <div class="spacer"></div>
  <button class="pill-btn" onclick="openLoadSceneModal()">↓ Load scene</button>
  <button class="pill-btn" onclick="openExportSceneModal()">↑ Export scene</button>
  <button class="pill-btn" onclick="openExportKateModal()">↑ Export for Kate</button>
  <button class="pill-btn" onclick="openImportKateModal()">↓ Import tagged</button>
  <button class="pill-btn" onclick="openImportChorusModal()">🎭 Import from Chorus</button>
  <button class="pill-btn" onclick="openGenerateChorusModal()">💬 Generate Chorus response</button>
  <button class="pill-btn" onclick="openGenerateImprovModal()">🗣 Generate improv lines</button>
  <button class="pill-btn" onclick="openRunArcModal()">▶ Run Arc (batch persist)</button>
  <button class="pill-btn" onclick="openSplitMonologueModal()">✂ Split monologue</button>
  <button class="pill-btn" onclick="rechainSequentially()">⛓ Re-chain sequentially</button>
  <button class="pill-btn" onclick="openBulkAssignAudioModal()">🔊 Bulk-assign audio</button>
  <button class="pill-btn primary" onclick="addLine()">+ New line</button>
  <button class="pill-btn primary" onclick="saveToComposer()">↑ Save to Composer</button>
</div>

<div id="left">
  <div id="left-head"><h2>Dialogue<span id="scene-label"></span></h2></div>
  <div id="line-list"></div>
</div>

<div id="main"></div>

<div id="right"></div>

<div id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div id="modal">
    <div id="modal-head"><h3 id="modal-title"></h3><button class="close-x" onclick="closeModal()">✕</button></div>
    <div id="modal-body"></div>
    <div id="modal-foot"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════
// dialogue-xml.js — inlined verbatim from static/js/dialogue-xml.js
// (Day 73 state: ttsText/tagSource/audioFile/audioSource, arc-complete
// trigger, exportForKate/importFromKate). Inlined so this tool works as a
// single self-contained file / artifact rather than depending on a
// relative <script src>, which can't resolve in a sandboxed preview.
//
// IMPORTANT: this is a COPY. If static/js/dialogue-xml.js changes, this
// block needs to be re-synced by hand, OR — once this file is actually
// deployed inside the real static/ directory alongside the genuine
// dialogue-xml.js — delete this whole inlined block and reference the
// external file with a script tag instead, which removes the
// duplication risk entirely. Left inlined for now because "does this tool
// work when you just open the file" matters more at this stage than
// deployment-path purity.
// ═══════════════════════════════════════════════════════════════════════
(function (root, factory) {
  const api = factory();
  if (typeof module !== 'undefined' && module.exports) {
    module.exports = api;
  } else {
    root.MCCFDialogue = api;
  }
})(typeof self !== 'undefined' ? self : this, function () {

  const LINE_TYPES = ['Question', 'Response', 'Statement'];
  const MODES = ['static', 'improv'];
  const TRIGGER_KINDS = ['scene-start', 'touch', 'zone', 'sensed', 'declared', 'arc-complete', 'legacy-waypoint'];

  function parseTrigger(str) {
    if (str === 'scene-start') return { type: 'scene-start' };
    if (str === 'arc-complete') return { type: 'arc-complete' };
    const m = /^(\w[\w-]*):(.+)$/.exec(str || '');
    if (!m) return { type: '__invalid__', raw: str };
    const [, kind, param] = m;
    if (kind === 'touch') return { type: 'touch', sensor: param };
    if (kind === 'zone') return { type: 'zone', zone: param };
    if (kind === 'sensed') return { type: 'sensed', lineId: param };
    if (kind === 'declared') {
      const time = Number(param);
      return { type: 'declared', time: Number.isFinite(time) ? time : NaN };
    }
    if (kind === 'arc-complete') return { type: 'arc-complete', zone: param };
    if (kind === 'legacy-waypoint') return { type: 'legacy-waypoint', waypoint: param };
    return { type: '__invalid__', raw: str };
  }

  function serializeTrigger(trigger) {
    switch (trigger.type) {
      case 'scene-start': return 'scene-start';
      case 'touch': return `touch:${trigger.sensor}`;
      case 'zone': return `zone:${trigger.zone}`;
      case 'sensed': return `sensed:${trigger.lineId}`;
      case 'declared': return `declared:${trigger.time}`;
      case 'arc-complete': return trigger.zone ? `arc-complete:${trigger.zone}` : 'arc-complete';
      case 'legacy-waypoint': return `legacy-waypoint:${trigger.waypoint}`;
      default: throw new Error(`serializeTrigger: unknown trigger type "${trigger.type}"`);
    }
  }

  const TAG_SOURCE_KINDS = ['algorithmic', 'authored', 'llm-interpreted'];

  function parseTagSource(str) {
    if (str === 'algorithmic') return { type: 'algorithmic' };
    if (str === 'authored') return { type: 'authored' };
    const m = /^llm-interpreted:(.+)$/.exec(str || '');
    if (m) return { type: 'llm-interpreted', name: m[1] };
    return { type: '__invalid__', raw: str };
  }

  function serializeTagSource(tagSource) {
    switch (tagSource.type) {
      case 'algorithmic': return 'algorithmic';
      case 'authored': return 'authored';
      case 'llm-interpreted': return `llm-interpreted:${tagSource.name}`;
      default: throw new Error(`serializeTagSource: unknown tagSource type "${tagSource.type}"`);
    }
  }

  const AUDIO_SOURCE_KINDS = ['elevenlabs', 'recorded', 'other-engine'];

  function parseAudioSource(str) {
    if (str === 'elevenlabs') return { type: 'elevenlabs' };
    if (str === 'recorded') return { type: 'recorded' };
    const m = /^other-engine:(.+)$/.exec(str || '');
    if (m) return { type: 'other-engine', name: m[1] };
    return { type: '__invalid__', raw: str };
  }

  function serializeAudioSource(audioSource) {
    switch (audioSource.type) {
      case 'elevenlabs': return 'elevenlabs';
      case 'recorded': return 'recorded';
      case 'other-engine': return `other-engine:${audioSource.name}`;
      default: throw new Error(`serializeAudioSource: unknown audioSource type "${audioSource.type}"`);
    }
  }

  function validateDialogueLines(lines) {
    const errors = [];
    if (!Array.isArray(lines)) return { valid: false, errors: ['dialogue lines must be an array'] };
    const seenIds = new Set();
    lines.forEach((l, i) => {
      const where = `line[${i}]${l && l.id ? ' (' + l.id + ')' : ''}`;
      if (!l || typeof l !== 'object') { errors.push(`${where}: not an object`); return; }
      if (!l.id) errors.push(`${where}: missing id`);
      else if (seenIds.has(l.id)) errors.push(`${where}: duplicate id "${l.id}" — line ids must be scene-wide unique`);
      else seenIds.add(l.id);
      if (!l.actor) errors.push(`${where}: missing actor`);
      if (!LINE_TYPES.includes(l.type)) errors.push(`${where}: type must be one of ${LINE_TYPES.join(' | ')}`);
      if (!MODES.includes(l.mode)) errors.push(`${where}: mode must be one of ${MODES.join(' | ')}`);
      if (typeof l.blocking !== 'boolean') errors.push(`${where}: blocking must be a boolean`);
      if (!l.trigger || !TRIGGER_KINDS.includes(l.trigger.type)) {
        errors.push(`${where}: invalid trigger`);
      } else if (l.trigger.type === 'declared' && !Number.isFinite(l.trigger.time)) {
        errors.push(`${where}: declared trigger needs a numeric time`);
      }
      if (typeof l.text !== 'string' || !l.text.trim()) errors.push(`${where}: missing text`);

      const hasTtsText = l.ttsText !== undefined && l.ttsText !== null;
      const hasTagSource = l.tagSource !== undefined && l.tagSource !== null;
      if (hasTtsText && !hasTagSource) {
        errors.push(`${where}: ttsText present but tagSource missing — a tag with no recorded provenance can't be trusted or distrusted later`);
      } else if (hasTagSource && !hasTtsText) {
        errors.push(`${where}: tagSource present but ttsText missing — tagSource describes a tag that doesn't exist on this line`);
      } else if (hasTagSource && (!l.tagSource || !TAG_SOURCE_KINDS.includes(l.tagSource.type))) {
        errors.push(`${where}: tagSource must be one of ${TAG_SOURCE_KINDS.join(' | ')}`);
      } else if (hasTtsText && typeof l.ttsText !== 'string') {
        errors.push(`${where}: ttsText must be a string`);
      }

      const hasEmoteWeights = l.emoteWeights !== undefined && l.emoteWeights !== null;
      if (hasEmoteWeights && !hasTtsText) {
        errors.push(`${where}: emoteWeights present but ttsText missing — weights were captured alongside a tag that's no longer there`);
      } else if (hasEmoteWeights) {
        const ew = l.emoteWeights;
        const chans = ['E', 'B', 'P', 'S'];
        if (!chans.every((ch) => Number.isFinite(ew[ch]))) {
          errors.push(`${where}: emoteWeights must have finite E/B/P/S values`);
        }
      }

      const hasAudioFile = l.audioFile !== undefined && l.audioFile !== null;
      const hasAudioSource = l.audioSource !== undefined && l.audioSource !== null;
      if (hasAudioFile && !hasAudioSource) {
        errors.push(`${where}: audioFile present but audioSource missing — an audio path with no recorded provenance can't be trusted or distrusted later`);
      } else if (hasAudioSource && !hasAudioFile) {
        errors.push(`${where}: audioSource present but audioFile missing — audioSource describes an audio file that doesn't exist on this line`);
      } else if (hasAudioSource && (!l.audioSource || !AUDIO_SOURCE_KINDS.includes(l.audioSource.type))) {
        errors.push(`${where}: audioSource must be one of ${AUDIO_SOURCE_KINDS.join(' | ')}`);
      } else if (hasAudioFile && typeof l.audioFile !== 'string') {
        errors.push(`${where}: audioFile must be a string`);
      }
    });
    const ids = new Set(lines.filter((l) => l && l.id).map((l) => l.id));
    lines.forEach((l, i) => {
      if (l && l.trigger && l.trigger.type === 'sensed' && !ids.has(l.trigger.lineId)) {
        errors.push(`line[${i}] (${l.id}): sensed trigger references unknown line id "${l.trigger.lineId}"`);
      }
    });
    return { valid: errors.length === 0, errors };
  }

  function xmlEscape(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function serializeDialogueBlock(lines) {
    const { valid, errors } = validateDialogueLines(lines);
    if (!valid) throw new Error('serializeDialogueBlock: invalid lines:\n' + errors.join('\n'));
    const rows = lines.map((l) => {
      const trig = serializeTrigger(l.trigger);
      let attrs = `id="${xmlEscape(l.id)}" actor="${xmlEscape(l.actor)}" type="${l.type}" ` +
        `mode="${l.mode}" blocking="${l.blocking}" trigger="${xmlEscape(trig)}"`;
      if (l.ttsText !== undefined && l.ttsText !== null) {
        attrs += ` ttsText="${xmlEscape(l.ttsText)}" tagSource="${xmlEscape(serializeTagSource(l.tagSource))}"`;
      }
      if (l.emoteWeights !== undefined && l.emoteWeights !== null) {
        // Prefixed emoteE/emoteB/emoteP/emoteS rather than bare E/B/P/S —
        // this element already carries many flat attributes, and a bare
        // "E" here could be misread as belonging to some other E/B/P/S
        // group elsewhere in a merged document. Flat attributes (not a
        // nested element) to match this element's own existing
        // convention rather than introducing a new shape for just this
        // one field.
        const ew = l.emoteWeights;
        attrs += ` emoteE="${ew.E}" emoteB="${ew.B}" emoteP="${ew.P}" emoteS="${ew.S}"`;
      }
      if (l.audioFile !== undefined && l.audioFile !== null) {
        attrs += ` audioFile="${xmlEscape(l.audioFile)}" audioSource="${xmlEscape(serializeAudioSource(l.audioSource))}"`;
      }
      return `  <Line ${attrs}>${xmlEscape(l.text.trim())}</Line>`;
    });
    return `<Dialogue>\n${rows.join('\n')}\n</Dialogue>`;
  }

  function parseDialogueBlock(sceneXml) {
    const m = sceneXml.match(/<Dialogue>([\s\S]*?)<\/Dialogue>/);
    if (!m) return [];
    const body = m[1];
    const lines = [];
    const lineRe = /<Line\s+([^>]*)>([\s\S]*?)<\/Line>/g;
    let lm;
    while ((lm = lineRe.exec(body)) !== null) {
      const attrsRaw = lm[1];
      const text = lm[2].trim();
      const attrs = {};
      const attrRe = /(\w+)="([^"]*)"/g;
      let am;
      while ((am = attrRe.exec(attrsRaw)) !== null) attrs[am[1]] = am[2];
      const line = {
        id: attrs.id,
        actor: attrs.actor,
        type: attrs.type,
        mode: attrs.mode,
        blocking: attrs.blocking === 'true',
        trigger: parseTrigger(attrs.trigger),
        text: text.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&amp;/g, '&'),
      };
      if (attrs.ttsText !== undefined) {
        line.ttsText = attrs.ttsText.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&amp;/g, '&');
        if (attrs.tagSource !== undefined) {
          line.tagSource = parseTagSource(attrs.tagSource);
        }
      }
      if (attrs.emoteE !== undefined && attrs.emoteB !== undefined && attrs.emoteP !== undefined && attrs.emoteS !== undefined) {
        line.emoteWeights = {
          E: parseFloat(attrs.emoteE),
          B: parseFloat(attrs.emoteB),
          P: parseFloat(attrs.emoteP),
          S: parseFloat(attrs.emoteS),
        };
      }
      if (attrs.audioFile !== undefined) {
        line.audioFile = attrs.audioFile.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&amp;/g, '&');
        if (attrs.audioSource !== undefined) {
          line.audioSource = parseAudioSource(attrs.audioSource);
        }
      }
      lines.push(line);
    }
    return lines;
  }

  function parseLegacyWaypointLines(sceneXml) {
    const lines = [];
    const wpRe = /<Waypoint\s+([^>]*)>([\s\S]*?)<\/Waypoint>/g;
    let wm;
    while ((wm = wpRe.exec(sceneXml)) !== null) {
      const wpAttrs = {};
      const attrRe = /(\w+)="([^"]*)"/g;
      let am;
      while ((am = attrRe.exec(wm[1])) !== null) wpAttrs[am[1]] = am[2];
      const wpName = wpAttrs.name;
      if (!wpName) continue;
      const body = wm[2];
      const lineRe = /<(Question|Response|Statement)([^>]*)>([\s\S]*?)<\/\1>/g;
      let lm, idx = 0;
      while ((lm = lineRe.exec(body)) !== null) {
        const type = lm[1];
        const attrs = {};
        const a2 = /(\w+)="([^"]*)"/g;
        let am2;
        while ((am2 = a2.exec(lm[2])) !== null) attrs[am2[1]] = am2[2];
        const text = lm[3].trim();
        if (!text) continue;
        lines.push({
          id: `${wpName}_${idx++}`,
          actor: attrs.speaker || '',
          type,
          mode: 'improv',
          blocking: false,
          trigger: { type: 'legacy-waypoint', waypoint: wpName },
          text: text.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&amp;/g, '&'),
        });
      }
    }
    return lines;
  }

  function mergeDialogueIntoRawXml(sceneXml, lines) {
    const block = serializeDialogueBlock(lines);
    if (/<Dialogue>[\s\S]*?<\/Dialogue>/.test(sceneXml)) {
      return sceneXml.replace(/<Dialogue>[\s\S]*?<\/Dialogue>/, block);
    }
    if (!/<\/Scene>/.test(sceneXml)) {
      throw new Error('mergeDialogueIntoRawXml: no </Scene> closing tag found — refusing to guess where to insert the Dialogue block');
    }
    return sceneXml.replace(/<\/Scene>/, `${block}\n</Scene>`);
  }

  function exportForKate(lines) {
    return serializeDialogueBlock(lines);
  }

  function importFromKate(kateXml, originalLines, collaboratorName) {
    collaboratorName = collaboratorName || 'Kate';
    const wrapped = /<Dialogue[\s>]/.test(kateXml) ? kateXml : `<Dialogue>\n${kateXml}\n</Dialogue>`;
    const returnedLines = parseDialogueBlock(wrapped);

    const originalById = new Map(originalLines.map((l) => [l.id, l]));
    const originalByText = new Map(originalLines.map((l) => [l.text.trim(), l]));

    const updated = [];
    const added = [];
    const usedIds = new Set(originalLines.map((l) => l.id));
    let newIdCounter = 0;

    returnedLines.forEach((rl) => {
      if (rl.ttsText !== undefined && rl.ttsText !== null &&
          (rl.tagSource === undefined || rl.tagSource === null)) {
        rl.tagSource = { type: 'llm-interpreted', name: collaboratorName };
      }
      if (rl.id && originalById.has(rl.id)) {
        updated.push(rl);
        return;
      }
      const fallback = originalByText.get((rl.text || '').trim());
      if (fallback) {
        updated.push(Object.assign({}, rl, { id: fallback.id }));
        return;
      }
      let candidateId = rl.id && !usedIds.has(rl.id) ? rl.id : null;
      if (!candidateId) {
        do {
          newIdCounter += 1;
          candidateId = `kate_import_${newIdCounter}`;
        } while (usedIds.has(candidateId));
      }
      usedIds.add(candidateId);
      added.push(Object.assign({}, rl, { id: candidateId }));
    });

    const merged = originalLines
      .map((orig) => updated.find((u) => u.id === orig.id) || orig)
      .concat(added);

    const { valid, errors } = validateDialogueLines(merged);

    return {
      lines: merged,
      updatedIds: updated.map((l) => l.id),
      addedIds: added.map((l) => l.id),
      valid,
      errors,
    };
  }

  return {
    LINE_TYPES, MODES, TRIGGER_KINDS, TAG_SOURCE_KINDS, AUDIO_SOURCE_KINDS,
    parseTrigger, serializeTrigger,
    parseTagSource, serializeTagSource,
    parseAudioSource, serializeAudioSource,
    validateDialogueLines, serializeDialogueBlock, parseDialogueBlock,
    parseLegacyWaypointLines, mergeDialogueIntoRawXml,
    exportForKate, importFromKate,
  };
});

const D = window.MCCFDialogue;

var ACTORS = [];

var lines = [];

var selectedId = null;
var apiBaseUrl = '';
var sceneName = '';
var loadedRawXml = null; // raw scene XML text once loaded, else null

function apiBase() { return apiBaseUrl.replace(/\/$/, ''); }

// Small POST-JSON helper — this file otherwise inlines fetch() at each call
// site (see the Chorus functions); added here rather than following that
// pattern a third time, since Run Arc's /arc/record and /arc/export calls
// don't need streaming (unlike /voice/speak, which stays a raw fetch with
// its own reader loop above).
async function apiPost(path, body) {
  const resp = await fetch(`${apiBase()}${path}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!resp.ok) {
    const errText = await resp.text().catch(() => '');
    throw new Error(`HTTP ${resp.status}${errText ? ' — ' + errText.slice(0, 200) : ''}`);
  }
  return resp.json();
}
function onApiBaseChange(v) { apiBaseUrl = v; }

function uid(prefix) {
  let id;
  do { id = prefix + '_' + Math.random().toString(36).slice(2, 7); } while (lines.some((l) => l.id === id));
  return id;
}

function triggerBadgeClass(t) {
  if (t.type === 'declared') return 'declared';
  if (t.type === 'sensed') return 'sensed';
  if (t.type === 'legacy-waypoint') return 'legacy';
  if (t.type === 'arc-complete') return 'arc-complete';
  return '';
}
function triggerBadgeText(t) {
  switch (t.type) {
    case 'scene-start': return 'scene-start';
    case 'zone': return 'zone: ' + (t.zone || '?');
    case 'touch': return 'touch: ' + (t.sensor || '?');
    case 'sensed': return 'sensed: ' + (t.lineId || '?');
    case 'declared': return 'T=' + (t.time != null ? t.time : '?') + 's';
    case 'arc-complete': return 'arc-complete' + (t.zone ? (': ' + t.zone) : '');
    case 'legacy-waypoint': return 'legacy: ' + (t.waypoint || '?');
    default: return t.type;
  }
}

function esc(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

// ── validation (computed fresh every render) ────────────────────────────
var lastValidation = { valid: true, errors: [] };

function lineErrorsFor(id) {
  return lastValidation.errors.filter((e) => e.includes(`(${id})`));
}

function renderValBadge() {
  const badge = document.getElementById('val-badge');
  if (lastValidation.valid) {
    badge.className = 'val-badge ok';
    badge.textContent = `✓ ${lines.length} line${lines.length === 1 ? '' : 's'} valid`;
    badge.onclick = null;
    badge.title = '';
  } else {
    badge.className = 'val-badge err';
    badge.textContent = `⚠ ${lastValidation.errors.length} error${lastValidation.errors.length === 1 ? '' : 's'}`;
    badge.title = lastValidation.errors.join('\n');
  }
}

// ── rendering: line list ───────────────────────────────────────────────
function renderList() {
  const el = document.getElementById('line-list');
  el.innerHTML = lines.map((l) => {
    const errs = lineErrorsFor(l.id);
    return `
    <div class="line-card ${l.id === selectedId ? 'active' : ''} ${errs.length ? 'invalid' : ''}" onclick="selectLine('${l.id}')">
      <div class="lc-top">
        <span class="lc-actor">${esc(l.actor)}</span>
        <span class="lc-type">${l.type}</span>
        <span style="flex:1"></span>
        <span class="badge badge-trigger ${triggerBadgeClass(l.trigger)}">${esc(triggerBadgeText(l.trigger))}</span>
      </div>
      <div class="lc-text">${esc(l.text || '(empty)')}</div>
      <div class="lc-flags">
        ${errs.length ? '<span class="flag-dot invalid-mark" title="' + esc(errs.join('; ')) + '"></span>' : ''}
        ${l.blocking ? '<span class="flag-dot blocking" title="blocking"></span>' : ''}
        <span class="flag-dot ${l.mode}" title="${l.mode}"></span>
        ${l.audioFile ? '<span class="flag-dot has-audio" title="has audio"></span>' : ''}
        ${l._isChorus ? '<span style="font-size:9px;color:var(--purple);margin-left:2px">CHORUS</span>' : ''}
      </div>
    </div>
  `;
  }).join('');
}

// ── rendering: editor ───────────────────────────────────────────────────
function provClass(src) {
  if (src.type === 'algorithmic') return 'prov-algorithmic';
  if (src.type === 'authored') return 'prov-authored';
  return 'prov-llm';
}
function provLabel(src) {
  if (src.type === 'algorithmic') return 'algorithmic suggestion';
  if (src.type === 'authored') return 'authored by you';
  if (src.type === 'llm-interpreted') return 'interpreted by ' + src.name;
  return 'unrecognized provenance';
}

function renderTriggerParam(l) {
  const t = l.trigger;
  if (t.type === 'zone') return `<div style="margin-top:8px"><input type="text" value="${esc(t.zone || '')}" placeholder="zone id" oninput="updateTriggerParam('zone', this.value)"></div>`;
  if (t.type === 'touch') return `<div style="margin-top:8px"><input type="text" value="${esc(t.sensor || '')}" placeholder="sensor name" oninput="updateTriggerParam('sensor', this.value)"></div>`;
  if (t.type === 'declared') return `<div style="margin-top:8px"><input type="number" value="${t.time != null ? t.time : ''}" placeholder="seconds" oninput="updateTriggerParam('time', parseFloat(this.value))"></div>`;
  if (t.type === 'sensed') return `<div style="margin-top:8px">
    <select onchange="updateTriggerParam('lineId', this.value)">
      ${lines.filter((x) => x.id !== l.id).map((x) => `<option value="${x.id}" ${x.id === t.lineId ? 'selected' : ''}>${x.id} — ${esc((x.text || '').slice(0, 30))}</option>`).join('')}
    </select></div>`;
  if (t.type === 'arc-complete') return `<div style="margin-top:8px"><input type="text" value="${esc(t.zone || '')}" placeholder="zone id (optional — blank fires on ANY arc completing)" oninput="updateTriggerParam('zone', this.value)"></div>`;
  return '';
}

function renderEditor() {

    ${errs.length ? `<div class="line-errors"><b>${errs.length} issue${errs.length === 1 ? '' : 's'} on this line:</b><ul>${errs.map((e) => `<li>${esc(e)}</li>`).join('')}</ul></div>` : ''}

    <div class="section-title">Line</div>
    <div class="field-row">

        </select>

        ${l.trigger.type === 'arc-complete' ? '<div class="hint">Fires when a Chorus arc completes — bare (bl' + 'ank zone) fires on any arc scene-wide, a zone id scopes it to that zone\'s Chorus only. Goes through the same interrupt/wait/overlap collision handling as a declared step.</div>' : ''}
      </div>

        <div class="hint">Clean, untagged — what sentiment analysis reads. Never contains delivery tags.</div>
      </div>

    <div class="section-title">Delivery — ElevenLabs tags</div>
    <div class="field-row">
      <div class="field">
        <label>ttsText</label>
        <textarea rows="3" oninput="onTtsTextEdit(this.value)" placeholder="falls back to Text above if left empty">${esc(l.ttsText || '')}</textarea>
        <div class="provenance-row">
          ${l.tagSource ? `<span class="prov-badge ${provClass(l.tagSource)}">${esc(provLabel(l.tagSource))}</span>` : '<span class="hint">no tag source yet</span>'}
        </div>

    <div class="section-title">Audio</div>

        </select>
        <!-- Day 84: real bug, found the moment real ElevenLabs audio existed
             to attach — this field used to be a read-only <span>. There was
             no file-browse/drag-drop UI at all, and no way through this UI
             to actually set audioFile to a real path. Made directly
             editable as the fast, certain fix — a smarter "browse real
             server files" picker (the same /media/list endpoint Composer's
             zone-sound picker already uses) is a real possible upgrade
             later, but this tool's own draft-path convention
             (media/dialogue/<scene>/<id>.wav, see mockGenerateAudio) was
             found NOT to match the convention used elsewhere in the

        <div class="audio-row">

// ── rendering: preview panel ───────────────────────────────────────────

    ${err ? `<div class="preview-error"><b>Preview failed:</b> ${esc(err)}<br><br>Check the API base in the header — if this tool isn't served by the real mccf_api.py, /voice/preview has nothing to reach.</div>` : ''}

        <div style="margin-top:10px"><button class="pill-btn" style="width:100%" onclick="acceptSuggestedTag()">Insert into ttsText</button></div>

function renderAll() {
  lastValidation = D.validateDialogueLines(lines);
  renderValBadge();
  document.getElementById('scene-label').textContent = sceneName ? ' — ' + sceneName : '';
  renderList();
  renderEditor();
  renderPreview();
}

// ── preview: real /voice/preview call ───────────────────────────────────
async function runPreview() {
  const l = lines.find((x) => x.id === selectedId);
  if (!l || !l.text.trim()) return;
  l._previewLoading = true;
  l._previewError = null;
  renderPreview();
  try {
    const resp = await fetch(`${apiBase()}/voice/preview`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: l.text }),
    });
    if (!resp.ok) {
      const body = await resp.text().catch(() => '');
      throw new Error(`HTTP ${resp.status}${body ? ' — ' + body.slice(0, 200) : ''}`);
    }
    const data = await resp.json();
    l._preview = data;
    l._previewError = null;
  } catch (e) {
    l._previewError = e.message || String(e);
    l._preview = null;
  } finally {
    l._previewLoading = false;
    renderPreview();
  }
}

// Snapshot the analysis's E/B/P/S weights onto the line itself, at the
// moment a tag actually gets committed to ttsText. Without this, the
// weights _preview.weights holds only exist as long as this session's
// in-memory preview state does — l._preview is discarded on navigation
// or re-analysis, and was never part of what gets sent to Composer or
// written into the exported <Line> element. Any downstream consumer
// that wants "this line's emotional weight" as an EBPS-fielded input
// had nothing to read. Captured regardless of signal strength — even a
// "no strong signal — natural delivery" result is a real value (all
// four channels near-neutral), not an absence of one, and locking it
// in alongside whichever tag the author accepted keeps the two
// consistent with each other rather than one drifting from the other
// on a later re-analysis.
function _captureEmoteWeights(l) {
  if (l._preview && l._preview.weights) {
    l.emoteWeights = {
      E: l._preview.weights.E,
      B: l._preview.weights.B,
      P: l._preview.weights.P,
      S: l._preview.weights.S,
    };
  }
}

function acceptSuggestedTag() {
  const l = lines.find((x) => x.id === selectedId);
  if (!l || !l._preview) return;
  l.ttsText = l._preview.suggested_tts_text;
  l.tagSource = { type: 'algorithmic' };
  _captureEmoteWeights(l);
  renderAll();
}

// ── interactions ────────────────────────────────────────────────────────
function selectLine(id) { selectedId = id; renderAll(); }

function updateField(field, value) {
  const l = lines.find((x) => x.id === selectedId);
  if (!l) return;
  l[field] = value;
  renderAll();
}

function onTtsTextEdit(value) {
  const l = lines.find((x) => x.id === selectedId);
  if (!l) return;
  if (value === '') {
    // Fully cleared — drop all three fields rather than leaving stale
    // data behind. emoteWeights was captured alongside whichever tag
    // is being removed here; keeping it around after the tag is gone
    // would let a future read see weights with no corresponding tag to
    // explain where they came from.
    delete l.ttsText;
    delete l.tagSource;
    delete l.emoteWeights;
  } else {
    l.ttsText = value;
    l.tagSource = { type: 'authored' }; // editing by hand promotes provenance, same rule as the real design
  }
  renderAll();
}

function insertTag(tag) {
  const l = lines.find((x) => x.id === selectedId);
  if (!l) return;
  // Tags land immediately before the segment they modify (ElevenLabs
  // placement convention, same as build_tts_text in mccf_voice_api.py) —
  // prefix, not append. Initialize from the clean text if there's no
  // ttsText yet, so a tag chip click never produces a tag with no text.
  const base = l.ttsText || l.text;
  l.ttsText = `[${tag}] ${base}`;
  l.tagSource = { type: 'authored' };
  // Manually choosing a tag from the toolbar is still "accepting a
  // tag" — just not necessarily the algorithmic suggestion. If
  // analysis has been run on this line (l._preview exists), the
  // weights it produced describe the line's actual text regardless of
  // which specific tag the author ultimately picked, so the same
  // capture applies here as in acceptSuggestedTag(). No-ops silently
  // if no analysis has been run yet — nothing to capture in that case.
  _captureEmoteWeights(l);
  renderAll();
}

function updateAudioSource(typeStr) {
  const l = lines.find((x) => x.id === selectedId);
  if (!l) return;
  if (!typeStr) {
    delete l.audioSource;
    delete l.audioFile;
  } else {
    l.audioSource = typeStr === 'other-engine' ? { type: 'other-engine', name: '' } : { type: typeStr };
    if (!l.audioFile) l.audioFile = ''; // needs a real path before this validates — Generate draft fills it
  }
  renderAll();
}

// Day 84: the real file-attachment path, added the moment real ElevenLabs
// audio existed to attach and there was no way to actually do it through
// this UI. Defensive on the audioFile/audioSource pairing the validator
// requires (see validateDialogueLines' own rule: an audio path with no
// recorded provenance can't be trusted or distrusted later) — if someone
// types a path directly without picking Source first, this defaults
// audioSource to elevenlabs (the actual real-world case tonight) rather
// than leaving the line silently invalid. The Source dropdown stays fully
// editable afterward if that default is wrong for a given line.
function updateAudioFile(value) {
  const l = lines.find((x) => x.id === selectedId);
  if (!l) return;
  const trimmed = (value || '').trim();
  if (!trimmed) {
    delete l.audioFile;
    renderAll();
    return;
  }
  l.audioFile = trimmed;
  if (!l.audioSource) l.audioSource = { type: 'elevenlabs' };
  renderAll();
}

function updateTriggerType(type) {
  const l = lines.find((x) => x.id === selectedId);
  if (!l) return;
  if (type === 'scene-start') l.trigger = { type };
  else if (type === 'zone') l.trigger = { type, zone: '' };
  else if (type === 'touch') l.trigger = { type, sensor: '' };
  else if (type === 'sensed') {
    // Day 84: real bug fix, confirmed live — this used to default to
    // lines.find(x => x.id !== l.id), which is always the FIRST line in
    // the array (unless this line itself is first), not "whichever line
    // comes before this one." Switching each line's type to 'sensed' one
    // at a time while authoring a sequential monologue silently defaulted
    // every one of them to the same first-line target unless the author
    // caught and manually overrode it every single time — that's what
    // produced 45 of 47 real lines all pointing at line 1. Now defaults
    // to the line immediately before this one in the list, which is what
    // an author building a sequential chain actually wants almost every
    // time. Falls back to '' (forcing a deliberate choice) only if this
    // is genuinely the first line in the list, where "the line before it"
    // doesn't exist.
    const idx = lines.findIndex((x) => x.id === l.id);
    const prevLine = idx > 0 ? lines[idx - 1] : null;
    l.trigger = { type, lineId: prevLine ? prevLine.id : '' };
  }
  else if (type === 'declared') l.trigger = { type, time: 0 };
  else if (type === 'arc-complete') l.trigger = { type };
  renderAll();
}
function updateTriggerParam(key, value) {
  const l = lines.find((x) => x.id === selectedId);
  if (!l) return;
  l.trigger[key] = value;
  renderAll();
}

function mockGenerateAudio() {
  const l = lines.find((x) => x.id === selectedId);
  if (!l) return;
  if (!l.audioSource) l.audioSource = { type: 'elevenlabs' };
  l.audioFile = `media/dialogue/${sceneName || 'untitled'}/${l.id}.wav`;
  renderAll();
}

function addLine() {
  if (ACTORS.length === 0) {
    toast('No actors available yet — receive scene data from Composer (or load a scene) first.', true);
    return;
  }
  const id = uid('line_new');
  lines.push({
    id, actor: ACTORS[0], type: 'Statement', mode: 'improv', blocking: false,
    trigger: { type: 'scene-start' }, text: '',
  });
  selectedId = id;
  renderAll();
}

function deleteLine() {
  const l = lines.find((x) => x.id === selectedId);
  if (!l) return;
  if (!confirm(`Delete "${l.id}"? This can't be undone within the editor (nothing is saved until you export).`)) return;
  lines = lines.filter((x) => x.id !== l.id);
  selectedId = lines.length ? lines[0].id : null;
  renderAll();
}

// ── Split monologue into lines ──────────────────────────────────────────
// A long continuous speech, authored one line at a time via addLine(), was
// real friction the first time this tool needed to hold an actual scene
// monologue rather than a short exchange. Splits pasted prose into one
// Statement line per unit, all assigned to one actor, and chains them with
// 'sensed' triggers — line N's trigger is {type:'sensed', lineId: line
// N-1's id} — rather than 'declared:<time>'. That's deliberate: for a
// monologue we don't know any line's real duration until its audio exists
// (see the Day-83 conversation on this), so a time-based trigger would
// need constant renumbering as audio lands. A sensed-chain has no such
// problem — each line simply starts when the previous one finishes,
// whatever that turns out to take, and never needs touching again once
// chained.
//
// Two split modes, not one — tested directly against a real scene speech
// before shipping this, and the two conventions produce very different
// results. Blank-line-separated paragraphs assumed first, but that speech
// mostly separates its actual spoken beats with single line breaks (one
// sentence or short thought per line) and only occasionally uses a blank
// line for a larger section break — splitting on blank lines alone
// produced three ~1000-character blocks, useless as individual audio
// cues. Splitting on every line break instead produced seven well-sized,
// natural lines. Defaulting to every-line-break since it matched the real
// text tested against; blank-line mode stays available for prose that
// genuinely uses paragraph breaks as its unit.
// ── Bulk-assign audio ────────────────────────────────────────────────────
// Day 84: real ElevenLabs output exists now, named by sequential position
// (GGSc01Line1.mp3, GGSc01Line2.mp3, ...) rather than by this tool's own
// internal line ids — the "joined purely by id" design assumed a naming
// convention nobody actually used once real files existed. Rather than
// force 47 manual pastes, this matches file position to line position in
// the CURRENT authoring order (the same order Re-chain Sequentially uses)
// — position 1 = first line in the list, and so on.
//
// Folder path and filename pattern are both typed fields, not hardcoded —
// confirmed live tonight that the obvious first guess at a servable path
// (scenes/...) 404'd, and the working one moved again right after that
// (X3DAssets/Dialog → X3DAssets/<SceneName>/Dialog) for future multi-scene
// organization. Baking either into code would have needed editing again
// for scene two. {n} in the pattern is the 1-based line position.
function openBulkAssignAudioModal() {
  if (lines.length === 0) {
    toast('No lines to assign audio to yet.', true);
    return;
  }
  document.getElementById('modal-title').textContent = 'Bulk-assign audio by position';
  document.getElementById('modal-body').innerHTML = `
    <p>Matches audio files to lines by <b>position in the current list</b> (line 1 → file 1, line 2 → file 2, ...) — not by id. Confirm the folder path actually serves files before applying (a quick way to check: paste the full built URL for file 1 into a new browser tab).</p>
    <p style="color:var(--warm)">This tool has no way to check the server for how many files actually exist — it writes paths from the pattern regardless. If the real folder has fewer files than lines (46 files were reported for these 47 lines earlier tonight), the last line(s) will get a path that may not exist. Verify the last line specifically after applying.</p>
    <div class="field-row">
      <label>Folder path (relative to /static/, no leading or trailing slash)</label>
      <input type="text" id="bulk-audio-folder" value="x3d/X3DAssets/${esc(sceneName || '')}/Dialog" style="width:100%">
    </div>
    <div class="field-row">
      <label>Filename pattern — <code>{n}</code> is the 1-based line position</label>
      <input type="text" id="bulk-audio-pattern" value="GGSc01Line{n}.mp3" style="width:100%">
    </div>
    <div id="bulk-audio-preview" style="margin-top:10px;font-size:12px;color:var(--dim)"></div>
  `;
  document.getElementById('modal-foot').innerHTML = `
    <div class="modal-foot-left"></div>
    <div class="modal-foot-right"><button class="pill-btn primary" onclick="applyBulkAssignAudio()">Assign to all ${lines.length} line(s)</button></div>
  `;
  document.getElementById('modal-overlay').classList.add('show');

  // Live preview as the folder/pattern fields change, so a typo is visible
  // before committing rather than after.
  function updatePreview() {
    const folder = document.getElementById('bulk-audio-folder').value.replace(/^\/|\/$/g, '');
    const pattern = document.getElementById('bulk-audio-pattern').value;
    const first = pattern.replace('{n}', '1');
    const last = pattern.replace('{n}', String(lines.length));
    document.getElementById('bulk-audio-preview').innerHTML =
      `Line 1 → <code>${esc(folder)}/${esc(first)}</code><br>` +
      `Line ${lines.length} → <code>${esc(folder)}/${esc(last)}</code>` +
      (lines.length > 1 ? `<br><span style="color:var(--dim)">(lines 2 through ${lines.length - 1} follow the same pattern)</span>` : '');
  }
  document.getElementById('bulk-audio-folder').addEventListener('input', updatePreview);
  document.getElementById('bulk-audio-pattern').addEventListener('input', updatePreview);
  updatePreview();
}

function applyBulkAssignAudio() {
  const folder = document.getElementById('bulk-audio-folder').value.replace(/^\/|\/$/g, '');
  const pattern = document.getElementById('bulk-audio-pattern').value;
  if (!pattern.includes('{n}')) {
    toast('Pattern must include {n} for the line position.', true);
    return;
  }
  if (!confirm(`Assign audio to all ${lines.length} line(s) by position, using this pattern? This overwrites any audioFile already set on every line.`)) {
    return;
  }
  lines.forEach((l, idx) => {
    const filename = pattern.replace('{n}', String(idx + 1));
    l.audioFile = folder ? `${folder}/${filename}` : filename;
    if (!l.audioSource) l.audioSource = { type: 'elevenlabs' };
  });
  closeModal();
  renderAll();
  toast(`Assigned audio to ${lines.length} line(s) by position — verify a few individually, especially the last one, before trusting all of them.`);
}


// ── Re-chain sequentially ────────────────────────────────────────────────
// Day 84: built after a live, confirmed bug — not in this tool's own code,
// in the authored data. Manually re-entering ~47 lines' triggers one at a
// time via the "which line" dropdown is exactly the kind of repetitive
// task where the dropdown can silently keep its last value instead of
// being updated fresh per line — 45 of 47 lines ended up all pointing at
// the SAME sensed target instead of each pointing at the one before it.
// The dialogue-firing system itself worked exactly as designed once that
// happened: all 45 fired in one synchronous burst the moment their shared
// target finished, flooding the speech queue, with only the last one
// queued actually surviving to be spoken. Confirmed against the real
// exported <Dialogue> XML (grep on trigger="..." showed the count
// directly), not guessed.
//
// This rebuilds every line's trigger from the CURRENT order of `lines` —
// the same order shown in the left-hand list, which is authoring order,
// not necessarily insertion order if lines have been reordered — chaining
// line N to line N-1 via sensed, exactly matching what Split Monologue
// already does for freshly-created lines. The first line's trigger is
// left untouched (whatever real starting trigger — declared/scene-start/
// zone/etc. — was already authored for it), since only the sensed chain
// itself was ever the problem.
function rechainSequentially() {
  if (lines.length < 2) {
    toast('Need at least 2 lines to chain.', true);
    return;
  }
  if (!confirm('Re-chain all ' + lines.length + ' lines sequentially (line 2 onward set to sensed: the line right before it)? Line 1\'s own trigger is left as-is. This overwrites every other line\'s current trigger.')) {
    return;
  }
  for (var i = 1; i < lines.length; i++) {
    lines[i].trigger = { type: 'sensed', lineId: lines[i - 1].id };
  }
  renderAll();
  toast('Re-chained ' + (lines.length - 1) + ' line(s) sequentially — line 1\'s trigger left unchanged.');
}

function openSplitMonologueModal() {
  if (ACTORS.length === 0) {
    toast('No actors available yet — receive scene data from Composer (or load a scene) first.', true);
    return;
  }
  document.getElementById('modal-title').textContent = 'Split monologue into lines';
  const actorOpts = ACTORS.map((a) => `<option value="${esc(a)}">${esc(a)}</option>`).join('');
  document.getElementById('modal-body').innerHTML = `
    <p>Paste the full speech. Splits into one <b>Statement</b> line per unit, all assigned to the actor below, chained with <code>sensed</code> triggers so each line starts when the previous one's audio finishes — no need to know any line's real duration yet. <code>mode</code> is set to <b>static</b> (this is authored text, not improv). The first line's trigger is whatever you pick below; edit any line's trigger afterward the normal way.</p>
    <div class="field-row">
      <label>Split on</label>
      <select id="split-mode">
        <option value="line">Every line break (one beat/sentence per line)</option>
        <option value="paragraph">Blank lines only (paragraph breaks)</option>
      </select>
    </div>
    <div class="field-row">
      <label>Actor</label>
      <select id="split-actor">${actorOpts}</select>
    </div>
    <div class="field-row">
      <label>First line's trigger</label>
      <select id="split-first-trigger">
        <option value="scene-start">scene-start</option>
        <option value="touch">touch:&lt;sensor&gt; (edit after splitting)</option>
        <option value="zone">zone:&lt;zone&gt; (edit after splitting)</option>
        <option value="declared">declared:0 (edit the time after splitting)</option>
      </select>
    </div>
    <textarea id="split-text" placeholder="Paste the full speech here." style="min-height:280px"></textarea>
    <div id="split-msg"></div>
  `;
  document.getElementById('modal-foot').innerHTML = `
    <div class="modal-foot-left"></div>
    <div class="modal-foot-right"><button class="pill-btn primary" onclick="applySplitMonologue()">Split into lines</button></div>
  `;
  document.getElementById('modal-overlay').classList.add('show');
}

function applySplitMonologue() {
  const msgEl = document.getElementById('split-msg');
  const raw = document.getElementById('split-text').value;
  const actor = document.getElementById('split-actor').value;
  const splitMode = document.getElementById('split-mode').value;
  const firstTriggerType = document.getElementById('split-first-trigger').value;

  var units;
  if (splitMode === 'paragraph') {
    // Blank-line-separated blocks; collapse any internal single line
    // breaks within a block to spaces, since within a paragraph they're
    // just source-text wrapping, not a real break.
    units = raw.split(/\n\s*\n+/).map((p) => p.replace(/\s*\n\s*/g, ' ').trim());
  } else {
    // Every line break is a real unit boundary — the default, matching
    // the convention this feature was actually tested against.
    units = raw.split(/\n+/).map((p) => p.trim());
  }
  const paragraphs = units.filter((p) => p.length > 0);

  if (paragraphs.length === 0) {
    if (msgEl) msgEl.innerHTML = '<div class="modal-err">Nothing to split — paste some text first.</div>';
    return;
  }

  const newLines = [];
  let prevId = null;
  paragraphs.forEach((text) => {
    const id = uid('line_' + actor.toLowerCase());
    const trigger = prevId
      ? { type: 'sensed', lineId: prevId }
      : (firstTriggerType === 'declared' ? { type: 'declared', time: 0 }
         : firstTriggerType === 'touch'   ? { type: 'touch', sensor: '' }
         : firstTriggerType === 'zone'    ? { type: 'zone', zone: '' }
         : { type: 'scene-start' });
    newLines.push({
      id, actor, type: 'Statement', mode: 'static', blocking: true,
      trigger, text,
    });
    prevId = id;
  });

  lines = lines.concat(newLines);
  selectedId = newLines[0].id;
  closeModal();
  renderAll();
  toast(`Split into ${newLines.length} line(s) for ${actor}, chained in order`);
}

async function loadSceneFromServer() {
  const msgEl = document.getElementById('load-scene-msg');
  if (!sceneName.trim()) {
    if (msgEl) msgEl.innerHTML = '<div class="modal-err">Set a scene name in the header first.</div>';
    return;
  }
  try {
    const resp = await fetch(`${apiBase()}/scene/load/scene/raw`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ scene_name: sceneName.trim() }),
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const contentType = resp.headers.get('content-type') || '';
    let raw;
    if (contentType.includes('application/json')) {
      const data = await resp.json();
      raw = data.xml || data.raw || data.content || data.scene_xml || '';
      if (!raw) throw new Error('server returned JSON but no xml/raw/content/scene_xml field — response shape didn\'t match what this tool expected');
    } else {
      raw = await resp.text();
    }
    applyLoadedSceneXml(raw);
  } catch (e) {
    if (msgEl) msgEl.innerHTML = `<div class="modal-err">Server load failed: ${esc(e.message || String(e))}<br><br>Use paste/file load above instead — that path never depends on this endpoint matching.</div>`;
  }
}
