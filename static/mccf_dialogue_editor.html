// ── Import from Chorus ──────────────────────────────────────────────────
// Day 84: the piece flagged as missing two sessions ago, now built.
// /chorus/captured_lines has been sitting ready this whole time — its own
// docstring says exactly this: "read-only reporting for whatever
// eventually does the promotion (the not-yet-built Dialogue editor, most
// likely)." That's this. Confirmed shape directly from the real
// mccf_chorus.py source: {"lines": [{id, actor, type, mode, blocking,
// trigger, text}, ...]} — already this tool's own Line shape, minus the
// optional ttsText/audioFile fields, which is fine since those are
// optional everywhere else too.
//
// Deliberately review-then-promote, not auto-import-everything: a Chorus
// take may be genuinely good, genuinely bad, or a mix — the whole point
// of the per-take capture design (see mccf_chorus.py's own comments) is
// that promotion stays a real editorial decision, not an automatic merge.
// ── Generate Chorus response (in situ) ──────────────────────────────────
// Day 84: the redesign discussed tonight — generate Chorus's response HERE,
// at authoring time, from the complete authored transcript, rather than
// relying on the live arc-complete runtime trigger (which has real,
// separate problems: fires before dialogue finishes, tied to waypoint arc
// completion rather than dialogue completion, real Ollama latency with
// nothing to fill the wait during live playback). None of those problems
// exist here — the full transcript already sits in `lines`, so there's no
// "is dialogue done yet" question to answer at all.
//
// Verified the real server capability before building this (not guessed):
// ChorusManager.fire_chorus_from_transcript(transcript, cv) takes an
// arbitrary transcript string directly — no live scene state, no arc file
// lookup. Real REST shape: POST /chorus/load {scene_name} to ensure the
// zone's <Chorus> config is current, then POST /chorus/fire {transcript,
// cv, scene_name} (returns immediately, fires async), then poll
// /chorus/state for the result — same fire-and-poll shape the Loader
// itself already uses for live playback.
//
// Real prerequisite, checked rather than assumed: a captured, character-
// voiced Line only gets produced if the scene's <Chorus> element has
// voice_actor set. /chorus/load's response doesn't confirm this directly
// (no voice_actor field returned), so this checks indirectly — captured
// line count before vs. after firing. If it didn't grow, that's a real,
// visible signal to go check the zone config, not a silent gap.
//
// Deliberately does NOT duplicate Import from Chorus's own review/insert
// UI — once a response is ready, this just tells you to use that existing
// button, so there's one place captured lines get reviewed, not two.
function openGenerateChorusModal() {
  const transcriptLines = lines.filter((l) => l.trigger.type !== 'arc-complete' && (l.text || '').trim());
  if (transcriptLines.length === 0) {
    toast('No real dialogue lines to build a transcript from yet.', true);
    return;
  }
  const transcript = transcriptLines.map((l) => `${l.actor}: ${l.text.trim()}`).join('\n');
  window._pendingChorusTranscript = transcript; // same pattern as _chorusCapturedCache below — avoids embedding a large, multi-line string into an HTML attribute

  document.getElementById('modal-title').textContent = 'Generate Chorus response';
  document.getElementById('modal-body').innerHTML = `
    <p>Builds a transcript from the ${transcriptLines.length} real dialogue line(s) currently authored (excludes any arc-complete placeholder line), sends it to this scene's configured Chorus LLM, and waits for a response. This can take a while — Ollama's response time is a known variable, not a bug.</p>
    <p style="color:var(--warm)">Requires this scene's &lt;Chorus&gt; zone element to have <code>voice_actor</code> set to get a real, capturable, character-voiced line — not just generic commentary. This will check and tell you which you got.</p>
    <div style="max-height:120px;overflow-y:auto;background:#0a0e18;padding:8px;border-radius:4px;font-size:11.5px;color:var(--dim);margin:10px 0">${esc(transcript)}</div>
    <div id="chorus-gen-status" style="margin-top:10px"></div>
  `;
  document.getElementById('modal-foot').innerHTML = `
    <div class="modal-foot-left"></div>
    <div class="modal-foot-right"><button class="pill-btn primary" id="chorus-gen-fire-btn" onclick="fireChorusGeneration()">Fire Chorus</button></div>
  `;
  document.getElementById('modal-overlay').classList.add('show');
}

async function fireChorusGeneration() {
  const transcript = window._pendingChorusTranscript || '';
  const statusEl = document.getElementById('chorus-gen-status');
  const fireBtn = document.getElementById('chorus-gen-fire-btn');
  if (fireBtn) fireBtn.disabled = true;

  const setStatus = (msg, isErr) => { if (statusEl) statusEl.innerHTML = `<p style="color:${isErr ? 'var(--danger)' : 'var(--dim)'}">${esc(msg)}</p>`; };

  // Count captured lines BEFORE firing — the only reliable way to tell,
  // after the fact, whether this firing actually produced a real captured
  // line (voice_actor configured) or just base commentary (not).
  let beforeCount = 0;
  try {
    const beforeResp = await fetch(`${apiBase()}/chorus/captured_lines`).then((r) => r.json());
    beforeCount = ((beforeResp && beforeResp.lines) || []).length;
  } catch (e) {
    setStatus('Could not check current captures before firing — ' + e.message, true);
    if (fireBtn) fireBtn.disabled = false;
    return;
  }

  setStatus('Loading this scene\'s Chorus config…');
  let loadResp;
  try {
    loadResp = await fetch(`${apiBase()}/chorus/load`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ scene_name: sceneName || '' }),
    }).then((r) => r.json());
  } catch (e) {
    setStatus('Load failed — ' + e.message, true);
    if (fireBtn) fireBtn.disabled = false;
    return;
  }
  if (!loadResp || !loadResp.active) {
    setStatus('No active Chorus config for this scene — ' + ((loadResp && loadResp.reason) || 'unknown reason') + '. Set scene name above and try again.', true);
    if (fireBtn) fireBtn.disabled = false;
    return;
  }

  setStatus(`Chorus config active (LLM: ${loadResp.llm || '?'}). Firing…`);
  try {
    await fetch(`${apiBase()}/chorus/fire`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ transcript, scene_name: sceneName || '' }),
    });
  } catch (e) {
    setStatus('Fire failed — ' + e.message, true);
    if (fireBtn) fireBtn.disabled = false;
    return;
  }

  // Poll — same fire-and-poll shape the Loader itself uses for live
  // playback. Ollama's own timing is a known, real variable; no fixed
  // guess at how long this should take.
  const startTime = Date.now();
  const poll = async () => {
    const elapsed = Math.round((Date.now() - startTime) / 1000);
    let state;
    try {
      state = await fetch(`${apiBase()}/chorus/state`).then((r) => r.json());
    } catch (e) {
      setStatus(`Waiting… (${elapsed}s elapsed, last check failed: ${e.message})`);
      setTimeout(poll, 3000);
      return;
    }
    if (state && state.pending) {
      setStatus(`Waiting on the LLM… (${elapsed}s elapsed)`);
      setTimeout(poll, 3000);
      return;
    }
    if (!state || !state.text) {
      setStatus(`No response after ${elapsed}s — check the server console for a Chorus error.`, true);
      if (fireBtn) fireBtn.disabled = false;
      return;
    }
    // Response is in. Check whether it actually became a captured line.
    let afterCount = beforeCount;
    try {
      const afterResp = await fetch(`${apiBase()}/chorus/captured_lines`).then((r) => r.json());
      afterCount = ((afterResp && afterResp.lines) || []).length;
    } catch (e) { /* non-fatal — still show the response text either way */ }

    const gotCapture = afterCount > beforeCount;
    statusEl.innerHTML = `
      <p style="color:var(--accent)">Response ready (${elapsed}s):</p>
      <div style="background:#0a0e18;padding:8px;border-radius:4px;font-size:12px;margin:6px 0">${esc(state.text)}</div>
      ${gotCapture
        ? `<p style="color:var(--accent)">Captured as a real line (voice_actor is configured) — click <b>Import from Chorus</b> to bring it in.</p>`
        : `<p style="color:var(--warm)">Not captured as a real line — this scene's &lt;Chorus&gt; element likely doesn't have voice_actor set. This is base commentary only, not something Import from Chorus will find. Set voice_actor on the zone's Chorus config to get a real, importable line.</p>`}
    `;
    if (fireBtn) fireBtn.disabled = false;
  };
  poll();
}

// ── Generate improv lines + Run Arc (batch persist) ─────────────────────
// Carries the waypoint (Constitutional tool) mechanism over into this
// editor, per direct intent: "an API call to the LLM fired on an empty
// response line... my intent... was to assign a character to the LLM such
// that it could potentially ask questions, respond, or make statements in
// character." Generalizes the waypoint version (reply-only, fired on an
// empty Response) to all three LINE_TYPES, since a dialogue line isn't
// always a reply the way a waypoint always was.
//
// TWO SEPARATE ACTIONS, deliberately not one pass — this was the first
// version's real mistake. LLM output is chatty and needs editing before
// its EBPS gets locked in; persistence has to happen post-edit, the same
// two-step shape Chorus already uses (generate → review/edit → explicit
// import/persist), not fused into one generate-and-record pass:
//   1. "Generate improv lines" — fires LLM generation for every improv-mode
//      line with empty text, writes the result into l.text, and STOPS.
//      No /arc/record call anywhere in this step. The author reviews and
//      edits the generated lines exactly like any other line afterward,
//      in the normal editor — this step never touches EBPS at all.
//   2. "Run Arc (batch persist)" — separate action, walks every real line
//      (static, edited-improv, Chorus-imported — all identical by this
//      point, just text on a line) and calls /arc/record in sequence.
//      Purely a persistence pass now — no generation, no LLM calls. A
//      line with a mode of 'improv' that's STILL empty (never generated,
//      or generated then cleared) is skipped with a visible count, not
//      silently dropped or auto-generated on the fly.
//
// Both on-demand only — explicit buttons, never automatic on typing or
// line creation, matching the whole editor's on-demand EBPS philosophy.
//
// Walks `lines` in array order (not the sensed-chain graph — dialogue is
// linear in practice, and this matches how Composer's own Record Arc walks
// Paths in order).
//
// Generation deliberately sets record_to_field:false on every /voice/speak
// call. /voice/speak's own internal record_to_field:true write uses a
// cruder sentiment-only CV and (confirmed this session) writes to a
// hardcoded, non-scope-aware field reference — moot here anyway now that
// generation and recording are separate steps, but kept false on principle:
// generation should never silently touch field state on its own.
//
// Run Arc persists the whole run as a real arc export (/arc/export — the
// same scenes/<scene>/arcs/<take>/arc_<id>.xml format Composer produces),
// not just an in-memory display — this is what finally gives a dialogue
// scene queryable historical EBPS data, the same substrate already
// identified for validating whether P (or any channel) carries real
// predictive information rather than just lexical register.

let _runArcResults = [];

// Builds the /voice/speak 'text' (the incoming utterance the character
// responds to) based on line type — this is the generalization beyond the
// waypoint version's reply-only mechanism. Response has a natural
// incoming utterance (whatever came before); Question and Statement don't,
// so they get an explicit stage-direction-style instruction instead, since
// /voice/speak has no separate 'instruction vs utterance' channel — both
// fold into the same 'text' field the adapter sees as what it's replying to.
function _buildImprovPrompt(line, priorLine) {
  if (line.type === 'Response') {
    return priorLine && priorLine.text
      ? priorLine.text
      : '(The scene has just begun. Respond in character to open it.)';
  }
  if (line.type === 'Question') {
    return priorLine && priorLine.text
      ? `(Given what was just said — "${priorLine.text}" — ask a question in character. Ask only; do not answer it yourself.)`
      : '(Ask a question in character, arising naturally as the scene opens. Ask only; do not answer it yourself.)';
  }
  // Statement
  return priorLine && priorLine.text
    ? `(Given what was just said — "${priorLine.text}" — make a statement in character. Not a question, not a reply awaiting response — a standalone statement.)`
    : '(Make a standalone statement in character, arising naturally as the scene opens.)';
}

// ── Step 1: Generate improv lines ───────────────────────────────────────
function openGenerateImprovModal() {
  const realLines = lines.filter((l) => l.trigger.type !== 'arc-complete');
  const empties = realLines.filter((l) => l.mode === 'improv' && !(l.text || '').trim());
  if (empties.length === 0) {
    toast('No empty improv lines to generate — every improv line already has text.', true);
    return;
  }

  document.getElementById('modal-title').textContent = 'Generate improv lines';
  document.getElementById('modal-body').innerHTML = `
    <p>Generates text for ${empties.length} empty improv line(s), in character, as each line's own Question, Response, or Statement. Writes straight into each line's text — nothing is recorded to EBPS in this step. Review and edit the results normally afterward, then run <b>Run Arc (batch persist)</b> separately when you're happy with them.</p>
    <p style="color:var(--warm)">LLM output is often chatty — expect to trim these before persisting.</p>
    <label style="display:block;margin-top:10px">LLM Adapter</label>
    <select id="genimprov-adapter" class="input" style="width:100%;margin-top:4px">
      <option value="ollama">ollama (local)</option>
      <option value="stub">stub (no LLM)</option>
      <option value="anthropic">anthropic</option>
      <option value="openai">openai</option>
    </select>
    <label style="display:block;margin-top:8px">API key (if required)</label>
    <input type="text" id="genimprov-apikey" class="input" style="width:100%;margin-top:4px" placeholder="leave blank for local/ollama">
    <div id="genimprov-status" style="margin-top:12px"></div>
  `;
  document.getElementById('modal-foot').innerHTML = `
    <div class="modal-foot-left"></div>
    <div class="modal-foot-right"><button class="pill-btn primary" id="genimprov-fire-btn" onclick="fireGenerateImprov()">Generate</button></div>
  `;
  document.getElementById('modal-overlay').classList.add('show');
}

async function fireGenerateImprov() {
  const statusEl = document.getElementById('genimprov-status');
  const fireBtn  = document.getElementById('genimprov-fire-btn');
  const adapter  = document.getElementById('genimprov-adapter').value;
  const apikey   = document.getElementById('genimprov-apikey').value.trim();
  if (fireBtn) fireBtn.disabled = true;

  const setStatus = (msg, isErr) => {
    if (statusEl) statusEl.innerHTML = `<p style="color:${isErr ? 'var(--danger)' : 'var(--dim)'}">${esc(msg)}</p>`;
  };

  const realLines = lines.filter((l) => l.trigger.type !== 'arc-complete');
  let configuredActors = {};  // avoid redundant /voice/configure calls per actor
  let generatedCount = 0;

  for (let i = 0; i < realLines.length; i++) {
    const line = realLines[i];
    if (!(line.mode === 'improv' && !(line.text || '').trim())) continue;  // only empty improv lines
    const prior = i > 0 ? realLines[i - 1] : null;
    setStatus(`Generating ${generatedCount + 1} — ${line.actor} (${line.type})…`);

    try {
      if (!configuredActors[line.actor]) {
        await fetch(`${apiBase()}/voice/configure`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            adapter_id: adapter, api_key: apikey || '',
            persona: { name: line.actor, role: 'agent', description: '' },
            params: { max_tokens: 300, temperature: 0.72 },
            clear_history: true
          })
        });
        configuredActors[line.actor] = true;
      }
      const promptText = _buildImprovPrompt(line, prior);
      const speakResp = await fetch(`${apiBase()}/voice/speak`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        // record_to_field:false — generation never touches field state on
        // its own; persistence is Run Arc's job alone, as a later, separate,
        // explicit step.
        body: JSON.stringify({ text: promptText, agent_name: line.actor, position: [0, 0, 0], record_to_field: false })
      });
      const reader = speakResp.body.getReader(), dec = new TextDecoder();
      let buf = '', generated = '';
      while (true) {
        const r = await reader.read();
        if (r.done) break;
        buf += dec.decode(r.value, { stream: true });
        const slines = buf.split('\n'); buf = slines.pop();
        for (const sline of slines) {
          if (!sline.startsWith('data: ')) continue;
          try {
            const evt = JSON.parse(sline.slice(6));
            if (evt.type === 'token') generated += evt.content;
          } catch (pe) {}
        }
      }
      line.text = generated.trim();
      generatedCount++;
    } catch (e) {
      setStatus(`Generation failed on "${line.actor}" (${line.type}) — ${e.message}. Stopping — later lines may have been meant to reply to this one.`, true);
      if (fireBtn) fireBtn.disabled = false;
      renderAll();
      return;
    }
  }

  setStatus(`Generated ${generatedCount} line(s). Close this and review/edit them like any other line before running Run Arc.`);
  renderAll();
  if (fireBtn) fireBtn.disabled = false;
}

// ── Step 2: Run Arc (batch persist) — separate, post-edit ────────────────
function openRunArcModal() {
  const realLines = lines.filter((l) => l.trigger.type !== 'arc-complete');
  if (realLines.length === 0) {
    toast('No lines to run yet.', true);
    return;
  }
  const stillEmptyImprov = realLines.filter((l) => l.mode === 'improv' && !(l.text || '').trim()).length;
  const recordable = realLines.length - stillEmptyImprov;

  document.getElementById('modal-title').textContent = 'Run Arc (batch persist)';
  document.getElementById('modal-body').innerHTML = `
    <p>Calls /arc/record for ${recordable} line(s) with text, in order. No generation happens here — this is persistence only.${stillEmptyImprov > 0
      ? ` ${stillEmptyImprov} improv line(s) still have no text and will be skipped — run "Generate improv lines" first if you want them included.`
      : ''}</p>
    <p style="color:var(--warm)">This is a real, persisted run, saved as a real arc export — not a preview.</p>
    <div id="runarc-status" style="margin-top:12px"></div>
    <div id="runarc-chart" style="margin-top:10px"></div>
  `;
  document.getElementById('modal-foot').innerHTML = `
    <div class="modal-foot-left"></div>
    <div class="modal-foot-right"><button class="pill-btn primary" id="runarc-fire-btn" onclick="fireRunArc()">Run</button></div>
  `;
  document.getElementById('modal-overlay').classList.add('show');
}

async function fireRunArc() {
  const statusEl = document.getElementById('runarc-status');
  const chartEl  = document.getElementById('runarc-chart');
  const fireBtn  = document.getElementById('runarc-fire-btn');
  if (fireBtn) fireBtn.disabled = true;

  const setStatus = (msg, isErr) => {
    if (statusEl) statusEl.innerHTML = `<p style="color:${isErr ? 'var(--danger)' : 'var(--dim)'}">${esc(msg)}</p>`;
  };

  const realLines = lines.filter((l) => l.trigger.type !== 'arc-complete');
  _runArcResults = [];
  let skipped = 0;

  for (let i = 0; i < realLines.length; i++) {
    const line = realLines[i];
    if (!(line.text || '').trim()) { skipped++; continue; }  // nothing to record — no generation happens here
    setStatus(`Line ${i + 1}/${realLines.length} — ${line.actor} (${line.type})…`);

    try {
      const recResp = await apiPost('/arc/record', {
        cultivar: line.actor,
        step:     i + 1,
        waypoint: line.id,
        response: line.text
      });
      const cv = recResp.cv || null;
      line.arcCV        = cv;
      line.arcCoherence = recResp.coherence != null ? recResp.coherence : null;
      // recResp.mode does not exist at top level — the agent's behavioral
      // mode (exploit/explore/repair/avoid/shift) lives nested under
      // meta_state.mode. lineMode keeps the line's own static/improv
      // authoring mode separate from that, since they're different things
      // that happen to share the word "mode".
      const behavioralMode = recResp.meta_state ? recResp.meta_state.mode : '';
      _runArcResults.push({
        step: i + 1, actor: line.actor, type: line.type, waypoint: line.id,
        text: line.text, E: cv ? cv.E : null, B: cv ? cv.B : null,
        P: cv ? cv.P : null, S: cv ? cv.S : null,
        coherence: recResp.coherence != null ? recResp.coherence : null,
        lineMode: line.mode, behavioralMode: behavioralMode
      });
    } catch (e) {
      setStatus(`/arc/record failed on line ${i + 1} (${line.actor}) — ${e.message}. Stopping.`, true);
      if (fireBtn) fireBtn.disabled = false;
      renderAll();
      return;
    }
  }

  const skipNote = skipped > 0 ? ` (${skipped} skipped — no text)` : '';
  setStatus(`Done — ${_runArcResults.length} line(s) recorded${skipNote}. Saving arc export…`);
  renderAll();  // reflect per-line arcCV immediately

  // Persist as a real arc export, same format/endpoint Composer uses — see
  // file-level comment above: this is what gives the scene queryable
  // historical EBPS data, not just an in-editor display.
  try {
    const takeId = 'dialogue_' + Date.now();
    await apiPost('/arc/export', {
      cultivar:   _runArcResults.length ? _runArcResults[0].actor : 'unknown',
      timestamp:  new Date().toISOString(),
      scene_name: sceneName || '',
      take_name:  takeId,
      rows:       _runArcResults.map((r) => ({
        step: r.step, waypoint: r.waypoint, E: r.E, B: r.B, P: r.P, S: r.S,
        mode: r.behavioralMode, coherence: r.coherence,
        qaLines: [{ type: r.type, speaker: r.actor, text: r.text }]
      }))
    });
    setStatus(`Done — ${_runArcResults.length} line(s) recorded${skipNote} and saved to scenes/${esc(sceneName || '(unscoped)')}/arcs/${takeId}/.`);
  } catch (e) {
    setStatus(`Recorded ${_runArcResults.length} line(s)${skipNote}, but the arc export save failed — ${e.message}. Per-line values are still on each line (check Emotional Preview) even though the persisted export didn't save.`, true);
  }

  if (chartEl) {
    chartEl.innerHTML = `
      <div style="font-size:12px;color:var(--dim);margin-bottom:6px">Coherence per line —</div>
      <div style="display:flex;gap:3px;align-items:flex-end;height:60px;border-bottom:1px solid var(--border)">
        ${_runArcResults.map((r) => {
          const h = Math.max(2, Math.round((r.coherence != null ? r.coherence : 0.5) * 60));
          return `<div title="${esc(r.actor)} step ${r.step}: ${r.coherence != null ? r.coherence.toFixed(3) : '?'}"
                   style="flex:1;height:${h}px;background:var(--accent)"></div>`;
        }).join('')}
      </div>
    `;
  }

  if (fireBtn) fireBtn.disabled = false;
}


function openImportChorusModal() {
  document.getElementById('modal-title').textContent = 'Import from Chorus';
  document.getElementById('modal-body').innerHTML = `
    <p>Lines Chorus has captured this session (voice_actor firings, held server-side, never auto-merged into any scene). Review each and choose which to bring in as real lines here — nothing is added until you click Import.</p>
    <div id="chorus-import-list">Loading…</div>
  `;
  document.getElementById('modal-foot').innerHTML = `
    <div class="modal-foot-left"><button class="pill-btn" onclick="clearChorusCapturesConfirm()" style="color:var(--danger);border-color:var(--danger)">Clear all captures</button></div>
    <div class="modal-foot-right"><button class="pill-btn primary" onclick="doImportChorus()">Import selected</button></div>
  `;
  document.getElementById('modal-overlay').classList.add('show');

  fetch(`${apiBase()}/chorus/captured_lines`)
    .then((r) => r.json())
    .then((data) => {
      const captured = (data && data.lines) || [];
      const listEl = document.getElementById('chorus-import-list');
      if (!listEl) return; // modal closed before fetch resolved
      if (captured.length === 0) {
        listEl.innerHTML = '<p style="color:var(--dim)">Nothing captured yet — either no zone in this scene has a voice_actor configured, or none has fired this session.</p>';
        return;
      }
      const existingIds = new Set(lines.map((l) => l.id));
      listEl.innerHTML = captured.map((c, i) => {
        const dup = existingIds.has(c.id);
        return `
          <label style="display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--border)">
            <input type="checkbox" data-idx="${i}" class="chorus-import-check" ${dup ? 'disabled' : 'checked'} style="margin-top:3px">
            <span>
              <b>${esc(c.actor || '?')}</b> <span style="color:var(--dim)">(${esc(c.type || 'Statement')}, trigger: ${esc(c.trigger ? (c.trigger.type || c.trigger) : '?')})</span>
              ${dup ? '<span style="color:var(--warm)"> — already imported (id exists)</span>' : ''}
              <br>${esc(c.text || '')}
            </span>
          </label>`;
      }).join('');
      window._chorusCapturedCache = captured;
    })
    .catch((e) => {
      const listEl = document.getElementById('chorus-import-list');
      if (listEl) listEl.innerHTML = `<p style="color:var(--danger)">Fetch failed — ${esc(e.message)}. Check API base above.</p>`;
    });
}

function doImportChorus() {
  const captured = window._chorusCapturedCache || [];
  const checks = document.querySelectorAll('.chorus-import-check');
  const toImport = [];
  checks.forEach((chk) => {
    if (chk.checked && !chk.disabled) toImport.push(captured[parseInt(chk.dataset.idx, 10)]);
  });
  if (toImport.length === 0) {
    toast('Nothing selected to import.', true);
    return;
  }
  toImport.forEach((c) => {
    lines.push({
      id: c.id, actor: c.actor, type: c.type || 'Statement', mode: c.mode || 'improv',
      blocking: !!c.blocking, trigger: c.trigger, text: c.text,
    });
  });
  selectedId = toImport[0].id;
  closeModal();
  renderAll();
  toast(`Imported ${toImport.length} line(s) from Chorus — review triggers/tags before saving.`);
}

function clearChorusCapturesConfirm() {
  if (!confirm('Discard ALL Chorus captures on the server (not yet-imported ones too)? This cannot be undone.')) return;
  fetch(`${apiBase()}/chorus/captured_lines/clear`, { method: 'POST' })
    .then(() => { toast('Chorus captures cleared.'); closeModal(); })
    .catch((e) => toast('Clear failed — ' + e.message, true));
}

function openImportKateModal() {
  document.getElementById('modal-title').textContent = 'Import tagged dialogue';
  document.getElementById('modal-body').innerHTML = `
    <p>Paste the collaborator's returned XML. Matches by <code>id</code> first (an id match always wins as an edit); falls back to exact text match if an id gets dropped or regenerated, keeping the <b>original</b> id either way. Anything with a new tag and no explicit provenance gets stamped <code>llm-interpreted:&lt;name&gt;</code>.</p>
    <div class="field-inline"><label>Collaborator name</label><input type="text" id="import-name" value="Kate" style="flex:1"></div>
    <textarea id="import-text" placeholder="&lt;Dialogue&gt;...&lt;/Dialogue&gt;"></textarea>
    <div id="import-msg"></div>
  `;
  document.getElementById('modal-foot').innerHTML = `<div class="modal-foot-right"><button class="pill-btn primary" onclick="doImport()">Import</button></div>`;
  document.getElementById('modal-overlay').classList.add('show');
}

function doImport() {
  const name = document.getElementById('import-name').value.trim() || 'Kate';
  const raw = document.getElementById('import-text').value;
  const msgEl = document.getElementById('import-msg');
  if (!raw.trim()) { msgEl.innerHTML = '<div class="modal-err">Paste the returned XML first.</div>'; return; }

  const result = D.importFromKate(raw, lines, name);
  if (!result.valid) {
    msgEl.innerHTML = `<div class="modal-err"><b>Not applied — the reconciled result doesn't validate:</b><ul>${result.errors.map((e) => `<li>${esc(e)}</li>`).join('')}</ul>Fix the pasted reply (or edit lines manually afterward) and try again.</div>`;
    return;
  }
  lines = result.lines;
  closeModal();
  renderAll();
  const parts = [];
  if (result.updatedIds.length) parts.push(`${result.updatedIds.length} updated`);
  if (result.addedIds.length) parts.push(`${result.addedIds.length} added`);
  toast(parts.length ? `${name}: ${parts.join(', ')}` : `${name}: nothing matched — check the pasted XML`, parts.length === 0);
}

// ── modal / clipboard / file helpers ────────────────────────────────────
function closeModal() { document.getElementById('modal-overlay').classList.remove('show'); }

function copyModalTextarea() {
  const ta = document.querySelector('#modal-body textarea');
  if (!ta) return;
  ta.select();
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ta.value).then(() => toast('Copied'));
    } else {
      document.execCommand('copy');
      toast('Copied');
    }
  } catch (e) {
    toast('Copy failed — select and copy manually', true);
  }
}

function downloadText(filename, text) {
  const blob = new Blob([text], { type: 'application/xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function toast(msg, isErr) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = `position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:${isErr ? '#2a1414' : '#0f2419'};color:${isErr ? 'var(--danger)' : 'var(--accent)'};border:1px solid ${isErr ? 'var(--danger)' : 'var(--accent)'};padding:9px 16px;border-radius:7px;font-size:12.5px;z-index:100`;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

// ── Composer integration (Day 83) ───────────────────────────────────────
// This tool now runs as a real Composer tab (iframe-hosted, same pattern
// as Events/Characters/Route Graph — see TOOL_FRAME_IDS in
// mccf_scene_composer.html), while staying loosely coupled: it only ever
// talks to Composer through this small, explicit message contract — it
// never reaches into Events' or any other module's internals. The
// standalone Load/Export-scene/Kate modals above are all kept exactly as
// they were; this is additive, not a replacement for them.

// Receive the live scene roster. _buildSceneData()'s `agents` field
// (Object.keys(placedAgents)) already exists and is already correct —
// nothing new needed on the Composer side to produce this list.
window.addEventListener('message', function(evt) {
  const d = evt.data;
  // Day 83 diagnostic: reported not receiving Anna live despite both sides
  // reading correctly on review. Log every message that arrives, not just
  // ones that match, to distinguish "nothing arrives" from "something
  // arrives but the shape is wrong." Confirmed working correctly via this
  // logging — the real gap was display, not sync (see actor-roster-badge
  // above). Left in place; harmless and useful for future debugging.
  console.log('[dialogue] message received:', d && d.type, d);

  // Day 83: dedicated scene-load restore, separate from the regular
  // mccf_scene_data resend on purpose — this REPLACES `lines` wholesale,
  // which is only correct behavior for an explicit "you loaded a saved
  // scene" moment (same semantics Composer's own agent/camera/light
  // restore already has), never for a routine tab-revisit that must not
  // silently clobber in-progress unsaved authoring.
  if (d && d.type === 'mccf_load_dialogue_lines') {
    lines = Array.isArray(d.lines) ? d.lines : [];
    selectedId = lines.length ? lines[0].id : null;
    console.log('[dialogue] restored', lines.length, 'line(s) from loaded scene');
    renderAll();
    return;
  }

  if (!d || d.type !== 'mccf_scene_data') return;
  const payload = d.data || {};
  ACTORS = Array.isArray(payload.agents) ? payload.agents.slice() : [];
  console.log('[dialogue] ACTORS updated to:', JSON.stringify(ACTORS));
  renderActorRosterBadge();
  renderAll();
});

function renderActorRosterBadge() {
  const el = document.getElementById('actor-roster-badge');
  if (!el) return;
  el.textContent = ACTORS.length
    ? 'Actors in scene: ' + ACTORS.join(', ')
    : 'No actors received yet';
  el.style.color = ACTORS.length ? 'var(--accent)' : 'var(--danger)';
}

// Send authored lines back to Composer. Mirrors Events Editor's own
// exportProductionCues()/mccf_production_cues pattern exactly — Composer
// receives this into a new _lastDialogueLines variable and is responsible
// for wiring it into the real scene-XML <Dialogue> export, same shape as
// the _lastTimelineCues fix from earlier this session. Validates before
// sending — never push content the tool itself knows is broken.
function saveToComposer() {
  const { valid, errors } = D.validateDialogueLines(lines);
  if (!valid) {
    toast(`Not sent — ${errors.length} validation issue(s). Fix them first (see per-line errors).`, true);
    return;
  }
  if (window.parent === window) {
    toast('Not embedded in Composer — this only works as a Composer tab. Use Export scene instead.', true);
    return;
  }
  window.parent.postMessage({ type: 'mccf_dialogue_lines', data: { lines: lines } }, '*');
  toast(`Sent ${lines.length} line(s) to Composer`);
}

renderActorRosterBadge();
renderAll();
</script>
