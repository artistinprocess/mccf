<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MCCF X3D Scene</title>
<script defer src="https://cdn.jsdelivr.net/npm/x_ite@11.6.0/dist/x_ite.min.js"></script>
<style>
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; background: #0a0a0f; font-family: monospace; overflow: hidden; }
#top-bar {
  flex: 0 0 auto; height: 34px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 12px; background: rgba(10,12,18,0.95); border-bottom: 1px solid #1c2238; z-index: 110;
}
#top-bar .hdr-left { display: flex; align-items: center; gap: 10px; min-width: 0; overflow: hidden; }
#top-bar .hdr-scene { color: #8a9aaa; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#status { color: #6a7890; font-size: 11px; white-space: nowrap; }
#poll-indicator {
  width: 8px; height: 8px; border-radius: 50%;
  background: #333; display: inline-block; margin-right: 4px;
  transition: background 0.2s;
}
#stage { flex: 1 1 auto; position: relative; min-height: 0; }
x3d-canvas { width: 100%; height: 100%; display: block; }
button {
  background: #1a2030; color: #4af0a8;
  border: 1px solid #4af0a8; border-radius: 3px;
  padding: 3px 10px; cursor: pointer;
  font-family: monospace; font-size: 11px;
}
button:hover { background: #4af0a8; color: #111; }
button.active { background: #4af0a8; color: #111; }
#field-overlay {
  position: absolute; top: 0; right: 0; bottom: 0; width: 220px;
  background: rgba(6,8,14,0.94);
  border-left: 1px solid #2a3545;
  padding: 10px 12px;
  font-size: 10px; color: #6a8090;
  overflow-y: auto; z-index: 120;
  transform: translateX(100%); transition: transform 0.15s ease;
}
#field-overlay.open { transform: translateX(0); }
#field-overlay .row { display: flex; justify-content: space-between; margin: 2px 0; }
#field-overlay .val { color: #a0c0d0; }
.tension-low { color: #4a8adf; }
.tension-mid { color: #4adfc0; }
.tension-high { color: #df8a4a; }
.tension-crit { color: #df4a4a; }
/* ── ϕ/ϵ runtime display ── */
#runtime-panel {
  margin-top: 6px;
  border-top: 1px solid #1c2238;
  padding-top: 5px;
}
#runtime-toggle {
  color: #7ab8f5; font-size: 10px; cursor: pointer;
  user-select: none; display: block; margin-bottom: 3px;
}
#runtime-toggle:hover { color: #a0d0f8; }
#runtime-agents { display: block; }
.rt-agent {
  margin-top: 6px; padding-top: 4px;
  border-top: 1px solid #1c2a3a;
}
.rt-agent-name {
  color: #d0e0f0; font-size: 11px; font-weight: bold; margin-bottom: 3px;
}
.rt-bars { display: flex; flex-direction: column; gap: 3px; }
.rt-row { display: flex; align-items: center; gap: 4px; font-size: 11px; }
.rt-ch  { width: 10px; text-align: right; font-weight: bold; }
.rt-bar-wrap {
  flex: 1; height: 8px; background: #0d1520;
  border-radius: 3px; overflow: hidden; position: relative;
}
.rt-bar-phi {
  position: absolute; top: 0; left: 0; height: 100%;
  background: #3a6090; border-radius: 3px;
  transition: width 0.4s ease;
}
.rt-bar-eps {
  position: absolute; top: 0; left: 0; height: 100%;
  background: #60d090; border-radius: 3px; opacity: 0.85;
  transition: width 0.4s ease;
}
.rt-val { width: 38px; text-align: right; color: #90b0c0; font-size: 11px; }
.rt-drift-pos { color: #4af0a8; font-weight: bold; }
.rt-drift-neg { color: #f07060; font-weight: bold; }
.rt-drift-zero { color: #2a3a4a; }
.rt-meta { font-size: 10px; color: #4a6070; margin-top: 3px; }
/* ── Trust panel ── */
#trust-panel {
  margin-top: 6px;
  border-top: 1px solid #1c2238;
  padding-top: 5px;
}
#trust-toggle {
  color: #f0a060; font-size: 10px; cursor: pointer;
  user-select: none; display: block; margin-bottom: 3px;
}
#trust-toggle:hover { color: #f0c080; }
#trust-rows { display: block; }
.tr-row {
  display: flex; align-items: center; gap: 4px;
  font-size: 10px; margin: 2px 0;
}
.tr-label { color: #8090a0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tr-bar-wrap {
  width: 60px; height: 6px; background: #0d1520;
  border-radius: 2px; overflow: hidden; position: relative; flex-shrink: 0;
}
.tr-bar {
  position: absolute; top: 0; left: 0; height: 100%;
  border-radius: 2px; transition: width 0.4s ease;
}
.tr-mu  { width: 32px; text-align: right; color: #f0a060; font-size: 10px; flex-shrink: 0; }
.tr-ticks { width: 24px; text-align: right; color: #4a6070; font-size: 9px; flex-shrink: 0; }
/* ── Greek Chorus overlay ── */
#chorus-overlay {
  display: none;
  position: fixed;
  bottom: 60px; left: 50%; transform: translateX(-50%);
  max-width: 560px; width: 90%;
  max-height: 40vh;
  overflow-y: auto;
  background: rgba(4, 6, 14, 0.90);
  border: 1px solid #3a2060;
  border-radius: 4px;
  padding: 14px 18px;
  color: #c8a8f0;
  font-family: monospace; font-size: 14px; line-height: 1.6;
  text-align: center;
  word-wrap: break-word;
  z-index: 200;
  animation: chorusFadeIn 1.2s ease;
}
#chorus-overlay .chorus-zone {
  font-size: 10px; color: #6a4090; margin-bottom: 6px; letter-spacing: 0.12em;
}
#chorus-overlay .chorus-dismiss {
  display: block; margin-top: 10px;
  font-size: 10px; color: #5a3080; cursor: pointer; letter-spacing: 0.1em;
}
#chorus-overlay .chorus-dismiss:hover { color: #c8a8f0; }
@keyframes chorusFadeIn {
  from { opacity: 0; transform: translateX(-50%) translateY(8px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}
/* ── Info strip — live playback readouts (step info / channels / Q&A), always visible ── */
#info-strip {
  flex: 0 0 auto; background: rgba(8,10,16,0.92); border-top: 1px solid #1c2238;
  padding: 5px 14px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  font-size: 12px; color: #9ab0b0; min-height: 18px;
}
#pb-step-info { flex: 1 1 auto; min-width: 120px; }
#pb-channels  { display: flex; gap: 6px; flex: 0 0 auto; }
#pb-channels span { font-size: 11px; }
.pc-E { color:#f07060; } .pc-B { color:#60a8f0; }
.pc-P { color:#f0c060; } .pc-S { color:#60f0a8; }
#pb-qr {
  display: none; flex: 1 1 100%;
  border-top: 1px solid #1c2538; padding-top: 6px; margin-top: 2px;
}
#pb-question { color:#f0c060; margin-bottom:4px; font-style:italic; font-size:13px; white-space:pre-wrap; max-height:140px; overflow-y:auto; }
#pb-response  { color:#c0d8e8; line-height:1.5; font-size:13px; max-height:100px; overflow-y:auto; }
/* ── Transport bar — all playback controls in one DAW-style row ── */
#controls {
  flex: 0 0 auto;
  background: rgba(0,0,0,0.92);
  border-top: 1px solid #1c2238;
  padding: 6px 10px;
  display: flex; gap: 6px; flex-wrap: nowrap; align-items: center;
  overflow-x: auto;
  z-index: 100;
}
#controls .tgroup { display: flex; gap: 4px; align-items: center; flex: 0 0 auto; white-space: nowrap; }
#controls .tdiv { width: 1px; height: 20px; background: #2a3545; flex: 0 0 auto; margin: 0 2px; }
#controls .tlabel { font-size: 10px; color: #6a8090; white-space: nowrap; }
#controls select, #controls input[type=number] {
  background: #0d1520; color: #c0d8e8;
  border: 1px solid #2a3545; border-radius: 3px;
  padding: 3px 5px; font-family: monospace; font-size: 11px;
}
#controls select { max-width: 150px; }
#controls input[type=number] { width: 48px; }
#controls label { font-size: 11px; color: #6a8090; white-space: nowrap; display: flex; align-items: center; gap: 3px; }
#controls button { white-space: nowrap; }
/* ── Audio drawer — collapsed by default, opens above the transport bar ── */
#audio-drawer {
  flex: 0 0 auto; display: none;
  background: rgba(8,10,16,0.95); border-top: 1px solid #1c2238;
  padding: 8px 14px;
}
#audio-drawer.open { display: block; }
#soundPanel .sp-title {
  font-size:10px; font-weight:700; letter-spacing:0.08em;
  color:#7ab8d4; text-transform:uppercase; margin-bottom:4px;
}
.sp-global {
  display:flex; gap:6px; align-items:center; margin-bottom:5px; flex-wrap:wrap;
}
.sp-global label { font-size:10px; color:#8a9aaa; white-space:nowrap; }
.sp-global input[type=range] { width:64px; accent-color:#7ab8d4; }
.sp-global input[type=number] {
  width:36px; background:#111a22; border:1px solid #2a3a4a;
  color:#c8d8e8; font-size:10px; padding:1px 3px; border-radius:3px;
}
.sp-fade-row {
  display:flex; gap:4px; align-items:center; margin-bottom:3px; flex-wrap:nowrap;
}
.sp-fade-row label { font-size:10px; color:#8a9aaa; white-space:nowrap; width:22px; }
.sp-fade-row input[type=number] {
  width:38px; background:#111a22; border:1px solid #2a3a4a;
  color:#c8d8e8; font-size:10px; padding:1px 3px; border-radius:3px;
}
.sp-fade-row span { font-size:10px; color:#607080; }
.sp-zone {
  background:#0d1820; border:1px solid #1e2e3e;
  border-radius:4px; padding:4px 6px; margin-bottom:4px;
}
.sp-zone-name {
  font-size:10px; font-weight:700; color:#a0c8e0;
  margin-bottom:3px; letter-spacing:0.05em;
}
.sp-row {
  display:flex; align-items:center; gap:4px; margin-bottom:2px; flex-wrap:wrap;
}
.sp-tag { font-size:9px; color:#607080; width:36px; flex-shrink:0; }
.sp-file-btn {
  font-size:9px; background:#162430; border:1px solid #2a4060;
  color:#90b8d0; padding:2px 5px; border-radius:3px; cursor:pointer;
  white-space:nowrap; max-width:118px; overflow:hidden; text-overflow:ellipsis;
}
.sp-file-btn:hover { background:#1e3448; }
.sp-file-btn.loaded { border-color:#3a8060; color:#60c890; }
.sp-vol { width:56px; accent-color:#5a9ab0; }
.sp-vol-dwell { accent-color:#9a70b0; }
.sp-val { font-size:9px; color:#607080; width:24px; text-align:right; }
.sp-clear {
  font-size:9px; background:none; border:none;
  color:#604040; cursor:pointer; padding:0 2px;
}
.sp-clear:hover { color:#c04040; }
.sp-file-input { display:none; }
</style>
</head>
<body>

<div id="top-bar">
  <div class="hdr-left">
    <span class="hdr-scene" id="hdr-scene-name">— no scene loaded —</span>
    <span id="status"><span id="poll-indicator"></span>Loading…</span>
  </div>
  <button id="field-toggle-btn" onclick="toggleFieldDrawer()">⬡ Field</button>
</div>

<div id="stage">
  <x3d-canvas id="x3d" update="auto" contentScale="auto"></x3d-canvas>

  <div id="field-overlay">
    <div class="row"><span>coherence</span><span class="val" id="ov-coh">—</span></div>
    <div class="row"><span>echo risk</span><span class="val" id="ov-echo">—</span></div>
    <div class="row"><span>episodes</span><span class="val" id="ov-ep">—</span></div>
    <div class="row"><span>agents</span><span class="val" id="ov-agents">—</span></div>
    <div class="row"><span>tension</span><span class="val" id="ov-tension">—</span></div>
    <div style="margin-top:4px;color:#aab0be;font-size:11px;" id="ov-poll">polling…</div>
    <div style="color:#aab0be;font-size:11px;margin-top:2px;" id="x3d-diag">hothouse: waiting…</div>
    <div style="color:#aab0be;font-size:11px;margin-top:2px;" id="light-diag">lighting: waiting…</div>
    <div style="color:#f0c060;font-size:11px;margin-top:4px;border-top:1px solid #1c2238;padding-top:4px;" id="sai-test">SAI test: not run</div>
    <button onclick="runSAITest()" style="margin-top:4px;font-family:var(--mono);font-size:10px;
      padding:2px 6px;border:1px solid #1c2238;border-radius:3px;background:none;
      color:#f0c060;cursor:pointer;">▶ Test SAI</button>
    <!-- ϕ/ϵ runtime display -->
    <div id="runtime-panel">
      <span id="runtime-toggle" onclick="toggleRuntime()">▶ ϕ/ϵ state</span>
      <div id="runtime-agents" style="display:none;"></div>
    </div>
    <!-- Trust panel -->
    <div id="trust-panel">
      <span id="trust-toggle" onclick="toggleTrust()">▶ trust</span>
      <div id="trust-rows" style="display:none;"></div>
    </div>
  </div>

  <!-- Greek Chorus overlay — text injected by displayChorus() -->
  <div id="chorus-overlay">
    <div class="chorus-zone" id="chorus-zone-label"></div>
    <div id="chorus-text"></div>
    <span class="chorus-dismiss" onclick="dismissChorus()">✕ dismiss</span>
  </div>
</div>

<!-- Live playback readouts — always visible, not tucked in a drawer -->
<div id="info-strip">
  <div id="pb-step-info">No arc loaded.</div>
  <div id="pb-channels">
    <span class="pc-E">E —</span>
    <span class="pc-B">B —</span>
    <span class="pc-P">P —</span>
    <span class="pc-S">S —</span>
  </div>
  <div id="pb-qr">
    <div id="pb-question"></div>
    <div id="pb-response"></div>
  </div>
</div>

<!-- Zone Audio — collapsed by default, opened from the transport bar -->
<div id="audio-drawer">
  <div id="soundPanel">
    <div class="sp-title">&#9836; Zone Audio</div>
    <div style="background:#0a1420;border:1px solid #1a2a3a;border-radius:3px;padding:4px 6px;margin-bottom:5px;">
      <div style="font-size:9px;color:#4a7090;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:3px;">Scene Tracks (baked in X3D)</div>
      <div style="display:flex;gap:4px;align-items:center;margin-bottom:2px;">
        <span style="font-size:9px;color:#7ab8d4;width:36px;flex-shrink:0;">Music</span>
        <span style="font-size:9px;color:#a0c8e0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" id="sp_music_label">—</span>
      </div>
      <div style="display:flex;gap:4px;align-items:center;">
        <span style="font-size:9px;color:#7ab8d4;width:36px;flex-shrink:0;">Bed</span>
        <span style="font-size:9px;color:#a0c8e0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" id="sp_bed_label">—</span>
      </div>
    </div>
    <div class="sp-global">
      <label>Master</label>
      <input type="range" id="sp_master" min="0" max="1" step="0.01" value="1.0"
        oninput="spSetFader('masterVolume',parseFloat(this.value));document.getElementById('sp_master_val').textContent=Math.round(this.value*100)+'%'"/>
      <span class="sp-val" id="sp_master_val">100%</span>
    </div>
    <div class="sp-fade-row">
      <label>In</label>
      <input type="number" id="sp_fadein"  value="1.5" min="0.1" max="10" step="0.1"
        onchange="spSetFader('fadeInDuration',parseFloat(this.value))"/>
      <span>s</span>
      <label style="width:28px;">Out</label>
      <input type="number" id="sp_fadeout" value="2.5" min="0.1" max="10" step="0.1"
        onchange="spSetFader('fadeOutDuration',parseFloat(this.value))"/>
      <span>s</span>
    </div>
    <div id="sp_zones"></div>
  </div>
</div>

<!-- Transport bar — every playback control in one DAW-style row -->
<div id="controls">
  <div class="tgroup">
    <span class="tlabel">Scene</span>
    <select id="x3d-file" onchange="x3dFileChanged()">
      <option value="">— select scene —</option>
    </select>
    <button onclick="x3dLoadFiles()" title="Refresh scene list">&#8635;</button>
  </div>
  <div class="tdiv"></div>
  <div class="tgroup">
    <span class="tlabel">Take</span>
    <select id="pb-take" onchange="pbTakeChanged()">
      <option value="">— all takes —</option>
    </select>
  </div>
  <div class="tdiv"></div>
  <div class="tgroup">
    <span class="tlabel">Arc</span>
    <select id="pb-file" onchange="pbFileChanged()">
      <option value="">— select arc file —</option>
    </select>
    <button onclick="pbLoadFiles()" title="Refresh arc list">&#8635;</button>
    <button onclick="pbClearSelect()" title="Clear arc" style="border-color:#f06060;color:#f06060;">&#10005;</button>
  </div>
  <div class="tdiv"></div>
  <div class="tgroup">
    <button id="pb-play-btn" onclick="pbPlay()" style="border-color:#4af0a8;color:#4af0a8;">&#9654; Arc</button>
    <button id="pb-play-all-btn" onclick="pbPlayAll()" style="border-color:#a0f060;color:#a0f060;">&#9654;&#9654; All</button>
    <button id="pb-step-btn" onclick="pbStep()" style="border-color:#7ab8f5;color:#7ab8f5;">Step</button>
    <button id="pb-stop-btn" onclick="pbStop()" style="border-color:#f0c060;color:#f0c060;">&#9646;&#9646;</button>
    <button id="pb-reset-btn" onclick="pbReset()" style="border-color:#a0a0a0;color:#a0a0a0;" title="Reset and replay">&#8635;</button>
  </div>
  <div class="tdiv"></div>
  <div class="tgroup">
    <span class="tlabel">pace</span>
    <input type="number" id="pb-pace" value="3" min="0.5" max="30" step="0.5"/>
    <label><input type="checkbox" id="pb-loop"/>loop</label>
    <label><input type="checkbox" id="pb-voice" onchange="pbVoiceChanged()"/>voice</label>
    <!-- Day 88: debug-only headlight toggle — the exported scene always
         ships with headlight="FALSE" (real, intentional scene-lighting
         choice, see MainNavInfo in the export writer). This never
         touches the export; it's a live SAI write purely to help judge
         visibility while placing/aiming real lights, matching the same
         "temporary crutch, never in the shipped file" role headlight
         always played back in VRML days. -->
    <label title="Live-only debug light — never affects the exported scene"><input type="checkbox" id="pb-headlight" onchange="pbHeadlightChanged()"/>headlight</label>
  </div>
  <div class="tdiv"></div>
  <div class="tgroup">
    <span class="tlabel">Jump</span>
    <select id="jump-agent" style="width:100px;" onfocus="populateJumpAgents()"></select>
    <input id="jump-step" type="number" min="1" value="1" style="width:40px;">
    <button onclick="pbJumpToWaypoint(document.getElementById('jump-agent').value, document.getElementById('jump-step').value)"
      style="border-color:#e0a0f0;color:#e0a0f0;">&#8618; Fire</button>
  </div>
  <div class="tdiv"></div>
  <button onclick="resetToStartPosition()" style="border-color:#c080f0;color:#c080f0;">&#8602; Reset Pos</button>
  <div class="tdiv"></div>
  <span id="vp-zone-btns" class="tgroup"></span>
  <div class="tdiv"></div>
  <button onclick="togglePolling()" id="poll-btn">⏸ Pause</button>
  <span id="cam-telemetry" style="font-family:monospace;font-size:11px;color:#7fd8a0;margin-left:4px;">—</span>
  <div style="flex:1 1 auto;min-width:8px;"></div>
  <button id="audio-toggle-btn" onclick="toggleAudioDrawer()">&#9836; Audio</button>
</div>

<script>
const API = 'http://localhost:5000';
const POLL_MS     = 750;
const HOTHOUSE_MS = 1000;
const LIGHTING_MS = 2000;

function toggleFieldDrawer() {
  var d = document.getElementById('field-overlay');
  var btn = document.getElementById('field-toggle-btn');
  var open = d.classList.toggle('open');
  btn.classList.toggle('active', open);
}
function toggleAudioDrawer() {
  var d = document.getElementById('audio-drawer');
  var btn = document.getElementById('audio-toggle-btn');
  var open = d.classList.toggle('open');
  btn.classList.toggle('active', open);
}


let canvas = document.getElementById('x3d');
// x3dFileChanged() replaces this element on every genuine scene switch (see there
// for why), so every listener it needs has to be re-attachable, not just attached
// once at page load. This function is that attach step — called once here for the
// initial element, and again from x3dFileChanged after each replacement.
function _bindCanvasEvents(el) {
  el.addEventListener('load', () => {
    // Guard — ignore the initial empty canvas load before any X3D file is selected
    var _sel = document.getElementById('x3d-file');
    if (!_sel || !_sel.value) {
      setStatus('Ready — select a scene');
      _resumeAudioContext();
      return;
    }
    setStatus('Scene loaded');
    buildVPButtons();
    startPolling();
    spInit();
    _resumeAudioContext();
    // Manual EventCues fire after _parseSceneZoneData completes (see fireManualCues call there)
    try {
      const arcChannel = new BroadcastChannel('mccf_arc');
      arcChannel.onmessage = (e) => {
        if (e.data?.type === 'mccf_arc_cv') applyArcCV(e.data.data);
      };
    } catch(e) {}
  });
  el.addEventListener('error', () => setStatus('Load error — check console'));
  // Fetch and cache the scene XML when the X3D scene loads
  el.addEventListener('load', function() {
    var src = el.getAttribute('src');
    if (!src) return;  // skip empty canvas load before any scene is selected
    fetch(src)
      .then(function(r){ if(r.ok) return r.text(); throw new Error('fetch failed'); })
      .then(function(txt){ window._loadedSceneXml = txt; _pbSceneVoiceMap = null; })
      .catch(function(e){ console.warn('Could not cache scene XML:', e); });
  });
}
_bindCanvasEvents(canvas);

// ── Live camera telemetry (Day 64) ──────────────────────────────────────────
// Reads the currently BOUND Viewpoint's own position/orientation fields — the
// same raw fields X_ITE's native Shift+F8 capture already reads (per the Day 63
// finding: "copies the current viewpoint (position + orientation, no jump
// attribute)"). Deliberately the same measurement basis as that already-trusted
// on-demand workflow, just continuous instead of clipboard-on-keypress. This is
// the BOUND node's own field values — for a camera nested inside a proto/avatar
// Transform chain (agent_orbit, agent_track), that's relative to its immediate
// parent, not resolved to world space. Good enough for "is this moving the way I
// expect, and by roughly how much" — not a substitute for actual world-matrix
// math if that's ever needed.
var _camTelemetryTickCount = 0;
function updateCamTelemetry() {
  var el = document.getElementById('cam-telemetry');
  if (!el) return;
  _camTelemetryTickCount++;
  try {
    var vp = canvas.browser.getActiveViewpoint();
    if (!vp) { el.textContent = '— (no active viewpoint)'; return; }
    // Read via .getField(name).toString() — the same pattern this file's own
    // _executeMoveShot diagnostics already use (posInterp.keyValue[0].toString()) and
    // have already proven works against this X_ITE build. Direct property access
    // (vp.position, p.x, p[0]) does NOT work here — confirmed by two failed attempts
    // before this one. toString() sidesteps guessing the value's internal shape
    // entirely, since X_ITE field objects format themselves as "x y z" / "x y z angle".
    el.textContent = 'pos ' + vp.getField('position').toString()
      + '   rot ' + vp.getField('orientation').toString();
  } catch (e) {
    el.textContent = '— (error, see console)';
    if (_camTelemetryTickCount % 25 === 1) {
      console.warn('[telemetry] tick', _camTelemetryTickCount, 'field access failed:', e.message);
    }
  }
}
setInterval(updateCamTelemetry, 200);
let pollingActive = true;
let activeVP = null;

// --- Viewpoint navigation ---
function gotoVP(id) {
  try {
    const scene = canvas.browser.currentScene;
    if (!scene) { console.warn('gotoVP: no scene'); return; }
    let vp = scene.getNamedNode(id);
    // If the exact name fails, try scanning for any Viewpoint node
    if (!vp) {
      console.warn('gotoVP: node "' + id + '" not found — available named nodes logged below');
      // Log first 40 named nodes for diagnostics
      try {
        var allNames = scene.namedNodes ? Object.keys(scene.namedNodes).slice(0,40) : [];
        console.log('Named nodes:', allNames.join(', '));
      } catch(e2) {}
      return;
    }
    vp.set_bind = true;
    setStatus('Viewpoint: ' + id);
    if (activeVP) document.getElementById('btn-'+activeVP)?.classList.remove('active');
    document.getElementById('btn-'+id)?.classList.add('active');
    activeVP = id;
  } catch(e) { console.warn('VP nav:', e); }
}

function setStatus(msg) {
  document.getElementById('status').innerHTML = '<span id="poll-indicator"></span>' + msg;
}

function buildVPButtons() {
  // Build viewpoint buttons dynamically from VP_ nodes in the loaded scene
  var span = document.getElementById('vp-zone-btns');
  if (!span) return;
  span.innerHTML = '';
  try {
    var scene = canvas.browser.currentScene;
    if (!scene) return;
    var allNames = scene.namedNodes ? Object.keys(scene.namedNodes) : [];
    var _vpExclude = {'VP_Overview':1,'VP_Origin':1,'VP_Free':1};
    allNames.filter(function(n){ return n.startsWith('VP_') && !_vpExclude[n]; })
      .forEach(function(vpId) {
        var label = vpId.replace('VP_','').replace(/_/g,' ');
        var btn = document.createElement('button');
        btn.id = 'btn-' + vpId;
        btn.textContent = label;
        btn.onclick = function(){ gotoVP(vpId); };
        span.appendChild(btn);
      });
  } catch(e) { console.warn('buildVPButtons:', e); }
}

function flash(ok) {

// ── ϕ/ϵ runtime display ──────────────────────────────────────────────────────

let _runtimeExpanded = false;
let _trustExpanded   = false;
// Last trust data from couplers/tick response — updated each tick call
window._lastTrustData = {};

function toggleRuntime() {
  _runtimeExpanded = !_runtimeExpanded;
  document.getElementById('runtime-agents').style.display = _runtimeExpanded ? 'block' : 'none';
  document.getElementById('runtime-toggle').textContent =
    (_runtimeExpanded ? '▼' : '▶') + ' ϕ/ϵ state';
}

function toggleTrust() {
  _trustExpanded = !_trustExpanded;
  document.getElementById('trust-rows').style.display = _trustExpanded ? 'block' : 'none';
  document.getElementById('trust-toggle').textContent =
    (_trustExpanded ? '▼' : '▶') + ' trust';
  if (_trustExpanded) renderTrust(window._lastTrustData || {});
}

function renderTrust(trustData) {
  var container = document.getElementById('trust-rows');
  if (!container) return;
  var links = Object.keys(trustData);
  if (!links.length) {
    container.innerHTML = '<div style="color:#2a3a4a;font-size:9px;margin-top:2px;">no trust data yet — play an arc</div>';
    return;
  }
  var html = '';
  links.forEach(function(label) {
    var t = trustData[label];
    var mu = t.mu !== undefined ? t.mu : 0.5;
    // Bar colour: green when trust > authored (μ>0.5), amber at baseline, red when weakened
    var pct = Math.round(mu * 100);
    var barColor = mu > 0.55 ? '#4af0a8' : mu < 0.45 ? '#f06060' : '#f0a060';
    // strength_eff modifier displayed as signed percentage from authored
    var modPct = Math.round((mu - 0.5) * 100);
    var modStr = modPct === 0 ? '±0%' : (modPct > 0 ? '+' + modPct + '%' : modPct + '%');
    html += '<div class="tr-row">'
      + '<span class="tr-label" title="' + label + '">' + label + '</span>'
      + '<div class="tr-bar-wrap"><div class="tr-bar" style="width:' + pct + '%;background:' + barColor + '"></div></div>'
      + '<span class="tr-mu">' + modStr + '</span>'
      + '<span class="tr-ticks">' + (t.ticks || 0) + 'T</span>'
      + '</div>';
  });
  container.innerHTML = html;
}

async function pollRuntime() {
  if (!pollingActive) { setTimeout(pollRuntime, POLL_MS); return; }
  try {
    const r = await fetch(API + '/field/runtime', {signal: AbortSignal.timeout(2000)});
    const d = await r.json();
    if (_runtimeExpanded) renderRuntime(d.agents || {});
  } catch(e) { /* silent — endpoint may not be reachable */ }
  setTimeout(pollRuntime, POLL_MS);
}

function renderRuntime(agents) {
  const container = document.getElementById('runtime-agents');
  if (!container) return;
  const names = Object.keys(agents);
  if (!names.length) {
    container.innerHTML = '<div style="color:#2a3a4a;font-size:9px;margin-top:3px;">no arc/record data yet</div>';
    return;
  }

  const CHANNELS = ['E','B','P','S'];
  const CH_COLOR = {E:'#f07060', B:'#60a8f0', P:'#f0c060', S:'#60f0a8'};

  let html = '';
  for (const name of names) {
    const rs  = agents[name];
    const phi = rs.constitutional_cv;
    const eps = rs.expressive_cv;
    const del = rs.delta;

    let bars = '';
    for (const ch of CHANNELS) {
      const phiW = Math.round((phi[ch] || 0) * 100);
      const epsW = Math.round((eps[ch] || 0) * 100);
      const d    = del[ch] || 0;
      const dCls = d > 0.005 ? 'rt-drift-pos' : d < -0.005 ? 'rt-drift-neg' : 'rt-drift-zero';
      const dStr = d === 0 ? '·' : (d > 0 ? '+' : '') + d.toFixed(3);
      bars += `
        <div class="rt-row">
          <span class="rt-ch" style="color:${CH_COLOR[ch]}">${ch}</span>
          <div class="rt-bar-wrap">
            <div class="rt-bar-phi" style="width:${phiW}%"></div>
            <div class="rt-bar-eps" style="width:${epsW}%"></div>
          </div>
          <span class="rt-val">${(eps[ch]||0).toFixed(3)}</span>
          <span class="rt-val ${dCls}" style="width:38px">${dStr}</span>
        </div>`;
    }

    const lastTick = rs.last_tick_time > 0
      ? new Date(rs.last_tick_time * 1000).toLocaleTimeString()
      : 'never';

    html += `
      <div class="rt-agent">
        <div class="rt-agent-name">${name}</div>
        <div class="rt-bars">${bars}</div>
        <div class="rt-meta">
          reg ${rs.regulation.toFixed(2)} · drift cap ±${rs.max_drift.toFixed(2)} · tick ${lastTick}
        </div>
      </div>`;
  }
  container.innerHTML = html;
}

// --- /field polling ---
async function pollField() {
  if (!pollingActive) return;
  try {
    const r = await fetch(API+'/field', {signal: AbortSignal.timeout(2000)});
    const d = await r.json();
    flash(true);
    applyFieldData(d);
    document.getElementById('ov-poll').textContent = 'synced '+new Date().toLocaleTimeString();
  } catch(e) {
    flash(false);
    document.getElementById('ov-poll').textContent = 'poll error';
  }
  setTimeout(pollField, POLL_MS);
}

// --- /hothouse/x3d polling ---
async function pollHotHouse() {
  if (!pollingActive) return;
  try {
    const r = await fetch(API+'/hothouse/x3d', {signal: AbortSignal.timeout(2000)});
    const d = await r.json();
    if (d && Object.keys(d).length > 0) {
      applyHotHouseData(d);
    } else {
      applyFieldChannelsToAgents();
    }
  } catch(e) {
    applyFieldChannelsToAgents();
  }
  setTimeout(pollHotHouse, HOTHOUSE_MS);
}

async function pollLighting() {
  if (!pollingActive) return;
  try {
    const r = await fetch(API + '/lighting/scalars', {signal: AbortSignal.timeout(2000)});
    if (r.ok) {
      const scalars = await r.json();
      applyLighting(scalars);
      setTimeout(pollLighting, LIGHTING_MS);
    } else if (r.status === 404) {
      // Endpoint not implemented — stop polling silently
      const lDiag = document.getElementById('light-diag');
      if (lDiag) lDiag.textContent = 'lighting: endpoint not available';
      return;
    } else {
      setTimeout(pollLighting, LIGHTING_MS);
    }
  } catch(e) {
    setTimeout(pollLighting, LIGHTING_MS);
  }
}

function applyFieldChannelsToAgents() {
  const agents = Object.entries((window._lastFieldData || {}).agents || {});
  if (!agents.length) return;
  const mockHotHouse = {};
  agents.forEach(([name, data]) => {
    const w = data.weights || {E:0.35,B:0.25,P:0.20,S:0.20};
    mockHotHouse[name] = {
      morphWeight_emotion: w.E || 0.35,
      animationSpeed:      w.B || 0.25,
      gazeDirectness:      w.P || 0.20,
      socialProximity:     w.S || 0.20,
      gestureConfidence:   0.5,
      interactionOpenness: 1.0
    };
  });
  applyHotHouseData(mockHotHouse);
}

// --- Apply /field to scene ---
function applyFieldData(d) {
  window._lastFieldData = d;
  try {
    const scene   = canvas.browser.currentScene;
    const agents  = Object.keys(d.agents || {});
    const epCount = d.episode_count || 0;
    const ac      = d.alignment_coherence || {};
    const coh     = typeof ac.global_coherence === 'number' ? ac.global_coherence : 0.5;
    const echoArr = Object.values(d.echo_chamber_risks || {});
    const echo    = echoArr.length > 0 ? Math.max(...echoArr) : 0.0;
    const tension = Math.min(1.0, (1.0 - coh)*0.6 + echo*0.4);

    document.getElementById('ov-coh').textContent    = coh.toFixed(3);
    document.getElementById('ov-echo').textContent   = echo.toFixed(3);
    document.getElementById('ov-ep').textContent     = epCount;
    document.getElementById('ov-agents').textContent = agents.length;

    const tel = document.getElementById('ov-tension');
    tel.textContent = tension.toFixed(3);
    tel.className = 'val '+(tension<0.3?'tension-low':tension<0.6?'tension-mid':tension<0.8?'tension-high':'tension-crit');

    try {
      const fn = scene.getNamedNode('GlobalField');
      if (fn) { fn.globalCoherence=coh; fn.echoRisk=echo; fn.tensionLevel=tension; fn.episodeCount=epCount; }
    } catch(e) { /* GlobalField not present in this scene — optional node */ }

    updateFieldMaterials(scene, coh, echo, tension);

    const mx = d.matrix || {};
    updateChannelNode(scene, 'Ch_SA', mx, 'The Steward',   'The Archivist');
    updateChannelNode(scene, 'Ch_SW', mx, 'The Steward',   'The Witness');
    updateChannelNode(scene, 'Ch_AW', mx, 'The Archivist', 'The Witness');
  } catch(e) { console.warn('applyFieldData:', e); }
}

function updateChannelNode(scene, def, matrix, from, to) {
  try {
    if (!matrix) return;
    const coh    = (matrix[from] && matrix[from][to]) ? matrix[from][to] : 0.3;
    const matDef = def.replace('Ch_', 'ChMat_');
    const mat    = scene.getNamedNode(matDef);
    if (mat) mat.transparency = Math.max(0.0, Math.min(0.9, 1.0 - coh));
  } catch(e) {}
}

function updateFieldMaterials(scene, coh, echo, tension) {
  try {
    const ct = scene.getNamedNode('CoherenceReadout');
    if (ct) ct.string = [`coh: ${coh.toFixed(2)}`];
    const tt = scene.getNamedNode('TensionReadout');
    if (tt) tt.string = [`tension: ${tension.toFixed(2)}`];
    const s0 = scene.getNamedNode('S0Light');
    if (s0) s0.intensity = Math.max(0.3, Math.min(1.2, 0.5 + tension * 0.7));
  } catch(e) {}
}

// --- Apply /hothouse/x3d to MCCFAgent nodes ---
function applyHotHouseData(data) {
  if (window._arcCVTimestamp && (Date.now() - window._arcCVTimestamp) < 5000) return;
  if (!data || !Object.keys(data).length) return;

  // Map agent cultivar names to their safeId suffix — matches composer safeId exactly
  // safeId = name.replace(/[^A-Za-z0-9_]/g,'_')
  // Build dynamically from any agents present in the data rather than hardcoding
  const agentMap = {};
  Object.keys(data).forEach(function(name) {
    agentMap[name] = name.replace(/[^A-Za-z0-9_]/g, '_');
  });

  let tracked = 0;
  let applied = 0;

  try {
    const scene = canvas.browser.currentScene;
    if (!scene) return;

    for (const [agentName, suffix] of Object.entries(agentMap)) {
      const d = data[agentName];
      if (!d) continue;
      tracked++;

      const bodyMat = scene.getNamedNode(`BodyMat_${suffix}`);
      if (bodyMat) {
        const eRaw = d.morphWeight_emotion || 0.13;
        const bRaw = d.animationSpeed      || 0.09;
        const pRaw = d.gazeDirectness      || 0.07;
        const e = Math.min(0.85, Math.max(0.25, (eRaw - 0.05) * 1.78 + 0.25));
        const b = Math.min(0.85, Math.max(0.25, (bRaw - 0.05) * 1.78 + 0.25));
        const p = Math.min(0.85, Math.max(0.25, (pRaw - 0.05) * 1.78 + 0.25));
        bodyMat.emissiveColor = new X3D.SFColor(e * 0.70, p * 0.25, b * 0.55);
        applied++;
      }

      const gazeMat = scene.getNamedNode(`GazeMat_${suffix}`);
      if (gazeMat) {
        const gaze     = d.gazeDirectness || 0.07;
        const gazeNorm = Math.min(0.85, Math.max(0.15, (gaze-0.05)*1.78+0.15));
        gazeMat.transparency = new X3D.SFFloat(Math.max(0.2, Math.min(0.7, 1.0 - gazeNorm)));
        applied++;
      }

      const ringMat = scene.getNamedNode(`RingMat_${suffix}`);
      if (ringMat) {
        const open = d.interactionOpenness || 1.0;
        ringMat.transparency = new X3D.SFFloat(Math.max(0.2, Math.min(0.75, 0.8 - open * 0.4)));
        applied++;
      }

      const honorMat = scene.getNamedNode(`HonorMat_${suffix}`);
      if (honorMat) {
        const conf = d.gestureConfidence || 0.8;
        honorMat.emissiveColor = new X3D.SFColor(0.9 * conf, 0.75 * conf, 0.1 * conf);
        applied++;
      }

      // Task 3 — Behavior clip selection from observed_cv.
      // Prefer observed_cv from _lastFieldData (live ϕ+ϵ); fall back to
      // hotHouse channel values when field data not yet available.
      try {
        var fieldAgents = (window._lastFieldData || {}).agents || {};
        var agentField  = fieldAgents[agentName];
        var cv;
        if (agentField && agentField.observed_cv) {
          cv = agentField.observed_cv;
        } else if (agentField && agentField.weights) {
          cv = agentField.weights;
        } else {
          cv = {
            E: d.morphWeight_emotion || 0.25,
            B: d.animationSpeed      || 0.25,
            P: d.gazeDirectness      || 0.25,
            S: d.socialProximity     || 0.25
          };
        }
        selectBehaviorClip(suffix, cv);
      } catch(behErr) { /* behavior selection is non-critical — skip silently */ }
    }
  } catch(e) {
    // Optional nodes (GazeMat_, BodyMat_, etc.) may not exist in all scenes — skip silently
  }

  const diagEl = document.getElementById('x3d-diag');
  if (diagEl) diagEl.textContent =
    `hothouse: ${tracked}/${Object.keys(agentMap).length} agents | ${applied} nodes updated`;
}

// ─────────────────────────────────────────────
// HAnim behavior clip selection — Task 3, Day 23
// ─────────────────────────────────────────────
// Reads observed_cv for each agent and selects the appropriate TimeSensor clip.
// Called from applyHotHouseData() on each poll tick.
// Only fires SAI writes when the selected clip changes — not on every tick.
// Hysteresis band of ±0.03 prevents rapid switching at threshold boundaries.

var _BEHAV_HYST = 0.03;

function selectBehaviorClip(agentSafeName, cv) {
  var config = _agentBehaviorClips[agentSafeName];
  if (!config || !config.clips || !config.clips.length) return;

  var clips   = config.clips;
  var defName = config.default || 'Default';
  var current = _agentCurrentClip[agentSafeName];

  function conditionMet(clip) {
    var chs = ['E','B','P','S'];
    for (var i = 0; i < chs.length; i++) {
      var ch = chs[i];
      var val = (cv && cv[ch] !== undefined) ? cv[ch] : 0.25;
      var minKey = ch + '_min', maxKey = ch + '_max';
      // Hysteresis: widen the window for the currently-playing clip to prevent flutter
      var hyst = (clip.name === current) ? _BEHAV_HYST : 0;
      if (clip[minKey] !== undefined && val < clip[minKey] - hyst) return false;
      if (clip[maxKey] !== undefined && val > clip[maxKey] + hyst) return false;
    }
    return true;
  }

  var oneshots = clips.filter(function(c) { return !c.loop  && conditionMet(c); });
  var loopers  = clips.filter(function(c) { return  c.loop  && conditionMet(c); });
  loopers.sort(function(a,b) { return (b.priority||0) - (a.priority||0); });

  var selected;
  if (oneshots.length) {
    oneshots.sort(function(a,b) { return (b.priority||0) - (a.priority||0); });
    selected = oneshots[0];
  } else if (loopers.length) {
    selected = loopers[0];
  } else {
    selected = clips.find(function(c) { return c.name === defName; }) || clips[0];
  }

  if (!selected) return;
  if (selected.name === current) return;   // no change — skip SAI write

  applyBehaviorClip(agentSafeName, selected);
}

function applyBehaviorClip(agentSafeName, clip) {
  var timerMap = _behaviorTimerMap[agentSafeName];
  if (!timerMap) {
    console.warn('applyBehaviorClip: no timerMap for', agentSafeName,
                 '— behavior timers never resolved (check pbActivateX3DTimers logs for this agent; likely the exported scene is missing <IMPORT ... AS="' +
                 (clip && clip.timerDEF) + '_' + agentSafeName + '"/> or it hasn\'t resolved yet).');
    return false;
  }

  // Disable all other behavior timers
  // MECHANISM (confirmed Day 25): enabled=true/false is the correct SAI path.
  // startTime/stopTime do NOT work in X_ITE for behavior switching.
  Object.keys(timerMap).forEach(function(base) {
    if (base !== clip.timerDEF) {
      try { timerMap[base].enabled = false; } catch(e) {}
    }
  });

  // Enable the selected clip
  var targetNode = timerMap[clip.timerDEF];
  if (!targetNode) {
    console.warn('applyBehaviorClip: timer not found:', clip.timerDEF, agentSafeName,
                 '— timerMap has:', Object.keys(timerMap).join(', ') || '(empty)');
    return false;
  }

  try {
    targetNode.enabled = true;
  } catch(e) {
    console.warn('applyBehaviorClip: SAI write failed for', agentSafeName, clip.timerDEF, e);
    return false;
  }

  var previous = _agentCurrentClip[agentSafeName] || '(none)';
  _agentCurrentClip[agentSafeName] = clip.name;

  if (clip.loop) {
    _agentLastLoopClip[agentSafeName] = clip.name;
    console.log('behavior:', agentSafeName, previous, '→', clip.name);
  } else {
    // Oneshot: fire once, then return to last looping clip
    console.log('behavior:', agentSafeName, previous, '→', clip.name, '(oneshot)');
    var returnTo  = _agentLastLoopClip[agentSafeName] || 'Default';
    var duration  = 5500;   // conservative fallback — JumpTimer/KickTimer cycleInterval ~5.5s
    try {
      var ci = targetNode.cycleInterval;
      if (ci && ci > 0) duration = Math.round(ci * 1000);
    } catch(e) {}
    var _gen = _pbCbGeneration;
    setTimeout(function() {
      // Self-expire if a reset has run since this oneshot fired
      if (_pbCbGeneration !== _gen) return;
      if (_agentCurrentClip[agentSafeName] !== clip.name) return;
      var config = _agentBehaviorClips[agentSafeName];
      if (!config) return;
      var returnClip = (config.clips || []).find(function(c) { return c.name === returnTo; });
      if (returnClip) applyBehaviorClip(agentSafeName, returnClip);
    }, duration + 150);
  }
  return true;
}

// ─────────────────────────────────────────────
// _switchBehaviorTimer — low-level walk/idle switcher
// ─────────────────────────────────────────────
// Stops all behavior timers for an agent, then starts the named one.
// targetDEF: 'WalkTimer' | 'DefaultTimer' | any BEHAVIOR_TIMER_BASES entry.
// tNow: unused — kept for call-site compat, ignored.
// Skips silently if the timer map is not yet built (HAnim still loading).
// Does NOT go through the clip condition system — this is a direct movement-state
// switch driven by the path interpolator, not by emotional CV.
//
// MECHANISM (confirmed Day 25):
//   enabled=true  starts the timer immediately and loops.
//   enabled=false stops it immediately.
//   startTime/stopTime do NOT work for this purpose in X_ITE — confirmed broken.
function _switchBehaviorTimer(agentSafeName, targetDEF, tNow) {
  var timerMap = _behaviorTimerMap[agentSafeName];
  if (!timerMap) {
    console.log('_switchBehaviorTimer: no timerMap for', agentSafeName, '— skipping');
    return;
  }

  console.log('_switchBehaviorTimer:', agentSafeName, '→', targetDEF);

  // Disable all timers except the target — each in its own try/catch
  BEHAVIOR_TIMER_BASES.forEach(function(base) {
    if (base === targetDEF) return;
    try {
      var n = timerMap[base];
      if (n) n.enabled = false;
    } catch(e) {
      console.warn('_switchBehaviorTimer: enabled=false failed for', base, e.message);
    }
  });

  // Enable the target
  var target = timerMap[targetDEF];
  if (!target) {
    console.warn('_switchBehaviorTimer: timer not found:', targetDEF, agentSafeName);
    return;
  }
  try {
    target.enabled = true;
  } catch(e) {
    console.warn('_switchBehaviorTimer: enabled=true failed:', agentSafeName, targetDEF, e.message);
    return;
  }

  var prev = _agentCurrentClip[agentSafeName] || '(none)';
  _agentCurrentClip[agentSafeName]  = targetDEF.replace('Timer','');
  _agentLastLoopClip[agentSafeName] = targetDEF.replace('Timer','');
  if (targetDEF === 'WalkTimer') _agentWalkStartTime[agentSafeName] = Date.now();
  console.log('_switchBehaviorTimer: done —', agentSafeName, prev, '→', targetDEF);
}

}

// SAI Diagnostic Test
// ================================================================
function runSAITest() {
  const out = document.getElementById('sai-test');
  if (!out) return;
  out.textContent = 'SAI test: running...';
  out.style.color = '#f0c060';

  try {
    const scene = canvas.browser.currentScene;
    if (!scene) { out.textContent = 'SAI test: no scene'; return; }

    // Use first registered avatar node for SAI test — KeyLight may not exist in all scenes
    var testNodeName = (window._avatarNodeNames && window._avatarNodeNames[0]) || 'Avatar_Cindy';
    const key = scene.getNamedNode(testNodeName);
    if (!key) { out.textContent = 'SAI test ERROR: Named node \'' + testNodeName + '\' not found'; return; }

    const startTrans = key.translation;
    const startX = startTrans ? (startTrans.x || 0) : 0;
    const results = [];

    try {
      key.translation = new X3D.SFVec3f(startX, 0, 0);
      var t = key.translation;
      results.push('SFVec3f=>' + (t ? t.x.toFixed(2) : 'null'));
    } catch(e) { results.push('SFVec3f=>err:'+e.message.slice(0,20)); }
    // Restore
    try { if (startTrans) key.translation = startTrans; } catch(e) {}

    const report     = results.join(' | ');
    const anyChanged = results.some(r => r.indexOf('=>err') === -1 && r.indexOf('=>null') === -1);

    if (anyChanged) {
      out.style.color = '#4af0a8';
      out.textContent = '✓ SAI assignment works: ' + report;
      window.SAI_ENABLED = true;
      console.log('MCCF: SAI confirmed working —', report);
    } else {
      out.style.color = '#f06060';
      out.textContent = '✗ No assignment changed value: ' + report;
      console.log('MCCF: SAI still broken —', report);
    }
  } catch(e) {
    out.style.color = '#f06060';
    out.textContent = 'SAI test ERROR: ' + e.message;
  }
}

// --- applyArcCV — confirmed working path for SAI writes ---
// v3.2: adds S-channel → Pos_* translation alongside existing transparency
function applyArcCV(data) {
  if (!data || !data.cv) return;

  try {
    const scene = canvas.browser.currentScene;
    if (!scene) return;

    const cultivar  = data.cultivar || 'The Steward';
    const cv        = data.cv;
    const E         = cv.E || 0.35;
    const B         = cv.B || 0.25;
    const P         = cv.P || 0.25;
    const S         = cv.S || 0.10;
    const coherence = data.coherence || 0.35;

    // v3.4: late-bound suffix — matches composer safeId exactly
    const suffix = cultivar.replace(/[^A-Za-z0-9_]/g, '_');

    // v3.5: if broadcast includes scene-space position, drive avatar directly.
    // This is the Run Scene path — positions come from composer waypoints.
    // GUARD: skip during active X3D TimeSensor playback — the X3D interpolator owns
    // avatar.translation then. Writing it here causes jumps and interpolation fights.
    if (data.pos_x !== undefined && data.pos_z !== undefined) {
      var avatarNodeName = 'Avatar_' + suffix;
      if (!_x3dTimerActive || !_x3dTimerActive[avatarNodeName]) {
        const avatarNode = scene.getNamedNode('Avatar_' + suffix);
        if (avatarNode) {
          const x = parseFloat(data.pos_x) || 0;
          const z = parseFloat(data.pos_z) || 0;
          // Day 78, V5 Tasklist Phase 2 task 6: was hardcoded to 0 regardless
          // of a waypoint's actual elevation — composer's own _sceneArcAdvance
          // has real pos[1] available and now sends it (data.pos_y); this just
          // has to stop discarding it. Real correctness bug, not part of the
          // separate smooth-vs-snap decision (this preview stays a rough
          // snap-to-point on purpose, per the same Tasklist item) — only the Y
          // component was wrong before, not the interpolation approach.
          const y = parseFloat(data.pos_y) || 0;
          avatarNode.translation = new X3D.SFVec3f(x, y, z);
        }
      } else {
        console.log('applyArcCV: position write suppressed — X3D driving', avatarNodeName);
      }
    }

    // Set holdoff so hothouse polling does not overwrite transparency.
    window._arcCVTimestamp = Date.now();

    // Transparency from coherence (unchanged from v3.1)
    const trans = Math.max(0.02, Math.min(0.70, 0.65 - (coherence / 0.5) * 0.60));

    const bodyMat = scene.getNamedNode('BodyMat_' + suffix);
    if (bodyMat) bodyMat.transparency = new X3D.SFFloat(trans);

    const ringMat = scene.getNamedNode('RingMat_' + suffix);
    if (ringMat) ringMat.transparency = new X3D.SFFloat(Math.max(0.1, 0.8 - trans));

    const gazeMat = scene.getNamedNode('GazeMat_' + suffix);
    if (gazeMat) {
      const gazeTransp = Math.max(0.05, Math.min(0.70, 0.5 - P * 0.8));
      gazeMat.transparency = new X3D.SFFloat(gazeTransp);
    }

    // HUD — S-channel and Z position (translation done above)
    const diagEl = document.getElementById('x3d-diag');
    if (diagEl) diagEl.textContent =
      `arc W${data.step}: coh=${coherence.toFixed(3)} opacity=${(1-trans).toFixed(2)} E=${E.toFixed(2)} S=${S.toFixed(2)} [${suffix}]`;

  } catch(e) {
    console.warn('applyArcCV error:', e.message);
  }
}

// Day 85: real race condition, confirmed by a live test where a "wide"
// static shot at t0=0 visibly clobbered a "free_camera" cue that had
// already bound successfully at t0=26.2s. Root cause: every camera-shot
// executor below (_bindNamedViewpoint, _bindFreeCamera,
// _executeStaticCameraShot, _executeAgentOrbit, _executeAgentTrack,
// _executeMoveShot) retries its own trySet() closure up to 10x at 200ms
// intervals if its target node isn't ready yet — and NONE of them checked
// whether a NEWER camera cue had already fired and succeeded in the
// meantime. A slow cue's stale retry would win purely by timing luck,
// regardless of which cue actually fired more recently. This counter is
// incremented once per _fireCameraEventCue call; each executor stamps it
// onto the cue object and every trySet() checks it's still current
// immediately before actually writing the transform / binding the
// viewpoint — the retry LOOP still runs to completion either way, but a
// stale success becomes a silent no-op instead of an incorrect bind.

var _pbSceneArcFiles = [];

function _pbCurrentSceneName() {
  var sel = document.getElementById('x3d-file');
  if (!sel || !sel.value) return '';
  return sel.value.replace(/\.x3d$/i, '');
}

async function pbLoadFiles() {
  try {
    var sceneName = _pbCurrentSceneName();
    var url = API + '/arc/playback';
    if (sceneName) url += '?scene_name=' + encodeURIComponent(sceneName);
    const r = await fetch(url);
    const data = await r.json();
    _pbSceneArcFiles = data.files || [];

    // Populate the Take dropdown from distinct take_name values, newest-first
    // by each take's most recent file.
    var takeSel = document.getElementById('pb-take');
    if (takeSel) {
      while (takeSel.options.length > 1) takeSel.remove(1);
      var takeMtimes = {};
      _pbSceneArcFiles.forEach(function(f) {
        var t = f.take_name || '';
        if (!t) return;
        if (!(t in takeMtimes) || f.mtime > takeMtimes[t]) takeMtimes[t] = f.mtime;
      });
      var takeNames = Object.keys(takeMtimes).sort(function(a,b){ return takeMtimes[b]-takeMtimes[a]; });
      takeNames.forEach(function(t) {
        var opt = document.createElement('option');
        opt.value = t;
        opt.textContent = t;
        takeSel.appendChild(opt);
      });
      // Auto-select the newest take rather than leaving "— all takes —" —
      // this is what actually keeps the Arc dropdown scoped to one scene's
      // one take by default, rather than merely "not some other scene's."
      takeSel.selectedIndex = takeNames.length ? 1 : 0;
    }

    _pbPopulateArcDropdown(takeSel ? takeSel.value : '');

    cacheSceneContext(_pbSceneArcFiles);
  } catch(e) {
    var el = document.getElementById('pb-step-info');
    if (el) el.textContent = 'Could not load files.';
  }
}

function pbTakeChanged() {
  var takeSel = document.getElementById('pb-take');

}

function _pbPopulateArcDropdown(takeFilter) {
  const sel = document.getElementById('pb-file');
  if (!sel) return;
  while (sel.options.length > 1) sel.remove(1);
  var files = takeFilter
    ? _pbSceneArcFiles.filter(function(f){ return f.take_name === takeFilter; })
    : _pbSceneArcFiles;
  files.forEach(function(f) {
    const opt = document.createElement('option');
    opt.value = f.filename;
    opt.dataset.sceneName = f.scene_name || '';
    opt.dataset.takeName  = f.take_name  || '';
    // Prefer server-supplied path_name over cultivar name
    var label;
    if (f.path_name && f.path_name !== f.cultivar) {
      label = f.path_name.replace(/_/g,' ');
    } else if (f.label) {
      label = f.label;
    } else {
      // Parse from filename: arc_{anything}_{timestamp}.xml
      var base = (f.filename||'').replace(/^arc_/,'').replace(/\.xml$/,'');
      var tsMatch = base.match(/^(.*?)_([0-9]{8,}|[0-9]{4}-[0-9]{2}-[0-9]{2}.*)$/);
      label = tsMatch ? tsMatch[1].replace(/_/g,' ') : base.replace(/_/g,' ');
    }
    // Append cultivar in brackets if it differs from path label
    var cultivarSuffix = (f.cultivar && f.cultivar.replace(/_/g,' ').toLowerCase() !== label.toLowerCase())
      ? ' ['+f.cultivar+']' : '';
    opt.textContent = label + cultivarSuffix
      + (f.steps_seen ? ' ('+f.steps_seen+'wp)' : '');
    sel.appendChild(opt);
  });
  // Auto-select the newest arc (first in list, server returns newest-first)
  if (sel.options.length > 1) {
    sel.selectedIndex = 1;
    pbFileChanged();
  } else {
    pbFileChanged(); // clears display state — nothing to select
  }
  // Cache first waypoint of first arc for reset fallback
  if (files[0] && files[0].first_waypoint) {
    window._pbFirstWaypoint = files[0].first_waypoint;
  }
}

function pbClearSelect() {

function pbFileChanged() {
  const f = document.getElementById('pb-file');
  const el = document.getElementById('pb-step-info');
  if (el) el.textContent = (f && f.value) ? 'Ready. Press Play.' : 'No arc loaded.';
  const qr = document.getElementById('pb-qr');
  if (qr) qr.style.display = 'none';
  _pbLastStepKey = {};
  _lerpDest = {};
  _pbSceneVoiceMap = null;
  pbStopPolling();
  // Fetch scene definition XML for voice map and start positions
  var sceneName = (f && f.selectedOptions[0]) ? f.selectedOptions[0].dataset.sceneName : '';
  if (sceneName) {
    fetch(API + '/scene/load/scene', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({filename: sceneName + '_scene.xml'})
    })
    .then(function(r){ return r.ok ? r.text() : Promise.reject('not found'); })
    .then(function(txt){
      // Store the raw response — we need the scene XML not the parsed JSON
      // Re-fetch as raw XML from scenes/ dir via a direct file fetch isn't available
      // Instead: rebuild EmotionalArc XML fragment from JSON response for voice/position use
      try {
        var data = JSON.parse(txt);
        // Reconstruct minimal scene def XML from placedAgents for voice map + start positions
        var frag = '<Scene>';
        Object.values(data.placedAgents || {}).forEach(function(a) {
          var pos = a.position || [0,0,0];
          frag += '<EmotionalArc cultivar="'+_xe(a.name)+'" voice="'+_xe(a.voice||'')+'">'
                + '<StartPosition x="'+pos[0]+'" y="'+pos[1]+'" z="'+pos[2]+'"/>'
                + '</EmotionalArc>';
        });
        frag += '</Scene>';
        window._loadedSceneDefXml = frag;
        _pbSceneVoiceMap = null;
      } catch(e) { console.warn('pbFileChanged: scene parse error', e); }
    })
    .catch(function(e){ console.warn('pbFileChanged: could not load scene def', e); });
  }
}

function pbLoadVoices() {
  if (!window.speechSynthesis) return;
  function populate() {
    var voices = speechSynthesis.getVoices().filter(function(v){
      return v.lang.startsWith('en');
    });
    if (!voices.length) return;
    _pbVoices = voices;
    // Rebuild scene voice map with newly loaded voices
    _pbSceneVoiceMap = null;
  }
  if (speechSynthesis.onvoiceschanged !== undefined)
    speechSynthesis.onvoiceschanged = populate;
  populate();
}

function pbSpeak(text) {
  var voiceEl = document.getElementById('pb-voice');
  if (!voiceEl || !voiceEl.checked) return;
  if (!text || text === _pbLastSpoken) return;
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  var utt = new SpeechSynthesisUtterance(text);
  // Use scene voice map default (first voice) — no manual dropdown
  if (_pbVoices.length) utt.voice = _pbVoices[0];
  utt.rate = 0.95;
  speechSynthesis.speak(utt);
  _pbLastSpoken = text;
}

function _xe(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

async function _buildSceneVoiceMapFromCultivars() {
  // Preferred path: read voice directly from /cultivars/xml (Character Creator is authoritative)
  var map = {};
  if (!_pbVoices.length) return map;
  try {
    var r = await fetch(API + '/cultivars/xml');
    if (!r.ok) return map;
    var data = await r.json();
    (data.cultivars || []).forEach(function(c) {
      var name = c.agentname;
      var voiceName = c.voice_name;
      if (!name || !voiceName) return;
      function baseVoiceName(s) {
        return s.replace(/\s*-\s*[A-Z].*$/, '').replace(/\s+Desktop\b.*$/, '').replace(/\s*\(.*\)\s*$/, '').trim().toLowerCase();
      }
      var voiceBase = baseVoiceName(voiceName);
      var v = _pbVoices.find(function(v){ return v.name === voiceName; })
           || _pbVoices.find(function(v){ return v.name.indexOf(voiceName) === 0; })
           || _pbVoices.find(function(v){ return voiceName.indexOf(v.name) === 0; })
           || _pbVoices.find(function(v){ return baseVoiceName(v.name) === voiceBase; });
      if (v) map[name] = v;
    });
  } catch(e) { console.warn('_buildSceneVoiceMapFromCultivars error:', e); }
  return map;
}

function _buildSceneVoiceMap() {
  // Fallback path: parse <EmotionalArc cultivar="X" voice="Y"> from loaded scene XML
  // Used when /cultivars/xml is unavailable or returns no voice data.
  var map = {};
  var src = window._loadedSceneDefXml || window._loadedSceneXml;
  if (!src || !_pbVoices.length) return map;
  try {
    var doc = new DOMParser().parseFromString(src, 'text/xml');
    doc.querySelectorAll('EmotionalArc').forEach(function(el) {
      var name = el.getAttribute('cultivar');
      var voiceName = el.getAttribute('voice');
      if (!name || !voiceName) return;
      function baseVoiceName(s) {
        return s.replace(/\s*-\s*[A-Z].*$/, '').replace(/\s+Desktop\b.*$/, '').replace(/\s*\(.*\)\s*$/, '').trim().toLowerCase();
      }
      var voiceBase = baseVoiceName(voiceName);
      var v = _pbVoices.find(function(v){ return v.name === voiceName; })
           || _pbVoices.find(function(v){ return v.name.indexOf(voiceName) === 0; })
           || _pbVoices.find(function(v){ return voiceName.indexOf(v.name) === 0; })
           || _pbVoices.find(function(v){ return baseVoiceName(v.name) === voiceBase; });
      if (v) map[name] = v;
    });
  } catch(e) { console.warn('_buildSceneVoiceMap error:', e); }
  return map;
}

var _pbSceneVoiceMap = null;  // built once per scene load

// Pending onComplete callback for in-progress TTS — keyed by TTS content key.
// When pbSpeakQALines is called with the same lines (duplicate key), the new onComplete
// replaces the old one so the correct callback fires when speech finishes.
var _pbPendingOnComplete = {};

// _pbSpeakToken, _pbLastSpoken, _pbLastStepKey are now per-cultivar dicts (declared above).

function pbSpeakQALines(qaLines, onComplete, cultivarKey) {
  // cultivarKey — safe name of the speaking cultivar (e.g. 'Cindy', 'The_Steward').
  // Used to key _pbLastSpoken, _pbSpeakToken per cultivar so concurrent arcs
  // do not cancel each other's TTS chains.
  // Callers that don't pass cultivarKey fall back to a shared '__default__' key
  // (single-arc compat).
  var ck = cultivarKey || '__default__';

  var voiceEl = document.getElementById('pb-voice');
  if (!voiceEl || !voiceEl.checked) {
    console.log('pbSpeakQALines: voice off — firing onComplete immediately for', ck);
    if (onComplete) onComplete();
    return;
  }
  if (!window.speechSynthesis || !qaLines || !qaLines.length) {
    console.log('pbSpeakQALines: no speech engine or empty lines — firing onComplete for', ck);
    if (onComplete) onComplete();
    return;
  }
  var key = qaLines.map(function(l){return l.text;}).join('|');
  if (key === (_pbLastSpoken[ck] || '')) {
    // Same lines already queued or speaking for this cultivar — replace pending onComplete.
    if (onComplete) {
      _pbPendingOnComplete[ck + '|' + key] = onComplete;
      console.log('pbSpeakQALines: duplicate [' + ck + '] — replaced pending onComplete');
    }
    return;
  }
  _pbLastSpoken[ck] = key;
  if (onComplete) _pbPendingOnComplete[ck + '|' + key] = onComplete;

  // Per-cultivar cancellation token — only invalidates this cultivar's chain,
  // not other cultivars speaking concurrently.
  _pbSpeakToken[ck] = (_pbSpeakToken[ck] || 0) + 1;
  var myToken = _pbSpeakToken[ck];

  function _ensureVoiceMapThenSpeak(retriesLeft) {
    if (!_pbVoices.length) {
      if (window.speechSynthesis) {
        var v = speechSynthesis.getVoices().filter(function(v){ return v.lang.startsWith('en'); });
        if (v.length) _pbVoices = v;
      }
    }
    if ((!_pbSceneVoiceMap || Object.keys(_pbSceneVoiceMap).length === 0) && _pbVoices.length) {
      _buildSceneVoiceMapFromCultivars().then(function(map) {
        if (Object.keys(map).length > 0) {
          _pbSceneVoiceMap = map;
        } else {
          _pbSceneVoiceMap = _buildSceneVoiceMap();
        }
        _continueAfterVoiceMap(retriesLeft);
      }).catch(function() {
        _pbSceneVoiceMap = _buildSceneVoiceMap();
        _continueAfterVoiceMap(retriesLeft);
      });
      return;
    }
    _continueAfterVoiceMap(retriesLeft);
  }

  function _continueAfterVoiceMap(retriesLeft) {
    if (!_pbVoices.length && retriesLeft > 0) {
      setTimeout(function(){ _ensureVoiceMapThenSpeak(retriesLeft - 1); }, 300);
      return;
    }
    // Acquire global speech lock — only one cultivar speaks at a time.
    // If locked, enqueue this cultivar's speech chain for later.
    if (_pbSpeechLock) {
      _pbSpeechQueue.push(function() { _doSpeak(); });
      console.log('pbSpeakQALines: [' + ck + '] queued (speech lock held), queue length', _pbSpeechQueue.length);
      return;
    }
    _pbSpeechLock = true;
    _doSpeak();
  }

  function _doSpeak() {
    var queue = qaLines.filter(function(l){return l.text && l.text.trim();});
    var capturedKey   = key;
    var capturedCk    = ck;
    var capturedToken = myToken;
    var rotationCount = 0;
    function speakNext(i) {
      if ((_pbSpeakToken[capturedCk] || 0) !== capturedToken) {
        console.log('pbSpeakQALines: [' + capturedCk + '] cancelled (token mismatch) — suppressing onComplete');
        _pbSpeechLock = false;
        _drainSpeechQueue();
        return;
      }
      if (i >= queue.length) {
        // Chain complete — release lock and drain next waiting cultivar
        _pbSpeechLock = false;
        var cbKey = capturedCk + '|' + capturedKey;
        var cb = _pbPendingOnComplete[cbKey];
        delete _pbPendingOnComplete[cbKey];
        _drainSpeechQueue();
        if (cb) cb();
        return;
      }
      var line = queue[i];
      var utt = new SpeechSynthesisUtterance(line.text);
      utt.rate = 0.95;
      var speaker = line.speaker || (line.type === 'Question' ? '__Q__' : '__R__');
      var sceneVoice = _pbSceneVoiceMap && _pbSceneVoiceMap[speaker];
      if (sceneVoice) {
        utt.voice = sceneVoice;
      } else {
        if (_pbSpeakerVoiceMap[speaker] === undefined) {
          _pbSpeakerVoiceMap[speaker] = rotationCount % Math.max(1, _pbVoices.length);
          rotationCount++;
        }
        if (_pbVoices[_pbSpeakerVoiceMap[speaker]]) utt.voice = _pbVoices[_pbSpeakerVoiceMap[speaker]];
      }
      // Timeout fallback: if browser blocks speech (no user gesture, AudioContext issue),
      // utt.onend never fires. After 8s per line, force advance so arc doesn't stall.
      var _uttDone = false;
      var _uttTimeout = setTimeout(function() {
        if (!_uttDone) {
          _uttDone = true;
          // Day 84 diagnostic: previously indistinguishable in the logs from a
          // real utt.onend completion — both just called speakNext(i+1). Added
          // after a live report of dialogue "firing a few lines, then skipping
          // to the last one" with no way to tell whether lines were actually
          // being spoken or silently timing out. This makes that visible.
          console.warn('pbSpeakQALines: [' + capturedCk + '] line ' + i + ' TIMED OUT after 8s (utt.onend never fired) — forcing advance:', line.text.substring(0,40));
          speakNext(i+1);
        }
      }, 8000);
      utt.onend  = function() { if (!_uttDone) { _uttDone = true; clearTimeout(_uttTimeout); speakNext(i+1); } };
      utt.onerror = function(e) { if (!_uttDone) { _uttDone = true; clearTimeout(_uttTimeout); console.warn('pbSpeakQALines: [' + capturedCk + '] line ' + i + ' ERRORED —', e && e.error, '— advancing:', line.text.substring(0,40)); speakNext(i+1); } };
      if (speechSynthesis.paused) {
        speechSynthesis.resume();
        console.log('pbSpeakQALines: resumed paused speechSynthesis before speak');
      }
      console.log('pbSpeakQALines: speak()', line.text.substring(0,40),
                  'voice=', utt.voice ? utt.voice.name : 'default',
                  'pending=', speechSynthesis.pending,
                  'paused=', speechSynthesis.paused);
      speechSynthesis.speak(utt);
    }
    speakNext(0);
  }

  _ensureVoiceMapThenSpeak(3);
}

// _drainSpeechQueue — called when speech lock is released.
// Starts the next waiting cultivar's speech chain if any.
function _drainSpeechQueue() {
  if (_pbSpeechLock || _pbSpeechQueue.length === 0) return;
  var next = _pbSpeechQueue.shift();
  if (next) {
    _pbSpeechLock = true;
    next();
  }
}

// Track last arrived segment per agent — set by segmentArrived callback
var _x3dLastArrivedSeg = {};

// Guard: set true when the final waypoint TTS has been handed off, preventing
// a second pbReleaseDwell call (from the onComplete chain) from re-entering.
var _pbArcComplete = {};  // {agentSafeName: bool} — per-agent arc-complete flag
var _pbExpectedAgents = 0;      // set by pbPlayAll/pbPlay — how many agents are expected
var _pbLastArcFiles = [];       // kept for legacy/debug; not used for Chorus firing
var _chorusTranscript = [];     // [{label, speaker, text}] — accumulated live during playback
var _chorusFinalCV   = {};      // {E,B,P,S} — CV from the last waypoint of the last agent to complete
var _pbCultivarSessionMap = {}; // {cultivarSafeName: session_id} — set by pbPlayAll
// Day 77: which path/order group each agent is CURRENTLY on. Set once, right
// before that group's activation begins (_pbPlayAllInner's per-group loop);
// read by every function below that constructs a Timer_/Arrival_/Dwell_ DEF
// name for the "current" segment of an agent's movement. Correct because group
// processing is strictly sequential — _pbWaitForGroup blocks until group N
// fully completes before group N+1 starts, so exactly one order is ever
// "current" for a given agent at any moment. This avoids threading an explicit
// order parameter through the whole TTS/dialogue call chain (pbReleaseDwell's
// callers are deep inside display/speech logic with no natural order context)
// while still fixing the actual bug: those DEF names used to be constructed
// bare (Timer_Cindy_1, Arrival_Cindy) regardless of which of an agent's
// multiple paths was actually active, always resolving to path order=1's
// nodes even while a later group was supposed to be running.
var _pbAgentCurrentOrder = {};
function _pbOrderSuffix(order) {
  var o = parseInt(order) || 1;
  return (o === 1) ? '' : ('_' + o);  // must match mccf_scene_composer.html's
                                        // buildInterpNodes/buildInterpRoutes suffix exactly
}

function pbReleaseDwell(agentSafeName) {
  console.log('pbReleaseDwell: ENTERED for', agentSafeName, 'seg=', _x3dLastArrivedSeg[agentSafeName]||0, '_pbArcComplete=', !!_pbArcComplete[agentSafeName]);
  // Called after TTS completes for an X3D-driven agent.
  //
  // Architecture (Day 18 — self-contained Arrival scripts):
  //   Each Arrival_X script owns its movement chain.
  //   JS communicates via two Arrival fields only:
  //     startFromLoader (SFBool)  — kicks Timer_1 after WP1 dwell
  //     advanceSeg (SFInt32)      — sends completed seg number; Arrival starts next timer
  //   MCCFMaster is NOT used for movement. No shared SFString bus. N-agent safe.

  if (_pbArcComplete[agentSafeName]) {
    console.log('pbReleaseDwell: arc already complete — ignoring spurious call for', agentSafeName);
    return;
  }
  if (!canvas || !canvas.browser) return;

  try {
    var scene = canvas.browser.currentScene;
    if (!scene) return;
    var seg = _x3dLastArrivedSeg[agentSafeName] || 0;

    // seg=0: WP1 TTS complete, no segment arrived yet.
    // Wait dwell interval (Dwell_X_1 cycleInterval) then fire Arrival_X.startFromLoader.
    // Dwell_X_1 node NOT started here — reserved for after seg=1 arrives.
    if (seg === 0) {
      var _suf0 = _pbOrderSuffix(_pbAgentCurrentOrder[agentSafeName]);
      var dwell0Name = 'Dwell_' + agentSafeName + _suf0 + '_1';
      var dwell0Node = null;
      try { dwell0Node = scene.getNamedNode(dwell0Name); } catch(e) {}
      var dwell0Interval = dwell0Node ? (dwell0Node.cycleInterval || 2.0) : 2.0;
      var _agentForStart = agentSafeName;
      var _arrForStart = 'Arrival_' + agentSafeName + _suf0;
      console.log('pbReleaseDwell: WP1 complete — waiting', dwell0Interval,
                  's then firing startFromLoader for', agentSafeName, 'order', _pbAgentCurrentOrder[agentSafeName]||1);
      setTimeout(function() {
        try {
          var arr = canvas.browser.currentScene.getNamedNode(_arrForStart);
          if (arr) {
            // Read scene time from Timer_1 node directly — canvas.browser.currentTime
            // returns 0 in X_ITE when called from JS context. Timer.time is the live
            // scene clock and is always valid once the scene is running.
                    // Pass startTime slightly in the future (+100ms) so X_ITE has one
            // render frame to prepare before the timer begins evaluating fraction.
            // Using past time causes immediate mid-path snap on fast machines.
            var _tSrc = 'unknown';
            var tNow = (function() {
              var t = canvas && canvas.browser && canvas.browser.currentTime;
              if (t && t > 1.0) { _tSrc = 'browser.currentTime'; return t + 0.1; }
              var wall = performance.now() / 1000;
              if (wall > 1.0) { _tSrc = 'performance.now'; return wall + 0.1; }
              return 0.1;
            })();
            arr.startFromLoader = tNow;
            console.log('pbReleaseDwell: startFromLoader fired for', _agentForStart, 'at t=', tNow, 'src=', _tSrc);
            // Walk starts when Timer_1 isActive=true fires — handled by _wirePathTimerBehavior.
          } else {
            console.warn('pbReleaseDwell: ' + _arrForStart + ' not found');
          }
        } catch(e) { console.warn('pbReleaseDwell startFromLoader error:', e); }
      }, Math.round(dwell0Interval * 1000));
      return;
    }

    // seg>0: segment just arrived — start Dwell, then advance.
    var dwellNodeName = 'Dwell_' + agentSafeName + _pbOrderSuffix(_pbAgentCurrentOrder[agentSafeName]) + '_' + seg;
    var dwellNode = null;
    try { dwellNode = scene.getNamedNode(dwellNodeName); } catch(e) {}

    if (!dwellNode) {
      console.warn('pbReleaseDwell: ' + dwellNodeName + ' not found — advancing immediately');
      _pbAdvanceSeg(agentSafeName, seg);
      return;
    }

    try {
      dwellNode.startTime = _x3dNow(agentSafeName) || (performance.now() / 1000);
      dwellNode.enabled   = true;
      console.log('pbReleaseDwell: started', dwellNodeName, 'for', agentSafeName, 'seg', seg);
    } catch(e) {
      console.warn('pbReleaseDwell: could not start dwell node:', e);
    }

    // Fire dwell sound clip for this zone (Track 4: one-shot, loop=false).
    // Clip_<ZoneId>_Dwell node must exist in X3D with a non-empty url to be audible.
    try {
      var _segZones = _agentSegZoneMap[agentSafeName] || {};
      var _dwZoneId = _segZones[seg] || '';
      if (_dwZoneId) {
        var _dwClipName = 'Clip_' + _dwZoneId + '_Dwell';
        var _dwScene = canvas.browser.currentScene;
        var _dwClip = null;
        try { _dwClip = _dwScene.getNamedNode(_dwClipName); } catch(e2) {}
        if (_dwClip && _dwClip.url && _dwClip.url.length > 0 && _dwClip.url[0]) {
          var _dwNow = _x3dNow(agentSafeName) || (performance.now() / 1000);
          _dwClip.stopTime  = _dwNow - 0.01;
          _dwClip.startTime = _dwNow + 0.05;
          console.log('pbReleaseDwell: fired dwell sound', _dwClipName, 'for zone', _dwZoneId);
        } else {
          console.log('pbReleaseDwell: no dwell url for zone', _dwZoneId, '— silent dwell');
        }
      } else {
        console.log('pbReleaseDwell: no zone mapped for', agentSafeName, 'seg', seg, '— no dwell sound');
      }
    } catch(e) {
      console.warn('pbReleaseDwell: dwell sound error:', e);
    }

    // DefaultTimer fires when Timer_N fraction_changed>=0.99 — handled by _wirePathTimerBehavior.
    // pbReleaseDwell owns dwell timing only, not behavior switching.

    var dwellInterval  = dwellNode.cycleInterval || 2.0;
    var _capturedAgent = agentSafeName;
    var _capturedSeg   = seg;
    setTimeout(function() {
      _pbAdvanceSeg(_capturedAgent, _capturedSeg);
    }, Math.round(dwellInterval * 1000));

  } catch(e) {
    console.warn('pbReleaseDwell error:', e);
  }
}

// _pbAdvanceSeg — sends advanceSeg=completedSeg to Arrival_X after dwell expires.
// Arrival_X starts the next timer if one exists, or logs arc complete.
// If no next timer found in scene, JS fetches the final waypoint.
function _pbAdvanceSeg(agentSafeName, completedSeg) {
  if (_pbArcComplete[agentSafeName]) return;
  if (!canvas || !canvas.browser) return;
  try {
    var scene2 = canvas.browser.currentScene;
    if (!scene2) return;
    var _suf = _pbOrderSuffix(_pbAgentCurrentOrder[agentSafeName]);

    // Peek: does next timer exist?
    var nextTimerName = 'Timer_' + agentSafeName + _suf + '_' + (completedSeg + 1);
    var nextTimer = null;
    try { nextTimer = scene2.getNamedNode(nextTimerName); } catch(e) {}

    if (nextTimer) {
      var arr = null;
      try { arr = scene2.getNamedNode('Arrival_' + agentSafeName + _suf); } catch(e) {}
      if (arr) {
        arr.advanceSeg = completedSeg;
        console.log('_pbAdvanceSeg: advanceSeg=' + completedSeg + ' sent to Arrival_' + agentSafeName + _suf);
        // WalkTimer is switched on by segmentArrived callback when the next
        // segment fires — do NOT switch here to avoid a race with the dwell DefaultTimer.
      }
    } else {
      // Last segment — fetch and display final waypoint for THIS agent's session
      console.log('_pbAdvanceSeg: last segment for', agentSafeName, '— fetching final waypoint');
      _pbArcComplete[agentSafeName] = true;
      // Day 84: fire any Dialogue Lines waiting on this agent's arc-complete
      // — the real event, same one that already triggers Chorus below.
      _fireDialogueArcComplete(agentSafeName);
      var _completedCount = Object.keys(_pbArcComplete).filter(function(k){ return _pbArcComplete[k]; }).length;
      var _allDone = (_pbExpectedAgents > 0 && _completedCount >= _pbExpectedAgents);
      console.log('_pbAdvanceSeg: completed', _completedCount, '/', _pbExpectedAgents, 'allDone=', _allDone);
      // Route step to this agent's specific session (pbPlayAll) or global (pbPlay)
      var _sid = _pbCultivarSessionMap[agentSafeName] || null;
      var _stepUrl = _sid
        ? (API + '/arc/playback/step')
        : (API + '/arc/playback/step');
      var _stepBody = _sid
        ? JSON.stringify({session_id: _sid})
        : '{}';
      fetch(_stepUrl, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: _stepBody
      })
        .then(function(r) { return r.json(); })
        .then(function(d) {
          // For pbPlayAll: extract this agent's session state from the response
          var _agentState = d;
          if (_sid && d.sessions && d.sessions[_sid]) {
            _agentState = d.sessions[_sid].state || d.sessions[_sid];
          }
          pbUpdateDisplayFinal(_agentState, _allDone);
        })
        .catch(function(e) { console.warn('final waypoint fetch failed:', e); });
    }
  } catch(e) {
    console.warn('_pbAdvanceSeg error:', e);
  }
}

// Track which avatar safenames are being driven by X3D TimeSensor (not JS lerp)
var _x3dTimerActive = {};

function _x3dNow(agentSafeName) {
  // Returns current X_ITE scene time as a positive float, or null.
  // agentSafeName optional — if provided, tries to read from that agent's Dwell node
  // (startTime + cycleInterval = completion time = approximately now).
  // Multiple strategies tried in order of reliability.
  try {
    // Strategy 1: browser.currentTime — works in some X_ITE builds, returns 0 in others
    var t = canvas && canvas.browser && canvas.browser.currentTime;
    if (t && t > 0) return t;

    // Strategy 2: read from the just-completed Dwell node for this agent
    // Dwell.startTime + Dwell.cycleInterval = the scene time when dwell ended = now
    if (agentSafeName && canvas.browser.currentScene) {
      var sc = canvas.browser.currentScene;
      try {
        var dw = sc.getNamedNode('Dwell_' + agentSafeName + _pbOrderSuffix(_pbAgentCurrentOrder[agentSafeName]) + '_1');
        if (dw && dw.startTime > 0 && dw.cycleInterval > 0) {
          var dwEnd = dw.startTime + dw.cycleInterval;
          if (dwEnd > 1.0) return dwEnd;
        }
      } catch(e2) {}
    }

    // Strategy 3: any running TimeSensor's .time field
    if (canvas && canvas.browser && canvas.browser.currentScene) {
      var scene = canvas.browser.currentScene;
      var activeKeys = Object.keys(_x3dTimerActive);
      for (var i = 0; i < activeKeys.length; i++) {
        var suffix = activeKeys[i].replace(/^Avatar_/, '');
        try {
          var tn = scene.getNamedNode('Timer_' + suffix + _pbOrderSuffix(_pbAgentCurrentOrder[suffix]) + '_1');
          if (tn && tn.time > 0) return tn.time;
        } catch(e3) {}
      }
    }

    // Strategy 4: wall clock seconds since page load — always works, not scene time
    // but X_ITE scene clock tracks wall time closely after load
    var wall = performance.now() / 1000;
    if (wall > 1.0) return wall;

  } catch(e) {}
  return null;
}

// ─────────────────────────────────────────────
// ─────────────────────────────────────────────
// ─────────────────────────────────────────────
// _buildPivotCacheFromSceneXml — parse full waypoint sequence per agent
// ─────────────────────────────────────────────
// Reads <Path agent="X"><PathWaypoint ref="wpName"/></Path> and
// <Waypoint name="wpName" pos_x="X" pos_z="Z"/> from scene XML.
// Builds _agentWaypointCache[safeName] = {1:{pos_x,pos_z}, 2:..., ...}
// indexed 1-based by path order. Called at play start from _parseSceneZoneData.
function _buildPivotCacheFromSceneXml(doc) {
  // Build name→position map from all Waypoint elements
  var posMap = {};
  doc.querySelectorAll('Waypoint').forEach(function(el) {
    var name = el.getAttribute('name');
    var px   = el.getAttribute('pos_x');
    var pz   = el.getAttribute('pos_z');
    if (name && px !== null && pz !== null) {
      posMap[name] = { pos_x: parseFloat(px), pos_z: parseFloat(pz) };
    }
  });

  // Build ordered cache per agent from Path/PathWaypoint sequence
  doc.querySelectorAll('Path').forEach(function(pathEl) {
    var agent    = pathEl.getAttribute('agent') || '';
    var safeName = agent.replace(/[^A-Za-z0-9_]/g, '_');
    if (!safeName) return;

    var refs = pathEl.querySelectorAll('PathWaypoint');
    if (!refs.length) return;

    var cache    = {};
    var zoneMap  = {};   // seg# -> zoneId: seg N arrives AT the Nth PathWaypoint,
                         // so w2 (stepNo=2) is destination of seg 1: store at stepNo-1.
                         // stepNo=1 (start waypoint) has no incoming segment -- skipped.
    var stepNo = 1;
    refs.forEach(function(ref) {
