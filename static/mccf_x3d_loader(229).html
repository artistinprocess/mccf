      var wpName = ref.getAttribute('ref');
      if (wpName && posMap[wpName]) {
        cache[stepNo] = { pos_x: posMap[wpName].pos_x, pos_z: posMap[wpName].pos_z, wpName: wpName };
        // Zone for waypoint (from _waypointZoneMap if already populated, or doc fallback)
        var zid = _waypointZoneMap[wpName] || _waypointZoneMap[wpName.toUpperCase()] || '';
        if (!zid) {
          // fallback: scan Waypoint elements in this doc for zone attribute
          var wpEl = doc.querySelector('Waypoint[name="' + wpName + '"]');
          if (wpEl) zid = wpEl.getAttribute('zone') || '';
        }
        // stepNo-1 = segment index that arrives AT this waypoint (w2=seg1, w3=seg2, ...)
        // stepNo=1 is the start waypoint -- no incoming segment, skip.
        if (zid && stepNo > 1) zoneMap[stepNo - 1] = zid;
        stepNo++;
      }
    });

    if (Object.keys(cache).length > 0) {
      _agentWaypointCache[safeName] = cache;
      console.log('_buildPivotCacheFromSceneXml:', safeName,
        Object.keys(cache).length, 'waypoints —',
        Object.values(cache).map(function(p){
          return '(' + p.pos_x + ',' + p.pos_z + ')';
        }).join(' → '));
    }
    if (Object.keys(zoneMap).length > 0) {
      _agentSegZoneMap[safeName] = zoneMap;
      console.log('_buildPivotCacheFromSceneXml: segZoneMap for', safeName, JSON.stringify(zoneMap));
    }
  });
}

// ─────────────────────────────────────────────
// EventCues — read from scene XML, fire SAI at WP arrivals
// ─────────────────────────────────────────────

function _parseEventCues(doc) {
  // Read <EventCues><Cue .../></EventCues> from scene XML doc.
  // Called from _parseSceneZoneData after _buildPivotCacheFromSceneXml.
  //
  // Day 85: rewritten alongside the Composer export-side fix. This used
  // to parse the OLD, trigger-based schema (t/dur/trigger/agent/shot/
  // subject/...) — the rich Camera Cue Spec v1.0 fields plus a
  // waypoint-arrival trigger vocabulary. The current Events Editor
  // (mccf_timeline_prototype.html, Day 81+) authors a much simpler flat
  // schema instead — track/target/label/t0/duration, fired by absolute
  // scene-clock time, not by a named trigger. Confirmed by reading that
  // tool's own CUES shape directly, not guessed. Old-schema attributes
  // (shot=, subject=, trigger=, agent=, node=, etc.) are no longer
  // written by anything and are not parsed here — this project has never
  // actually shipped a scene with real EventCues content until this fix,
  // so there is no legacy real-world XML to stay compatible with.
  var cues = [];
  doc.querySelectorAll('EventCues > Cue').forEach(function(el) {
    function ga(attr) { return el.getAttribute(attr); }
    function gf(attr, def) { var v = parseFloat(ga(attr)); return isNaN(v) ? (def !== undefined ? def : null) : v; }
    var cue = {
      track:    ga('track')  || 'camera',
      target:   ga('target') || '',
      label:    ga('label')  || '',
      t0:       gf('t0', 0),
      duration: gf('dur', 2),
      // Day 85: real bug caught before it bit — several existing camera
      // shot executors (_executeAgentOrbit, _executeAgentTrack,
      // _executeMoveShot) read cue.dur directly, a holdover from the old
      // schema's field name. This parser only set cue.duration, so every
      // move/orbit/track shot would have silently fallen back to a
      // hardcoded 4s default regardless of what was actually authored —
      // no error, just a wrong number. Both names now carry the same
      // value so every existing consumer keeps working, whichever name
      // it happens to read.
      dur:      gf('dur', 2),
      clip:     ga('clip')   || null,     // gesture cues only
      pathId:      ga('pathId') || null,     // path cues only
      walkGesture: ga('walkGesture') || null, // path cues only, optional
      pathStart: (ga('pathStartX') !== null) ? [gf('pathStartX',0), gf('pathStartY',0), gf('pathStartZ',0)] : null,
      pathStartOrient: (ga('pathStartAngle') !== null) ? [gf('pathStartAX',0), gf('pathStartAY',1), gf('pathStartAZ',0), gf('pathStartAngle',0)] : null,
      // Day 88: real, new track types. triggerRef is the exact node name
      // to look up via getImportedNode() — computed by Composer, not
      // recomputed here, so this parser doesn't need to know the naming
      // formula at all, just read what's given.
      internalDef: ga('internalDef') || null,
      triggerRef:  ga('triggerRef')  || null,
      visible:     ga('visible') === 'false' ? false : true,  // movie cues only; defaults true (matches the form's own default)
    };
    if (cue.track === 'camera') {
      // Day 85: full camera field parse, matching exactly what the
      // Composer writer now emits and what _fireCameraEventCue and its
      // downstream executors (_executeStaticCameraShot, _executeMoveShot,
      // _executeAgentOrbit, _executeAgentTrack) actually read. Previously
      // NONE of these were parsed at all — even with the writer and the
      // Timeline authoring UI both fixed, every camera cue would have
      // arrived here with just track/target/label/t0/dur and nothing a
      // real shot needs.
      if (ga('shot'))       cue.shot       = ga('shot');
      if (ga('subject'))    cue.subject    = ga('subject');
      if (ga('camera'))     cue.camera     = ga('camera');
      if (ga('viewpoint'))  cue.viewpoint  = ga('viewpoint');
      cue.jump       = ga('jump') === 'false' ? false : true;
      cue.transition = ga('transition') || 'cut';
      if (ga('flyDuration') !== null) cue.flyDuration = gf('flyDuration');
      if (ga('distance')    !== null) cue.distance    = gf('distance');
      if (ga('height')      !== null) cue.height      = gf('height');
      if (ga('hAngle')      !== null) cue.hAngle      = gf('hAngle');
      if (ga('vAngle')      !== null) cue.vAngle      = gf('vAngle');
      if (ga('distanceEnd') !== null) cue.distanceEnd = gf('distanceEnd');
      if (ga('heightEnd')   !== null) cue.heightEnd   = gf('heightEnd');
      if (ga('hAngleEnd')   !== null) cue.hAngleEnd   = gf('hAngleEnd');
      if (ga('vAngleEnd')   !== null) cue.vAngleEnd   = gf('vAngleEnd');
      if (ga('arcDepth')        !== null) cue.arcDepth        = gf('arcDepth');
      if (ga('trackOffset')     !== null) cue.trackOffset     = gf('trackOffset');
      if (ga('trackOffsetEnd')  !== null) cue.trackOffsetEnd  = gf('trackOffsetEnd');
      if (ga('trackDepth')      !== null) cue.trackDepth      = gf('trackDepth');
      cue.loop = ga('loop') === 'true';
    }
    cues.push(cue);
  });
  _eventCues = cues;
  console.log('[EventCues] loaded:', _eventCues.length, _eventCues.map(function(c){ return c.track + '@' + c.t0 + 's:' + (c.target||c.shot||c.viewpoint||'?'); }).join(', '));
}

// _resolveWpTriggerNames — given a server current_waypoint object, return
// candidate trigger name strings for THIS waypoint only.
// Problem: server WP id (e.g. "Waypt2", "W2", "WAYPT2") often does not match
// the scene XML waypoint name (e.g. "w2") that EventCues triggers are authored against.
// Fix: use stepno (1-based from server) to index into _wpXmlNamesList (0-based)
// to find the ONE canonical XML name for the arriving WP.
// Return only [serverIds..., xmlNameForThisWP] — NOT all WP names.
// BUG 1 Day 58: old code returned all XML names, firing every camera cue at every WP.
function _resolveWpTriggerNames(stepWp) {
  var seen = {};
  var candidates = [];
  function add(n) {
    if (n && !seen[n]) { seen[n] = true; candidates.push(n); }
  }
  // Server-provided id variants for this WP
  add(stepWp.name);
  add(stepWp.id);
  add(stepWp.label);
  // Day 63 bug fix: resolve the canonical XML name via the label/id map FIRST.
  // This is the primary fix — the path server identifies arrivals by `label`
  // ("SForw"), but cues are authored against the XML `name` ("stewardForwad").
  // Direct map lookup has no dependency on stepno or document order, so it's
  // correct regardless of how many agents/paths share the scene's waypoint pool.
  // (Caveat: if two waypoints share a label, last-one-parsed wins — see
  // _wpXmlLabelMap's declaration comment.)
  var _resolvedViaLabel = false;
  if (stepWp.label && _wpXmlLabelMap[stepWp.label.toLowerCase()]) {
    add(_wpXmlLabelMap[stepWp.label.toLowerCase()]);
    _resolvedViaLabel = true;
  }
  if (stepWp.id && _wpXmlLabelMap[stepWp.id.toLowerCase()]) {
    add(_wpXmlLabelMap[stepWp.id.toLowerCase()]);
    _resolvedViaLabel = true;
  }
  // Last resort ONLY — stepno positional index into the GLOBAL waypoint list, run
  // only if the label map above resolved nothing. This is deliberately gated, not
  // just de-prioritized: with multiple agents sharing one waypoint pool, this lookup
  // can resolve to a completely unrelated agent's waypoint (confirmed Day 63 — The
  // Steward's step 2 resolved to "AnnaToGiparu", a different agent's waypoint
  // entirely) — if left running unconditionally alongside the label-map fix, it could
  // still inject a wrong candidate and cause a false-positive cue fire in any scene
  // where that wrong candidate happens to match a real trigger string elsewhere.
  if (!_resolvedViaLabel) {
    var stepno = stepWp.stepno;
    if (stepno !== undefined && stepno !== null) {
      var idx = parseInt(stepno, 10) - 1;
      if (idx >= 0 && idx < _wpXmlNamesList.length) {
        add(_wpXmlNamesList[idx]);
      }
    } else {
      // No stepno — match by name/id against XML list (case-insensitive fallback)
      var serverKeys = [stepWp.name, stepWp.id, stepWp.label].filter(Boolean).map(function(s){ return s.toLowerCase(); });
      _wpXmlNamesList.forEach(function(n) {
        if (serverKeys.indexOf(n.toLowerCase()) !== -1) add(n);
      });
    }
  }
  return candidates;
}

function fireEventCuesForTrigger(triggerName) {
  // Day 85: dormant under the current schema — parsed cues no longer
  // carry a .trigger field at all (see _parseEventCues), since the
  // current Events Editor authors an absolute t0, not a named trigger.
  // Left in place rather than deleted (an older exported scene XML could
  // still theoretically have trigger= cues on disk), but every call site
  // below (waypoint arrival, 'manual') will now simply match nothing.
  // fireScheduledEventCues() is the real, current firing path — see its
  // own comment.
  if (!triggerName || !_eventCues.length) return;
  var tLower = triggerName.toLowerCase();
  _eventCues.forEach(function(cue) {
    if ((cue.trigger || '').toLowerCase() !== tLower) return;
    var delayMs = (parseFloat(cue.delay) || 0) * 1000;
    if (delayMs <= 0) {
      // Fire immediately
      _dispatchCue(cue, triggerName);
    } else {
      // Schedule after delay; track timer so Stop/Reset can cancel
      var tid = setTimeout(function() { _dispatchCue(cue, triggerName); }, delayMs);
      _pendingCueTimers.push(tid);
    }
  });
}

// Day 85: the real replacement firing path — one setTimeout per cue,
// scheduled from cue.t0 (seconds from scene start), which is the actual
// authoring model the current Events Editor uses (a playhead clock, not
// named triggers). Confirmed there was no absolute-scene-time firing
// mechanism anywhere in this file before this — every existing EventCues
// path fired on a named trigger match instead. Hooked from the same
// zero-point as fireManualCues/fireDialogueSceneStart (see
// _parseSceneZoneData's own setTimeout block), and shares
// _pendingCueTimers so Stop/Reset cancels these exactly like every other
// pending cue timer already does — no separate cleanup path to keep in
// sync.
function fireScheduledEventCues() {
  var xSel = document.getElementById('x3d-file');
  var sceneKey = xSel ? xSel.value : '__scene__';
  if (window._scheduledCuesFiredFor === sceneKey) return; // one-shot per scene, same guard pattern as fireManualCues
  window._scheduledCuesFiredFor = sceneKey;
  if (!_eventCues.length) return;
  _eventCues.forEach(function(cue) {
    var delayMs = Math.max(0, (parseFloat(cue.t0) || 0) * 1000);
    var tid = setTimeout(function() { _dispatchCue(cue, 'scene-clock t0=' + cue.t0 + 's'); }, delayMs);
    _pendingCueTimers.push(tid);
  });
  console.log('[EventCues] scheduled', _eventCues.length, 'cue(s) on the scene clock.');
}

// ─────────────────────────────────────────────
// Dialogue Lines (Day 83) — read from scene XML <Dialogue><Line>, fire via
// the SAME TTY/voice infrastructure waypoint QA dialogue already uses
// (pbSpeakQALines — real per-actor voice resolution, a real completion
// callback, and a global speech lock so concurrent speakers queue rather
// than collide). A distinct system from _eventCues above (camera/light/
// gesture/path/audio) — Dialogue Lines have their own trigger vocabulary
// (scene-start/zone/touch/sensed/declared/arc-complete), authored and
// exported by mccf_dialogue_editor.html, verified round-trip-correct
// against that tool's real engine this session (serialize → this Loader's
// own parse shape → reparse through the Dialogue Editor's real
// validateDialogueLines/parseDialogueBlock, all confirmed matching).
//
// Scope, deliberately: scene-start, sensed (chained playback), and
// declared (fixed elapsed time) triggers are fully wired below — these
// are what Anna's actual authored monologue uses (scene-start, then every
// subsequent line chained via sensed). zone/touch/arc-complete triggers
// are PARSED correctly (so the data is there and round-trips), but firing
// them needs real integration points this session didn't trace precisely
// — zone-entry detection, a real TouchSensor hookup, and the existing
// Chorus arc-complete callback (playback_manager.chorus_callback,
// mccf_chorus.py) are all separate subsystems. A Dialogue Line with one of
// those three trigger types is logged clearly, not silently dropped, so
// the gap stays visible instead of becoming a "why didn't this fire"
// mystery later.
// ─────────────────────────────────────────────

function _parseDialogueLines(doc) {
  var out = [];
  // Day 86: real, separate control from the (dormant, unrelated)
  // "Dispatcher runtime" checkbox in Composer — this is the actual
  // author-facing "author doesn't want per-line TTY, they're driving the
  // scene off a single pre-mixed audio track (Reaper mix) instead" case.
  // Defaults to enabled if the attribute is missing (e.g. an older
  // exported scene predating this control), so nothing changes for any
  // scene exported before today.
  var dlgEl = doc.querySelector('Dialogue');
  _dialogueTTYEnabled = dlgEl ? (dlgEl.getAttribute('enabled') !== 'false') : true;
  doc.querySelectorAll('Dialogue > Line').forEach(function(el) {
    var triggerStr = el.getAttribute('trigger') || 'scene-start';
    out.push({
      id:        el.getAttribute('id'),
      actor:     el.getAttribute('actor'),
      type:      el.getAttribute('type')  || 'Statement',
      mode:      el.getAttribute('mode')  || 'static',
      blocking:  el.getAttribute('blocking') === 'true',
      trigger:   _parseDialogueTrigger(triggerStr),
      text:      (el.textContent || '').trim(),
      ttsText:   el.hasAttribute('ttsText')   ? el.getAttribute('ttsText')   : null,
      audioFile: el.hasAttribute('audioFile') ? el.getAttribute('audioFile') : null,
    });
  });
  return out;
}

function _parseDialogueTrigger(s) {
  // Only the FIRST colon splits type from value — a lineId/zone/sensor
  // name is never expected to contain one, but this is safer than a
  // naive split(':') that would silently truncate one that did.
  var i = String(s).indexOf(':');
  var type = i === -1 ? s : s.slice(0, i);
  var rest = i === -1 ? '' : s.slice(i + 1);
  switch (type) {
    case 'scene-start':     return { type: 'scene-start' };
    case 'touch':           return { type: 'touch', sensor: rest };
    case 'zone':            return { type: 'zone', zone: rest };
    case 'sensed':          return { type: 'sensed', lineId: rest };
    case 'declared':        return { type: 'declared', time: parseFloat(rest) || 0 };
    case 'arc-complete':    return { type: 'arc-complete', zone: rest || null };
    case 'legacy-waypoint': return { type: 'legacy-waypoint', waypoint: rest };
    default:
      console.warn('[dialogue] unknown trigger type "' + type + '" on a Line — treating as scene-start');
      return { type: 'scene-start' };
  }
}

// Generic "who's speaking now" display — deliberately NOT reusing
// pbUpdateDisplay(state)'s Question/Response layout, which is shaped
// around waypoint step progress (stepno, E/B/P/S channels) that Dialogue
// Lines have none of. Most authored Dialogue content is Statement-typed
// (Anna's monologue entirely so), so forcing it into a Q/R pairing would
// be a shape mismatch, not a real fit — the same lesson this whole
// session kept relearning elsewhere.
function _dialogueUpdateDisplay(actor, text) {
  var qr = document.getElementById('pb-qr');
  var qEl = document.getElementById('pb-question');
  var rEl = document.getElementById('pb-response');
  if (qr) qr.style.display = 'block';
  if (qEl) qEl.innerHTML = '<b>' + _xe(actor || '') + ':</b> ' + _xe(text || '');
  if (rEl) rEl.textContent = '';
}

function _fireDialogueLine(line) {
  if (!line || _dialogueFiredIds[line.id]) return;   // fire-once — a Line only ever completes once per scene run
  if (!_dialogueTTYEnabled) return;   // Day 86: whole scene has per-line dialogue/TTY turned off — see _dialogueTTYEnabled's own declaration comment
  _dialogueFiredIds[line.id] = true;

  var displayText = line.text;                        // clean text always shown on screen
  var spokenText  = line.ttsText || line.text;         // tagged delivery text preferred for TTS when present

  console.log('[dialogue] firing', line.id, '(' + line.actor + '):', displayText.slice(0, 60));
  _dialogueUpdateDisplay(line.actor, displayText);

  // Same accumulator waypoint-triggered dialogue already feeds — Dialogue-
  // Line-sourced speech now participates in the same end-of-scene Chorus
  // transcript regardless of which trigger source produced it.
  if (typeof _chorusTranscript !== 'undefined') {
    _chorusTranscript.push({ label: line.id, speaker: line.actor, text: displayText });
  }

  function onLineComplete() {
    // Advance any sensed-chained lines waiting on this one.
    _dialogueLines.forEach(function(next) {
      if (next.trigger.type === 'sensed' && next.trigger.lineId === line.id) {
        _fireDialogueLine(next);
      }
    });
  }

  if (line.audioFile) {
    // Real audio path. Day 83: deliberately plain HTML5 Audio, NOT the X3D
    // BasicAudioSource scene-graph node — audio parenting/spatial wiring
    // was explicitly deferred this session ("audio parenting last... I
    // can always parent an audio node in X_ITE Editor if needed"). No
    // real audioFile exists yet to test this path against as of this
    // writing; the URL convention below (/static/<audioFile>) is an
    // assumption, not confirmed against a real server route — verify once
    // real ElevenLabs output actually lands and needs playing.
    var audio = new Audio('/static/' + line.audioFile);
    audio.addEventListener('ended', onLineComplete);
    audio.addEventListener('error', function() {
      console.warn('[dialogue] audio failed for', line.id, '— falling back to TTY');
      pbSpeakQALines([{ text: spokenText, speaker: line.actor }], onLineComplete, line.actor);
    });
    audio.play().catch(function(e) {
      console.warn('[dialogue] audio.play() rejected for', line.id, '—', (e && e.message) || e, '— falling back to TTY');
      pbSpeakQALines([{ text: spokenText, speaker: line.actor }], onLineComplete, line.actor);
    });
  } else {
    // TTY fallback — real per-actor voice resolution and a real completion
    // callback, both needed for the sensed-chain to actually advance.
    pbSpeakQALines([{ text: spokenText, speaker: line.actor }], onLineComplete, line.actor);
  }
}

function _fireDialogueLinesForTrigger(matchFn) {
  _dialogueLines.forEach(function(line) {
    if (matchFn(line.trigger)) _fireDialogueLine(line);
  });
}

function fireDialogueSceneStart() {
  // One-shot per scene — same guard pattern as fireManualCues() above.
  var xSel = document.getElementById('x3d-file');
  var sceneKey = xSel ? xSel.value : '__scene__';
  if (window._dialogueSceneStartFiredFor === sceneKey) return;
  window._dialogueSceneStartFiredFor = sceneKey;

  _fireDialogueLinesForTrigger(function(t) { return t.type === 'scene-start'; });

  // declared: is real elapsed-time-from-scene-start — scheduled once here,
  // not polled against a running clock (matches this whole cue system's
  // discrete-trigger architecture, not a continuous-time one).
  _dialogueLines.forEach(function(line) {
    if (line.trigger.type !== 'declared') return;
    var ms = Math.max(0, (line.trigger.time || 0) * 1000);
    var tid = setTimeout(function() { _fireDialogueLine(line); }, ms);
    _dialoguePendingDeclared.push(tid);
  });

  // zone / touch: parsed correctly above, not fired here — see this
  // section's own header comment for why. arc-complete is fired
  // separately, at the real moment an agent's arc completes (see
  // _fireDialogueArcComplete, hooked into _pbArcComplete's own real
  // assignment) — not from here, since scene-start is a one-shot moment
  // and arc-complete can happen at any point during playback.
  _dialogueLines.forEach(function(line) {
    if (line.trigger.type === 'zone' || line.trigger.type === 'touch') {
      console.warn('[dialogue] Line "' + line.id + '" has a ' + line.trigger.type +
        ' trigger — parsed, but not yet wired to real ' + line.trigger.type + ' detection this session.');
    }
  });
}

// Day 84: real arc-complete firing, hooked into the exact same event that
// already fires Chorus — _pbArcComplete[agentSafeName] = true, set the
// moment an agent finishes their last waypoint segment. Not a separate,
// parallel "arc-complete" concept — this Dialogue trigger type was
// deliberately modeled on this exact real event when the trigger parsing
// was first built; it just wasn't wired to fire anything until now.
//
// Scoped to matching on actor only, not the trigger's optional zone
// qualifier — Chorus's own zone semantics there are about which zone's
// <Chorus> config produced a capture, not "the agent is currently in this
// zone," and reusing that meaning here would be a guess, not a confirmed
// mapping. A line with a zone qualifier still fires (matched on actor),
// with a console note that the zone itself wasn't used to filter — a
// visible, documented gap rather than a silent behavior difference.
function _fireDialogueArcComplete(agentSafeName) {
  _dialogueLines.forEach(function(line) {
    if (line.trigger.type !== 'arc-complete') return;
    var lineActorSafe = (line.actor || '').replace(/[^A-Za-z0-9_]/g, '_');
    if (lineActorSafe !== agentSafeName) return;
    if (line.trigger.zone) {
      console.log('[dialogue] arc-complete Line "' + line.id + '" has a zone qualifier (' +
        line.trigger.zone + ') — firing on actor match only, zone not used to filter.');
    }
    _fireDialogueLine(line);
  });
}

function _dispatchCue(cue, firedVia) {
  console.log('[EventCues] firing:', cue.track, '"' + (cue.label || cue.target || '') + '"', 'via', firedVia);
  switch (cue.track) {
    case 'camera':   _fireCameraEventCue(cue);   break;
    case 'light':    _fireLightEventCue(cue);    break;
    case 'fog':      _fireFogEventCue(cue);      break;
    case 'bg':       _fireBgEventCue(cue);       break;
    case 'gesture':   _fireGestureEventCue(cue);   break;
    case 'behavior':  _fireBehaviorEventCue(cue);  break;
    case 'movie':     _fireMovieVisibilityEventCue(cue); break;
    case 'animation': _fireAnimationEventCue(cue); break;
    case 'path':      _firePathEventCue(cue); break;
    case 'turn':      _fireTurnEventCue(cue); break;
    default: console.warn('[EventCues] unknown track:', cue.track);
  }
}

function fireManualCues() {
  // One-shot per scene: guard against multiple _parseSceneZoneData completions
  // (e.g. from double canvas 'load' events or pbPlay pre-check calls).
  var xSel = document.getElementById('x3d-file');
  var sceneKey = xSel ? xSel.value : '__scene__';
  if (window._manualCuesFiredFor === sceneKey) return;
  window._manualCuesFiredFor = sceneKey;
  // Fire all cues with trigger="manual" — called after scene XML parses.
  fireEventCuesForTrigger('manual');
}

// ─────────────────────────────────────────────────────────────
// Camera EventCue execution — Camera System Spec v1.0
// ─────────────────────────────────────────────────────────────
//
// Two fundamentally different camera types — never mixed:
//
//   BAKED cameras — authored Viewpoint nodes in the X3D file, bound by name.
//     • agent_eye / agent_side  → VP_{subject}_{Eye|Side} inside agent Transform
//     • agent_orbit / agent_track → also baked/parented, but continuously animated via a
//       per-avatar TimeSensor — see _executeAgentOrbit / _executeAgentTrack below.
//     • cue.viewpoint set       → any named VP the author explicitly placed in scene
//     Loader action: _bindNamedViewpoint(name). No SAI position writes. No VP_Free.
//
//   RUNTIME cameras — VP_Free driven by the Loader via SAI. Never named by author.
//     • static shots (wide, medium, closeup, …) → compute position, write to VP_Free, bind
//     • move shots (orbit, dolly_in, …)         → Phase 2: TimeSensor drives VP_Free
//     Loader action: _executeStaticCameraShot(cue) or _executeMoveShot(cue).
//     VP_Free is an implementation vessel — it never appears in the author's vocabulary.
//
// Rule: VP_Free is only ever bound by the runtime camera system as a consequence of
// the author choosing a shot type. It is never bound as a fallback, default, or
// side-effect of incomplete cue data.

// Static shot types — all resolved via VP_Free driven by SAI (runtime path)
var _STATIC_SHOTS = {
  wide:true, medium:true, closeup:true, extreme_closeup:true,
  overhead:true, worms_eye:true, dutch:true,
  over_shoulder:true, profile:true, two_shot:true
};
// Move shot types — Phase 2, also runtime VP_Free but interpolated
var _MOVE_SHOTS = {
  dolly_in:true, dolly_out:true, pan:true, tilt:true,
  orbit:true, crane_up:true, track:true
};
// Day 63: move shots implemented via generic parametric interpolation (start→end
// lerp of distance/height/hAngle/vAngle, sampled through the same _computeCamPosition/
// _lookAtOrientation math the static shots use). orbit is handled separately — it is
// a full 360° sweep with no *End fields, not a start→end lerp.
// crane_up adds one extra parameter on top of the same lerp — arcDepth, a sinusoidal
// height bulge peaking at the move's midpoint (see _computeParametricMoveKeyframes) —
// matching spec §2's "start height, end height, arc depth, duration" exactly.
// track is deliberately excluded from this set — Day 63 decision was to build
// agent_track (parented, baked — see _executeAgentTrack below) instead of a free-camera
// version, since track is the strongest remaining candidate for agent-attached
// conversion and building it free first would risk the same after-the-fact rework
// orbit needed. The free 'track' shot type remains unimplemented (warns and skips).
var _LINEAR_MOVE_SHOTS = { dolly_in:true, dolly_out:true, pan:true, tilt:true, crane_up:true };

function _fireCameraEventCue(cue) {
  // Day 85: stamp this fire with the current sequence number BEFORE
  // dispatching to any shot executor below — see _cameraCueFireSeq's own
  // declaration comment for why. Every executor's trySet() checks
  // cue._fireSeq against the live counter right before actually writing/
  // binding, so a slow retry from an OLDER cue can no longer clobber a
  // newer cue that already succeeded.
  _cameraCueFireSeq++;
  cue._fireSeq = _cameraCueFireSeq;

  var shot = (cue.shot || '').toLowerCase();

  // ── BAKED PATH: agent-attached viewpoints ─────────────────
  // VP_{subject}_{Eye|Side} lives inside the agent Transform in X3D.
  // Loader just binds it — no position computation, no VP_Free.
  if (shot === 'agent_eye' || shot === 'agent_side') {
    var suffix = (shot === 'agent_eye') ? 'Eye' : 'Side';
    var subjectSafe = (cue.subject || '').replace(/[^A-Za-z0-9_]/g, '_');
    // Day 83: fly is NOT yet supported for avatar-attached viewpoints — the
    // target pose is local to the avatar's own (possibly moving) Transform,
    // and _flyCameraTo needs a flat world-space destination. Logged, not
    // silently dropped — falls back to the existing jump toggle (cut-only).
    if (cue.transition === 'fly') {
      console.warn('[EventCues] camera: fly requested for ' + shot + ' «' + (cue.subject||'?') +
        '» — not yet supported for avatar-attached viewpoints, falling back to cut');
    }
    _bindNamedViewpoint('VP_' + subjectSafe + '_' + suffix, cue.transition !== 'fly', cue._fireSeq);
    return;
  }

  // ── BAKED PATH: agent-orbit ────────────────────────────────
  // Day 64: a CAM_OrbitProto_{subject} ProtoInstance (AgentOrbitCamera, see
  // mccf_camera_protos.x3d) lives inside the agent's own Transform — parented, so the
  // avatar's world motion is free (no tracking math). Orbit math here is RELATIVE
  // OFFSET ONLY: radius/height/angle around the avatar's local origin. The avatar's
  // Transform translation is never read or written by this path — that's the whole
  // point of parenting.
  if (shot === 'agent_orbit') {
    _executeAgentOrbit(cue);
    return;
  }

  // ── BAKED PATH: agent-track ────────────────────────────────
  // Day 64: a CAM_TrackProto_{subject} ProtoInstance (AgentTrackCamera, see
  // mccf_camera_protos.x3d) lives inside the agent's own Transform — parented, same
  // principle as agent-orbit. Checked as its own explicit branch, not merged into
  // agent_orbit's — the keyframe math is different (linear lateral lerp vs circular
  // sweep) even though the parenting architecture and proto plumbing are identical.
  if (shot === 'agent_track') {
    _executeAgentTrack(cue);
    return;
  }

  // ── BAKED PATH: placed free camera ────────────────────────
  // Day 64: a CAM_Free_{name} FreeCamera ProtoInstance, placed via Composer's grid-based
  // camera placement UI. Static — no TimeSensor, no interpolation. Deliberately a
  // separate code path from cue.viewpoint below: that path calls _bindNamedViewpoint
  // directly on a plain top-level authored Viewpoint, but a FreeCamera's inner Viewpoint
  // is DEF'd "VP" *inside* its ProtoBody — unreachable via getNamedNode from outside,
  // same SAI-into-proto constraint as agent_orbit/agent_track. Binding it means setting
  // the ProtoInstance's own exposed set_bind field, not looking up an internal name that
  // doesn't exist from the outside.
  if (shot === 'free_camera' && cue.camera) {
    var freeCamSafe = cue.camera.replace(/[^A-Za-z0-9_]/g, '_');
    // Day 83: fly is NOT yet supported for placed FreeCamera destinations —
    // its world orientation is composed from three nested rotations (yaw/
    // pitch/roll, see mccf_camera_protos.x3d's FreeCamera ProtoBody), and
    // combining those into one axis-angle by hand is exactly the custom
    // rotation math this project's house style avoids. Logged, not silently
    // dropped — falls back to the existing instant bind.
    if (cue.transition === 'fly') {
      console.warn('[EventCues] camera: fly requested for free_camera «' + cue.camera +
        '» — not yet supported for placed FreeCamera destinations, falling back to cut');
    }
    _bindFreeCamera(freeCamSafe, cue._fireSeq);
    return;
  }

  // ── BAKED PATH: explicitly authored named viewpoint ───────
  // Author placed a named VP in the scene and referenced it by name in the cue
  // (VP_Overview, VP_Origin, a zone VP, or any other author-DEF'd top-level
  // Viewpoint). This is the only other case where _bindNamedViewpoint is called.
  if (cue.viewpoint) {
    // Day 83: fly support. Only safe here because these are plain top-level
    // <Viewpoint> nodes (see mccf_scene_composer.html's own export of
    // VP_Overview/VP_Origin/zone VPs) — position/orientation are already a
    // flat world-space value with no proto-wrapping or parenting to unwind,
    // unlike FreeCamera/agent-attached targets (see those two branches
    // above). Read directly via SAI field access, same pattern already used
    // throughout this file for reading authored node values.
    if (cue.transition === 'fly') {
      var _flyAttempts = 0;
      (function tryFlyToNamedVP() {
        _flyAttempts++;
        try {
          var scene = canvas.browser.currentScene;
          var targetVp = null;
          try { targetVp = scene.getImportedNode(cue.viewpoint); } catch(ie) {}
          if (!targetVp) { try { targetVp = scene.getNamedNode(cue.viewpoint); } catch(ne) {} }
          if (targetVp) {
            var toPosStr = targetVp.getField('position').toString();
            var toRotStr = targetVp.getField('orientation').toString();
            var toPos = String(toPosStr).trim().split(/\s+/).map(Number);
            var toRot = String(toRotStr).trim().split(/\s+/).map(Number);
            if (toPos.length === 3 && !toPos.some(isNaN) && toRot.length === 4 && !toRot.some(isNaN)) {
              console.log('[EventCues] camera: fly to baked VP «' + cue.viewpoint + '»');
              _flyCameraTo(toPos, toRot, cue.flyDuration || 2, cue.viewpoint);
              return;
            }
            console.warn('[EventCues] camera: fly «' + cue.viewpoint + '» — could not parse position/orientation, falling back to cut');
          } else if (_flyAttempts < 10) {
            setTimeout(tryFlyToNamedVP, 200);
            return;
          } else {
            console.warn('[EventCues] camera: fly target «' + cue.viewpoint + '» not found after retries, falling back to cut');
          }
        } catch(e) { console.warn('[EventCues] camera: fly «' + cue.viewpoint + '» exception:', e.message); }
        // Any failure above falls through to the ordinary cut bind, rather than doing nothing.
        _bindNamedViewpoint(cue.viewpoint, cue.jump !== false, cue._fireSeq);
      })();
      return;
    }
    console.log('[EventCues] camera: baked VP «' + cue.viewpoint + '»');
    _bindNamedViewpoint(cue.viewpoint, cue.jump !== false, cue._fireSeq);
    return;
  }

  // ── RUNTIME PATH: static computed shot via VP_Free ────────
  // Author chose a shot type from the static list. Loader computes position
  // from cue params and drives VP_Free. VP_Free is never named by the author.
  if (_STATIC_SHOTS[shot]) {
    _executeStaticCameraShot(cue);
    return;
  }

  // ── RUNTIME PATH: move shot via VP_Free (Phase 2) ─────────
  if (_MOVE_SHOTS[shot]) {
    _executeMoveShot(cue);
    return;
  }

  // ── No valid path — skip with diagnostic ─────────────────
  // Reaches here only if cue has no viewpoint= and an unrecognised or absent shot=.
  // VP_Free is never bound as a fallback.
  console.warn('[EventCues] camera: cue «' + (cue.label||'?') + '» — shot «' + shot +
    '» not recognised and no viewpoint= set. Cue skipped. ' +
    'Check Events Editor export or scene XML.');
}

// Bind a named Viewpoint node (VP_Overview, VP_w2_Eye, etc.)
// Day 77: VP_{subject}_Eye/Side now live inside the avatar's own Inline scope
// (Character-Creator-authored rig, per the Avatar Camera Rig Manifest doc), not at
// the outer scene scope Composer used to generate them at directly — so they need
// getImportedNode, the same mechanism already established and working for behavior
// timers (see pbActivateX3DTimers's own comment: "getNamedNode... does not resolve
// IMPORT'd nodes in X_ITE 11.6.x+"). Falls back to getNamedNode for anything that's
// still genuinely at outer scope (VP_Overview, VP_Origin, named scene viewpoints) —
// tries import first since that's now the common case for agent-attached types,
// not because outer-scope lookup stopped being valid for the things that still are.
function _bindNamedViewpoint(vpName, wantJump, expectedSeq) {
  var attempts = 0;
  function tryBind() {
    attempts++;
    try {
      var scene = canvas.browser.currentScene;
      var vpNode = null;
      try { vpNode = scene.getImportedNode(vpName); } catch(ie) {}
      if (!vpNode) { try { vpNode = scene.getNamedNode(vpName); } catch(ne) {} }
      if (vpNode) {
        // Day 85: stale-retry guard — see _cameraCueFireSeq's declaration
        // comment. If a newer camera cue has fired since this retry loop
        // started, this bind is stale: skip it rather than clobber
        // whatever the newer cue already set.
        if (expectedSeq !== undefined && expectedSeq !== _cameraCueFireSeq) {
          console.log('[EventCues] camera: stale bind of', vpName, 'skipped — a newer camera cue has fired since');
          return;
        }
        try {
          var jumpField = vpNode.getField('jump');
          if (jumpField) jumpField.setValue(wantJump !== false);
          else vpNode.jump = (wantJump !== false);
        } catch(je) { try { vpNode.jump = (wantJump !== false); } catch(je2) {} }
        vpNode.set_bind = true;
        console.log('[EventCues] camera: set_bind', vpName, 'jump=' + (wantJump !== false),
          attempts > 1 ? '(attempt ' + attempts + ')' : '');
        return;
      }
    } catch(e) {}
    if (attempts < 10) {
      setTimeout(tryBind, 200);
    } else {
      console.warn('[EventCues] camera: viewpoint not found after retries:', vpName);
    }
  }
  tryBind();
}

// Compute camera world position from subject position + framing params
function _computeCamPosition(subjectPos, distance, height, hAngleDeg) {
  var hRad = (hAngleDeg || 0) * Math.PI / 180;
  return [
    subjectPos[0] + distance * Math.sin(hRad),
    subjectPos[1] + height,
    subjectPos[2] + distance * Math.cos(hRad)
  ];
}

// Derive X3D axis-angle orientation so VP_Free looks from camPos toward targetPos
// vAngleDeg tilts the look-vector up (+) or down (-) additionally
//
// Day 63 bug fix — confirmed via user testing (CameraTestAll_scene.xml, all 22
// shot types) and traced against every call site before changing anything:
// targetPos passed in here is ALWAYS the subject's ground/base position (y=0) —
// from _resolveSubjectPos for free-camera shots, or [0,0,0] local origin for the
// parented agent_orbit/agent_track cases. Aiming directly at that ground point
// bakes a large, camera-height-dependent downward pitch into every shot BEFORE
// vAngleDeg is even added — the two compound instead of vAngle being the pure
// artistic tilt every preset value was clearly authored assuming it was.
// Symptom reported: cameras read as "pointing too low" across every shot type
// except worm's eye — consistent with this exact bug, since worm's eye's very
// low camera height (0.1) keeps the geometric term small enough not to show,
// not because worm's eye was unaffected.
// Fix: aim at approximate eye/head height instead of the ground — LOOK_AT_HEIGHT
// matches the 1.7m convention already used as the default camera height
// throughout this file. This does not eliminate geometric pitch for elevated
// cameras (a camera well above eye height still legitimately needs to tilt down
// to stay on target — that's real geometry, not a bug); it corrects the
// reference point the geometry is measured from.
// Consequence, expected and necessary: every preset's vAngle — including worm's
// eye's, which read as "fine" only because this bug's effect there was small —
// was calibrated against the old, wrong baseline. All of them need re-checked
// against this corrected math, not just the ones that read as visibly wrong.
var LOOK_AT_HEIGHT = 1.7;
function _lookAtOrientation(camPos, targetPos, vAngleDeg) {
  var dx = targetPos[0] - camPos[0];
  var dy = (targetPos[1] + LOOK_AT_HEIGHT) - camPos[1];
  var dz = targetPos[2] - camPos[2];
  // X3D cameras look down -Z by default. To face the target we need the -Z axis
  // to point toward (dx, dy, dz), so we negate the vector for atan2.
  // Yaw (rotation around Y): atan2(-dx, -dz) points -Z toward target in XZ plane.
  var yaw = Math.atan2(-dx, -dz);
  // Pitch — tilt up/down to target plus authored vAngle offset.
  // Positive pitch = look up, negative = look down.
  var horizDist = Math.sqrt(dx * dx + dz * dz);
  var pitch = Math.atan2(dy, horizDist) + ((vAngleDeg || 0) * Math.PI / 180);
  // Full quaternion compose: q_yaw (Y axis) * q_pitch (X axis)
  var cosY = Math.cos(yaw / 2),   sinY = Math.sin(yaw / 2);
  var cosP = Math.cos(pitch / 2), sinP = Math.sin(pitch / 2);
  // Quaternion multiply: q_yaw * q_pitch
  var qw = cosY * cosP;
  var qx = cosY * sinP;
  var qy = sinY * cosP;
  var qz = -sinY * sinP;
  // Convert quaternion to axis-angle
  var angle = 2 * Math.acos(Math.min(1, Math.max(-1, qw)));
  var s = Math.sqrt(1 - qw * qw);
  var ax, ay, az;
  if (s < 0.001) {
    ax = 0; ay = 1; az = 0;  // degenerate — default Y axis
  } else {
    ax = qx / s; ay = qy / s; az = qz / s;
  }
  return [ax, ay, az, angle];
}

// Resolve subject world position — looks up _waypointPosMap by current WP name for the subject
// Returns [x, y, z] or null if not resolvable
function _resolveSubjectPos(subjectName) {
  if (!subjectName) return null;
  var safeName = subjectName.replace(/[^A-Za-z0-9_]/g, '_');

  // ── Path 0: live X3D transform ────────────────────────────────────────
  // Real bug fix: every path below (1-5) is backend waypoint/arc-step
  // bookkeeping — none of them ever read the avatar's actual live
  // Transform. That was fine while every agent moved exclusively via the
  // waypoint/arc stepping system (each step genuinely fires a fresh
  // "WP arrival" that keeps _agentCurrentStep current), but a
  // RecordedPath-driven walk (the "path" EventCue) never fires those
  // arrivals at all -- confirmed live: _agentCurrentStep['Anna'] gets set
  // once, at the one-time initial "Begin arrive", and then never updates
  // again for the rest of the run, however far the RecordedPath actually
  // walks them. Every later camera cue computed its subject position from
  // that single frozen starting coordinate -- explaining exactly why the
  // camera kept framing near the start of the walk (in this scene's case,
  // near the Island/lake) regardless of where Anna herself had actually
  // arrived, while Anna's own position (driven independently by the
  // RecordedPath's own interpolators via ROUTE) was always correct. The
  // live Transform is authoritative for ANY locomotion mechanism, so it's
  // tried first now; the existing paths remain as fallbacks for whatever
  // this read can't handle (asset targets with no Avatar_ node, a subject
  // not yet placed in the scene, etc).
  try {
    var _liveNode = canvas.browser.currentScene.getNamedNode('Avatar_' + safeName);
    if (_liveNode) {
      var _liveT = _liveNode.translation;
      if (_liveT && typeof _liveT.x === 'number' && typeof _liveT.y === 'number' && typeof _liveT.z === 'number') {
        var lpos = [_liveT.x, _liveT.y, _liveT.z];
        console.log('[EventCues] _resolveSubjectPos «' + subjectName + '» → PATH 0 (live transform)', lpos);
        return lpos;
      }
    }
  } catch (eLive) { /* fall through to the bookkeeping-based paths below */ }

  // ── Path 1: runtime arrived position via _agentCurrentStep ──────────────
  // Preferred path: use the step number that was recorded when this cultivar
  // most recently arrived at a waypoint during live playback.
  var arrivedStep = _agentCurrentStep[safeName];
  if (arrivedStep !== undefined) {
    var runtimeCache = _agentWaypointCache[safeName];
    var runtimeEntry = runtimeCache && runtimeCache[arrivedStep];
    if (runtimeEntry) {
      var rpos = [parseFloat(runtimeEntry.pos_x) || 0, 0, parseFloat(runtimeEntry.pos_z) || 0];
      console.log('[EventCues] _resolveSubjectPos «' + subjectName + '» → PATH 1 (runtime step ' + arrivedStep + ')', rpos);
      return rpos;
    }
    console.warn('[EventCues] _resolveSubjectPos «' + subjectName + '» — _agentCurrentStep=' + arrivedStep +
      ' but no cache entry found (cache keys: ' + (runtimeCache ? Object.keys(runtimeCache) : 'null') + ')');
  }

  // ── Path 2: waypointPosMap keyed by subject name ─────────────────────────
  // Only applies when subjectName happens to match a WP name (rare — zone centroids etc.)
  var wpEntry = _waypointPosMap[subjectName] || _waypointPosMap[subjectName.toUpperCase()];
  if (wpEntry) {
    var wpos = [parseFloat(wpEntry.pos_x) || 0, 0, parseFloat(wpEntry.pos_z) || 0];
    console.log('[EventCues] _resolveSubjectPos «' + subjectName + '» → PATH 2 (_waypointPosMap match)', wpos);
    return wpos;
  }

  // ── Path 3: pre-loaded pivot cache fallback (all steps present) ──────────
  // WARNING: this cache contains ALL waypoints from scene XML at load time,
  // so "most recent step" is the highest-numbered WP, not the arrived one.
  // Only use as fallback when no runtime arrival has been recorded.
  var cache = _agentWaypointCache[safeName];
  if (cache) {
    var steps = Object.keys(cache).filter(function(k){ return !isNaN(k); }).map(Number).sort(function(a,b){return b-a;});
    if (steps.length > 0) {
      var entry = cache[steps[0]];
      var cpos = [parseFloat(entry.pos_x) || 0, 0, parseFloat(entry.pos_z) || 0];
      console.warn('[EventCues] _resolveSubjectPos «' + subjectName + '» → PATH 3 (pre-loaded cache step ' + steps[0] +
        ' — no runtime arrival recorded yet). pos=', cpos,
        '  All steps:', steps.join(','));
      return cpos;
    }
  }

  // ── Path 4: EmotionalArc start position ──────────────────────────────────
  if (_cultivarStartPos[subjectName]) {
    var sp = _cultivarStartPos[subjectName];
    console.log('[EventCues] _resolveSubjectPos «' + subjectName + '» → PATH 4 (start position)', sp);
    return sp;
  }

  // ── Path 5: scene centroid fallback ──────────────────────────────────────
  console.warn('[EventCues] _resolveSubjectPos «' + subjectName + '» → PATH 5: position not found — using origin.');
  return [0, 0, 0];
}

// Execute a static computed camera shot: position VP_Free via its CAM_Free_Transform parent and bind it.
//
// X3D Viewpoint position/orientation are OUTPUT fields — they report camera state, not set it.
// Writing to vpFree.position via SAI is ignored by X_ITE (and per spec).
// The correct pattern: VP_Free sits at local origin inside CAM_Free_Transform (a Transform node).
// The Loader writes translation/rotation to CAM_Free_Transform, then binds VP_Free.
// The Transform moves the camera; the Viewpoint just marks the bind point.
// Bind a placed FreeCamera by name (Day 64). Static camera, static bind — no keyframes,
// no timer, just set_bind on the ProtoInstance's exposed field, with the same
// find-with-retries pattern every other camera path in this file already uses (the scene
// may still be finishing setup when the very first cue in a scene fires).
function _bindFreeCamera(nameSafe, expectedSeq) {
  var attempts = 0;
  function trySet() {
    attempts++;
    try {
      var node = canvas.browser.currentScene.getNamedNode('CAM_Free_' + nameSafe);
      if (node) {
        // Day 85: stale-retry guard — see _cameraCueFireSeq's declaration comment.
        if (expectedSeq !== undefined && expectedSeq !== _cameraCueFireSeq) {
          console.log('[EventCues] camera: stale free-camera bind of', nameSafe, 'skipped — a newer camera cue has fired since');
          return;
        }
        node.set_bind = true;
        console.log('[EventCues] camera: free camera «' + nameSafe + '» bound');
        return;
      }
      console.warn('[EventCues] camera: free camera CAM_Free_' + nameSafe + ' not found — re-export scene from Composer');
    } catch (e) {
      console.warn('[EventCues] camera: free camera bind exception:', e.message);
    }
    if (attempts < 10) setTimeout(trySet, 200);
    else console.warn('[EventCues] camera: free camera CAM_Free_' + nameSafe + ' not found after retries');
  }
  trySet();
}

// Day 83: generic point-to-point camera "fly" transition, using a dedicated
// CAM_FlyTimer/CAM_FlyEase/CAM_FlyPosInterp/CAM_FlyOriInterp vessel (see
// mccf_scene_composer.html's exportX3D()/its alternate export path for the
// static nodes/ROUTEs — kept deliberately separate from the move-shot vessel
// CAM_Timer/CAM_PosInterp/CAM_OriInterp so the two TimeSensors never fan into
// CAM_Free_Transform's set_translation/set_rotation simultaneously). Real bug
// fix, not a new feature bolted on: the previous 'fly' transition
// (_bindNamedViewpoint toggling Viewpoint.jump=false via SAI before set_bind)
// did not animate anything at all. Per the real X3D spec (ISO/IEC
// 19775-1:2023 §23.3.1), jump=FALSE means "the view remains unchanged" on
// bind — not "smoothly transition". This function replaces that with a
// genuine 2-keyframe PositionInterpolator/OrientationInterpolator animation,
// eased through CAM_FlyEase (a fixed cosine ease-in-out curve, 0.5-0.5*cos(pi*t),
// authored once as static XML and never touched by the Loader at runtime).
// X3D's own OrientationInterpolator does correct SLERP between the two real
// keyframes for whatever fraction it's fed — no hand-rolled rotation math,
// regardless of the eased (non-linear) fraction feeding it. The Loader
// computes and writes the two keyframes once per fly, then does nothing
// further — the browser's own ROUTE chain drives every subsequent frame
// natively. Same "compute keyframes in JS, hand off to native interpolation"
// pattern already established by AgentOrbitCamera/AgentTrackCamera and every
// existing move shot — not a new architecture.
//
// FROM pose is read live via MCCF_PathRecorderProx.position_changed/
// orientation_changed — the same confirmed-working mechanism the Events
// Editor's own path recorder already uses (Day 78 finding: Viewpoint.position/
// orientation hold authored values only and do NOT reflect a live bound
// camera's actual world pose for any proto-wrapped or parented camera type —
// FreeCamera, AgentOrbitCamera/Track, agent_eye/side all fail that read).
// Reading the ProximitySensor instead works uniformly regardless of what's
// currently bound, with no proto-internal digging needed.
//
// Scope, deliberately: the TO pose must arrive pre-resolved into flat
// world-space position + ONE combined SFRotation. Callers that already have
// this cleanly — explicit named top-level Viewpoints (direct field read);
// static/move shot destinations (already computed via _lookAtOrientation) —
// are wired to this below. Callers that would need to combine multiple
// rotations to get there (a placed FreeCamera's yaw/pitch/roll; agent_eye/
// agent_side's avatar-local pose) are NOT wired to this yet — hand-combining
// nested rotations into one axis-angle is exactly the custom rotation math
// this project's house style avoids (see FreeCamera's own comment in
// mccf_camera_protos.x3d). Deferred, not silently dropped — see each
// unsupported caller's own diagnostic in _fireCameraEventCue below.
function _flyCameraTo(toPos, toRot, duration, label) {
  var attempts = 0;
  function trySet() {
    attempts++;
    try {
      var scene = canvas.browser.currentScene;
      var camXform   = scene.getNamedNode('CAM_Free_Transform');
      var vpFree     = scene.getNamedNode('VP_Free');
      var camTimer   = scene.getNamedNode('CAM_FlyTimer');
      var easeInterp = scene.getNamedNode('CAM_FlyEase');
      var posInterp  = scene.getNamedNode('CAM_FlyPosInterp');
      var oriInterp  = scene.getNamedNode('CAM_FlyOriInterp');
      var proxSensor = scene.getNamedNode('MCCF_PathRecorderProx');

      if (camXform && vpFree && camTimer && easeInterp && posInterp && oriInterp) {
        // FROM pose — live read via the ProximitySensor, same mechanism and
        // same field-parse convention as the Events Editor's path recorder
        // (_pathRecTick, mccf_events_editor_prototype_2.html). Falls back to
        // an instant snap+bind (old cut behavior) if the sensor is missing or
        // the camera is currently outside its sensed region — interpolating
        // from a bad/stale FROM pose would be worse than not interpolating.
        var fromPos = null, fromRot = null;
        if (proxSensor) {
          try {
            var activeStr = proxSensor.getField('isActive').toString();
            if (activeStr === 'TRUE' || activeStr === 'true') {
              var pParts = String(proxSensor.getField('position_changed').toString()).trim().split(/\s+/).map(Number);
              var rParts = String(proxSensor.getField('orientation_changed').toString()).trim().split(/\s+/).map(Number);
              if (pParts.length === 3 && !pParts.some(isNaN)) fromPos = pParts;
              if (rParts.length === 4 && !rParts.some(isNaN)) fromRot = rParts;
            }
          } catch (pe) { console.warn('[EventCues] camera: fly — ProximitySensor read failed:', pe.message); }
        }
        if (!fromPos || !fromRot) {
          console.warn('[EventCues] camera: fly «' + (label||'?') + '» — could not read a live FROM pose ' +
            '(sensor missing or camera outside sensed region) — falling back to instant cut');
          camXform.translation = new X3D.SFVec3f(toPos[0], toPos[1], toPos[2]);
          camXform.rotation    = new X3D.SFRotation(toRot[0], toRot[1], toRot[2], toRot[3]);
          requestAnimationFrame(function() { vpFree.set_bind = true; });
          return;
        }

        // Two-keyframe animation: 0 = current live pose, 1 = destination.
        // Same indexed MF array assignment pattern as _executeMoveShot (confirmed
        // against X_ITE's own README — bulk MFVec3f/MFRotation constructors don't
        // exist in X_ITE's SAI).
        posInterp.key.length = 0; posInterp.keyValue.length = 0;
        oriInterp.key.length = 0; oriInterp.keyValue.length = 0;
        posInterp.key[0] = 0; posInterp.keyValue[0] = new X3D.SFVec3f(fromPos[0], fromPos[1], fromPos[2]);
        posInterp.key[1] = 1; posInterp.keyValue[1] = new X3D.SFVec3f(toPos[0], toPos[1], toPos[2]);
        oriInterp.key[0] = 0; oriInterp.keyValue[0] = new X3D.SFRotation(fromRot[0], fromRot[1], fromRot[2], fromRot[3]);
        oriInterp.key[1] = 1; oriInterp.keyValue[1] = new X3D.SFRotation(toRot[0], toRot[1], toRot[2], toRot[3]);

        // Belt-and-suspenders — same as _executeMoveShot: rely on the static XML
        // ROUTEs from the Composer export, but confirm the chain at runtime too.
        // Topology here has one extra hop vs the move-shot vessel: CAM_FlyTimer
        // feeds CAM_FlyEase (the ease curve), and CAM_FlyEase's eased output —
        // not CAM_FlyTimer's raw linear fraction — feeds the two interpolators.
        try {
          canvas.browser.addRoute(camTimer,  'fraction_changed', easeInterp, 'set_fraction');
          canvas.browser.addRoute(easeInterp,'value_changed',    posInterp,  'set_fraction');
          canvas.browser.addRoute(easeInterp,'value_changed',    oriInterp,  'set_fraction');
          canvas.browser.addRoute(posInterp, 'value_changed',    camXform,   'set_translation');
          canvas.browser.addRoute(oriInterp, 'value_changed',    camXform,   'set_rotation');
        } catch(e) { console.warn('[EventCues] camera: fly addRoute via SAI failed:', e.message); }

        camTimer.cycleInterval = duration;
        camTimer.loop = false;

        // Snap to the FROM pose first — matches the live pose exactly, so this
        // is visually a no-op — then bind VP_Free, same sequencing as
        // _executeMoveShot's "snap to start, then bind, then start timer".
        camXform.translation = new X3D.SFVec3f(fromPos[0], fromPos[1], fromPos[2]);
        camXform.rotation    = new X3D.SFRotation(fromRot[0], fromRot[1], fromRot[2], fromRot[3]);

        requestAnimationFrame(function() {
          vpFree.set_bind = true;
          requestAnimationFrame(function() {
            // canvas.browser.currentTime returns 0 in some X_ITE builds — same
            // fallback every other startTime write in this file already uses.
            var _flyStartTime = (canvas.browser.currentTime && canvas.browser.currentTime > 0)
              ? canvas.browser.currentTime : (performance.now() / 1000);
            camTimer.startTime = _flyStartTime;
            camTimer.enabled   = true;
            console.log('[EventCues] camera: fly «' + (label||'?') + '» started, dur=' + duration +
              ' from=[' + fromPos.map(function(v){return v.toFixed(2);}).join(',') + ']' +
              ' to=[' + toPos.map(function(v){return v.toFixed(2);}).join(',') + ']');
          });
        });
        return;
      }
      var missing = [];
      if (!camXform)   missing.push('CAM_Free_Transform');
      if (!vpFree)     missing.push('VP_Free');
      if (!camTimer)   missing.push('CAM_FlyTimer');
      if (!easeInterp) missing.push('CAM_FlyEase');
      if (!posInterp)  missing.push('CAM_FlyPosInterp');
      if (!oriInterp)  missing.push('CAM_FlyOriInterp');
      console.warn('[EventCues] camera: fly — missing vessel nodes:', missing.join(', '), '— re-export scene from Composer');
    } catch(e) { console.warn('[EventCues] camera: fly trySet exception:', e.message); }
    if (attempts < 10) setTimeout(trySet, 200);
    else console.warn('[EventCues] camera: fly — vessel nodes not found after retries');
  }
  trySet();
}

function _executeStaticCameraShot(cue) {
  var subjectPos = _resolveSubjectPos(cue.subject) || [0, 0, 0];
  var distance  = (cue.distance  !== null && cue.distance  !== undefined) ? cue.distance  : 8;
  var height    = (cue.height    !== null && cue.height    !== undefined) ? cue.height    : 3;
  var hAngle    = (cue.hAngle    !== null && cue.hAngle    !== undefined) ? cue.hAngle    : 0;
  var vAngle    = (cue.vAngle    !== null && cue.vAngle    !== undefined) ? cue.vAngle    : 0;

  var camPos = _computeCamPosition(subjectPos, distance, height, hAngle);
  var orient = _lookAtOrientation(camPos, subjectPos, vAngle);

  // Day 83: real fly support. Destination is already a flat world position +
  // single combined orientation (computed above via _lookAtOrientation) —
  // exactly the shape _flyCameraTo needs, no extra work required for this
  // shot type. cut (the default) keeps the original direct-write+bind path
  // below, unchanged.
  if (cue.transition === 'fly') {
    _flyCameraTo(camPos, orient, cue.flyDuration || 2, cue.shot || cue.label);
    return;
  }

  var attempts = 0;
  function trySet() {
    attempts++;
    try {
      var scene = canvas.browser.currentScene;
