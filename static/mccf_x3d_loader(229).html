      } catch(e) { console.warn('spLoadSceneSound: parse error:', e); }
    })
    .catch(function(e) { console.warn('spLoadSceneSound: fetch error:', e); });
}

// Session C: build zone geometry table from scene XML <Zone> elements
// Replaces the hardcoded _SP_ZONE_GEOMETRY so new scenes work automatically
function spBuildZoneGeometryFromXml(doc) {
  if (!doc) return;
  // Clear first — do not merge, replace entirely so stale zones from other scenes don't persist
  _SP_ZONE_GEOMETRY = {};
  var built = 0;
  doc.querySelectorAll('Zone').forEach(function(zEl) {
    var id = zEl.getAttribute('id');
    var posEl = zEl.querySelector('Position');
    var radEl = zEl.querySelector('Radius');
    if (!id || !posEl) return;
    var cx = parseFloat(posEl.getAttribute('x') || 0);
    var cz = parseFloat(posEl.getAttribute('z') || 0);
    var radius = radEl ? parseFloat(radEl.getAttribute('value') || 4) : 4;
    _SP_ZONE_GEOMETRY[id] = { cx: cx, cz: cz, radius: radius };
    built++;
  });
  if (built > 0) {
    console.log('spBuildZoneGeometryFromXml:', built, 'zones —', JSON.stringify(_SP_ZONE_GEOMETRY));
    spBuildZoneTable();
  }
}

// Discover zones by scanning scene for Prox_ named nodes.
// Falls back to hard-coded list if SAI enumeration is unavailable.
function spDiscoverZones() {
  var found = [];
  try {
    var scene = canvas.browser.currentScene;
    if (!scene) return found;

    // X_ITE namedNodes Proxy is not enumerable via Object.keys — always returns {}.
    // Instead derive zone keys from _waypointZoneMap (already parsed from scene XML)
    // and confirm each Prox_ node exists via getNamedNode before adding.
    var seenKeys = {};
    Object.values(_waypointZoneMap).forEach(function(zoneKey) {
      if (!zoneKey || seenKeys[zoneKey]) return;
      seenKeys[zoneKey] = true;
      try {
        var prox = scene.getNamedNode('Prox_' + zoneKey);
        if (prox) {
          found.push({ key: zoneKey, label: zoneKey.replace(/_/g, ' ') });
        }
      } catch(e) {}
    });
  } catch(e) {}
  return found;
}

function spBuildZoneRows() {
  var container = document.getElementById('sp_zones');
  if (!container) return;
  container.innerHTML = '';

  _spZones.forEach(function(z) {
    var html =
      '<div class="sp-zone">' +
        '<div class="sp-zone-name">' + z.label + '</div>' +
        // Ambient row
        '<div class="sp-row">' +
          '<span class="sp-tag">Ambient</span>' +
          '<button class="sp-file-btn" id="sp_btn_'+z.key+'" onclick="spPickFile(\''+z.key+'\',\'ambient\')">Choose&hellip;</button>' +
          '<button class="sp-clear" onclick="spClearFile(\''+z.key+'\',\'ambient\')" title="Clear">&#x2715;</button>' +
          '<input type="range" class="sp-vol" id="sp_vol_'+z.key+'" min="0" max="1" step="0.01" value="0.8"' +
            ' oninput="spSetVol(\''+z.key+'\',\'ambient\',this.value)"/>' +
          '<span class="sp-val" id="sp_volval_'+z.key+'">80%</span>' +
        '</div>' +
        // Dwell row
        '<div class="sp-row">' +
          '<span class="sp-tag">Dwell</span>' +
          '<button class="sp-file-btn" id="sp_btn_'+z.key+'_dwell" onclick="spPickFile(\''+z.key+'\',\'dwell\')">Choose&hellip;</button>' +
          '<button class="sp-clear" onclick="spClearFile(\''+z.key+'\',\'dwell\')" title="Clear">&#x2715;</button>' +
          '<input type="range" class="sp-vol sp-vol-dwell" id="sp_vol_'+z.key+'_dwell" min="0" max="1" step="0.01" value="0.9"' +
            ' oninput="spSetVol(\''+z.key+'\',\'dwell\',this.value)"/>' +
          '<span class="sp-val" id="sp_volval_'+z.key+'_dwell">90%</span>' +
        '</div>' +
      '</div>';
    container.insertAdjacentHTML('beforeend', html);
  });

  // One shared hidden file input, created once
  if (!document.getElementById('sp_hidden_file')) {
    var fi = document.createElement('input');
    fi.type = 'file';
    fi.id   = 'sp_hidden_file';
    fi.className = 'sp-file-input';
    fi.accept = '.mp3,.wav,.mid,.midi';
    fi.addEventListener('change', spOnFileChosen);
    document.body.appendChild(fi);
  }
}

function spPickFile(zoneKey, layer) {
  _spPickTarget = { key: zoneKey, layer: layer };
  var fi = document.getElementById('sp_hidden_file');
  fi.value = '';
  fi.click();
}

function spOnFileChosen(evt) {
  var file = evt.target.files[0];
  if (!file || !_spPickTarget) return;
  var t       = _spPickTarget;
  var isDwell = (t.layer === 'dwell');
  var path    = '../media/' + file.name;
  var btnId   = isDwell ? ('sp_btn_'+t.key+'_dwell') : ('sp_btn_'+t.key);
  // Session C fix: use correct DEF naming convention (Clip_X_Ambient / Clip_X_Dwell)
  var clipId  = isDwell ? ('Clip_'+t.key+'_Dwell')  : ('Clip_'+t.key+'_Ambient');

  var btn = document.getElementById(btnId);
  if (btn) { btn.textContent = file.name; btn.classList.add('loaded'); }

  spSetClipUrl(clipId, path);
  console.log('Sound: ' + clipId + ' → ' + path);
  _spPickTarget = null;
}

function spClearFile(zoneKey, layer) {
  var isDwell = (layer === 'dwell');
  var btnId  = isDwell ? ('sp_btn_'+zoneKey+'_dwell') : ('sp_btn_'+zoneKey);
  // Session C fix: use correct DEF naming convention
  var clipId = isDwell ? ('Clip_'+zoneKey+'_Dwell')  : ('Clip_'+zoneKey+'_Ambient');
  var btn = document.getElementById(btnId);
  if (btn) { btn.textContent = 'Choose\u2026'; btn.classList.remove('loaded'); }
  spSetClipUrl(clipId, '');
}

function spSetVol(zoneKey, layer, rawVal) {
  var v       = parseFloat(rawVal);
  var isDwell = (layer === 'dwell');
  var valId   = isDwell ? ('sp_volval_'+zoneKey+'_dwell') : ('sp_volval_'+zoneKey);
  var el = document.getElementById(valId);
  if (el) el.textContent = Math.round(v * 100) + '%';
  // Session C fix: write gain directly to AudioClip node, not SoundFader SFFloat field
  var clipId = isDwell ? ('Clip_'+zoneKey+'_Dwell') : ('Clip_'+zoneKey+'_Ambient');
  try {
    var scene = canvas.browser.currentScene;
    if (!scene) return;
    var clip = scene.getNamedNode(clipId);
    if (clip) clip.gain = v;
  } catch(e) { /* clip may not exist — silent */ }
  // Also write to SoundFader for legacy compat if the node exists
  var field = isDwell ? ('vol_'+zoneKey+'_Dwell') : ('vol_'+zoneKey);
  spSetFader(field, v);
}

// Master volume and fade scalars — loader-side state, not SAI fields
var _spMasterVolume   = 1.0;
var _spFadeInDuration  = 1.5;
var _spFadeOutDuration = 2.5;

// Write control values to sound engine.
// 'masterVolume'    → Day 53: route through MCCFSoundMaster Script which fans to all
//                    SoundFader_<sid>.masterVolume via getField SAI. SoundFader clamps
//                    its ramp ceiling to masterVolume on next zone entry and immediately
//                    re-applies ceiling if currently ramped open.
//                    AudioDestination.gain is now always 1.0 (pass-through); the inner
//                    GainNode_<sid>_Ambient is the volume control point.
// 'fadeInDuration'  → store in _spFadeInDuration (used by SoundFader ramp — future)
// 'fadeOutDuration' → store in _spFadeOutDuration
// 'playing'         → send via getField/setValue to SoundFader Script (gate open/close)
// All other fields  → ignored (SoundFader Script only declares isActive + playing + masterVolume)
function spSetFader(field, value) {
  try {
    var scene = canvas.browser.currentScene;
    if (!scene) return;

    if (field === 'masterVolume') {
      _spMasterVolume = value;
      // Route through MCCFSoundMaster — single SAI call fans to every SoundFader.
      // MCCFSoundMaster.masterVolume() calls getField('masterVolume').setValue(v) on
      // each SoundFader_<sid>, which clamps the active ramp ceiling immediately.
      try {
        var sm = scene.getNamedNode('MCCFSoundMaster');
        if (sm) sm.getField('masterVolume').setValue(value);
      } catch(e) {}
      return;
    }

    if (field === 'fadeInDuration')  { _spFadeInDuration  = value; return; }
    if (field === 'fadeOutDuration') { _spFadeOutDuration = value; return; }

    // 'playing' and any other SoundFader Script fields — send via getField/setValue
    (_spZones || []).forEach(function(z) {
      try {
        var node = scene.getNamedNode('SoundFader_' + z.key);
        if (node) node.getField(field).setValue(value);
      } catch(e) {}
    });
  } catch(e) { /* silent */ }
}

// Session C: stop all known AudioClips (Music, Bed, all zone Ambients + Dwells)
function spStopAll() {
  try {
    var scene = canvas.browser.currentScene;
    if (!scene) return;
    var tNow = (canvas.browser.currentTime && canvas.browser.currentTime > 0)
      ? canvas.browser.currentTime : (performance.now() / 1000);

    // Gate closed — SoundFader Scripts ignore ProxSensor events until next Play.
    _spPlaybackLive = false;
    (_spZones || []).forEach(function(z) {
      try {
        var sf = scene.getNamedNode('SoundFader_' + z.key);
        if (sf) { try { sf.getField('playing').setValue(false); } catch(e2) {} }
      } catch(e) {}
    });
    // Global tracks
    ['Clip_Music', 'Clip_Bed'].forEach(function(id) {
      try { var n = scene.getNamedNode(id); if (n) n.stopTime = tNow; } catch(e) {}
    });
    // Re-disable Clip_Bed — X_ITE re-fires loop=true clips on AudioDestination re-init
    // if enabled is left true. This restores the load-time block for Stop/Reset cycles.
    try { var bClip = scene.getNamedNode('Clip_Bed'); if (bClip) bClip.enabled = false; } catch(e) {}
    // Zone clips
    _spZones.forEach(function(z) {
      ['Clip_'+z.key+'_Ambient', 'Clip_'+z.key+'_Dwell'].forEach(function(id) {
        try { var n = scene.getNamedNode(id); if (n) n.stopTime = tNow; } catch(e) {}
      });
    });
    console.log('[sound] spStopAll: stopped all clips at t=', tNow);
  } catch(e) { console.warn('spStopAll error:', e); }
}

// Day 47: Start Music + Bed on Play. Both clips are started via SAI so they
// fire together with animation on Play, not at scene load.
//
// REQUIRES: Composer must emit startTime="-1" stopTime="-2" on BOTH Clip_Music
// and Clip_Bed so AudioDestination does not auto-fire them at time=0.
// This function is the one and only place that starts global scene tracks.
// Called from pbPlay and pbPlayAll, never from _resumeAudioContext.
function spStartSceneTracks() {
  var musicTrack = window._spSceneMusicTrack;
  var bedTrack   = window._spSceneBedTrack;
  console.log('[sound] spStartSceneTracks: music=', !!musicTrack, 'bed=', !!bedTrack);
  try {
    var scene = canvas.browser.currentScene;
    if (!scene) return;
    var tNow = (canvas.browser.currentTime && canvas.browser.currentTime > 0)
      ? canvas.browser.currentTime : (performance.now() / 1000);

    // Gate open — tell all SoundFader Scripts that playback is now live.
    // This prevents ProximitySensor events before Play from triggering audio.
    _spPlaybackLive = true;
    (_spZones || []).forEach(function(z) {
      try {
        var sf = scene.getNamedNode('SoundFader_' + z.key);
        if (sf) { try { sf.getField('playing').setValue(true); console.log('[sound] gate open:', 'SoundFader_' + z.key); } catch(e2) { console.warn('[sound] gate open failed:', z.key, e2); } }
      } catch(e) {}
    });

    // Start Music clip via SAI — clears any prior stopTime guard first
    try {
      var mClip = scene.getNamedNode('Clip_Music');
      if (mClip) {
        mClip.stopTime  = tNow - 0.01;   // clear guard (startTime=-1 stopTime=-2 set by composer)
        mClip.startTime = tNow + 0.05;
        console.log('[sound] Clip_Music started via SAI at t=', tNow.toFixed(2),
                    'loop=', mClip.loop);
      } else {
        console.log('[sound] Clip_Music not found in scene');
      }
    } catch(e) { console.warn('[sound] Clip_Music start error:', e); }

    // Start Bed clip via SAI — enable first (X_ITE ignores startTime guard on loop=true
    // clips at AudioDestination init time; enabled=false in X3D is the reliable block).
    try {
      var bClip = scene.getNamedNode('Clip_Bed');
      if (bClip) {
        bClip.enabled   = true;           // lift the enabled=false load-time block
        bClip.stopTime  = tNow - 0.01;   // clear startTime=-1 stopTime=-2 guard
        bClip.startTime = tNow + 0.05;
        console.log('[sound] Clip_Bed started via SAI at t=', tNow.toFixed(2),
                    'loop=', bClip.loop);
      } else {
        console.log('[sound] Clip_Bed not found in scene');
      }
    } catch(e) { console.warn('[sound] Clip_Bed start error:', e); }

    // Day 87: real fix — this was a single one-shot lookup, no retry at
    // all, unlike the proven-working avatar-timer imports elsewhere in
    // this file (which retry several times, 200ms apart, exactly because
    // an Inline'd file isn't guaranteed to have finished loading and
    // resolving its IMPORT the instant Play is clicked). Confirmed via
    // Sunrize: the file parses cleanly and the MovieTexture itself loads
    // fine — "TheSceneMovie not found" is much more likely this Inline
    // (a 33MB video) still loading at the exact moment Play fires than
    // any remaining syntax problem. Retrying up to 10x/200ms gives it
    // real time to finish without silently failing if it's just slow.
    (function tryStartMovie(attempt) {
      attempt = attempt || 1;
      var movieNode;
      // Day 87: real fix — every other IMPORT resolution in this file
      // (camera viewpoints, orbit/track protos, behavior clips) uses
      // getImportedNode(), never plain getNamedNode(), for a name
      // introduced via IMPORT. This was the one place that only ever
      // tried getNamedNode(), which explains "not found after retries"
      // even with a correct <IMPORT>/<EXPORT> pair and no timing issue
      // at all — retrying the wrong lookup just retries the wrong thing.
      try { movieNode = scene.getImportedNode('TheSceneMovie'); } catch(ie) {}
      if (!movieNode) { try { movieNode = scene.getNamedNode('TheSceneMovie'); } catch(ne) {} }
      if (movieNode) {
        var tNow2 = (canvas.browser.currentTime && canvas.browser.currentTime > 0)
          ? canvas.browser.currentTime : (performance.now() / 1000);
        movieNode.stopTime  = tNow2 - 0.01;
        movieNode.startTime = tNow2 + 0.05;
        console.log('[movie] TheSceneMovie started via SAI at t=', tNow2.toFixed(2),
                    attempt > 1 ? '(attempt ' + attempt + ')' : '');
        return;
      }
      if (attempt < 10) {
        setTimeout(function() { tryStartMovie(attempt + 1); }, 200);
      } else {
        console.log('[movie] TheSceneMovie not found after retries — no asset in this scene is marked "drives movie playback", or its Inline never finished loading');
      }
    })();

  } catch(e) { console.warn('spStartSceneTracks error:', e); }
}

// Session C: stop a single named track (Music or Bed)
function spStopTrack(trackName) {
  try {
    var scene = canvas.browser.currentScene;
    if (!scene) return;
    var tNow = (canvas.browser.currentTime && canvas.browser.currentTime > 0)
      ? canvas.browser.currentTime : (performance.now() / 1000);
    var clip = scene.getNamedNode('Clip_' + trackName);
    if (clip) clip.stopTime = tNow;
    console.log('[sound] spStopTrack:', trackName);
  } catch(e) { console.warn('spStopTrack error:', e); }
}

// Write url to AudioClip node via SAI
function spSetClipUrl(clipNodeId, urlStr) {
  try {
    var scene = canvas.browser.currentScene;
    if (!scene) return;
    var node = scene.getNamedNode(clipNodeId);
    if (node) {
      node.url = urlStr ? [urlStr] : [];
      if (urlStr) {
        // Clear any prior stopTime that would block playback, then set startTime
        try { node.stopTime  = -1; } catch(e) {}
        try { node.startTime = canvas.browser.currentTime || (performance.now()/1000); } catch(e) {}
      } else {
        // Empty url — stop immediately
        try { node.stopTime = canvas.browser.currentTime || (performance.now()/1000); } catch(e) {}
      }
    }
  } catch(e) { console.warn('spSetClipUrl:', clipNodeId, e.message); }
}

// Push all current panel values to SoundFader — call after scene reload
function spPushAll() {
  spSetFader('masterVolume',    parseFloat((document.getElementById('sp_master') ||{}).value || 1.0));
  spSetFader('fadeInDuration',  parseFloat((document.getElementById('sp_fadein') ||{}).value || 1.5));
  spSetFader('fadeOutDuration', parseFloat((document.getElementById('sp_fadeout')||{}).value || 2.5));
  _spZones.forEach(function(z) {
    var av = parseFloat((document.getElementById('sp_vol_'+z.key)            ||{}).value || 0.8);
    var dv = parseFloat((document.getElementById('sp_vol_'+z.key+'_dwell')   ||{}).value || 0.9);
    spSetFader('vol_'+z.key, av);
    spSetFader('vol_'+z.key+'_Dwell', dv);
  });
}

// ── AudioContext resume ───────────────────────────────────────────────────
// Chrome/Edge block AudioContext until a user gesture. X_ITE creates its
// AudioContext internally — we just need to resume it on the first click.
//
// PLAY IS PERFORMANCE: _resumeAudioContext only unlocks the AudioContext.
// It does NOT start Music or Bed. Tracks start only from pbPlay/pbPlayAll.
// ── AudioContext resume ───────────────────────────────────────────────────
function _resumeAudioContext() {
  function _doResume() {
    var contexts = [];
    // Path 1: X_ITE official API (11.x)
    try { var c = canvas.browser.getAudioContext(); if(c) contexts.push(c); } catch(e) {}
    // Path 2: internal sound engine
    try { var c2 = canvas.browser._soundEngine && canvas.browser._soundEngine.context; if(c2) contexts.push(c2); } catch(e) {}
    // Path 3: scan browser object properties for AudioContext instances
    try {
      Object.values(canvas.browser).forEach(function(v) {
        try { if(v && v.constructor && v.constructor.name === 'AudioContext' && contexts.indexOf(v)<0) contexts.push(v); } catch(e) {}
      });
    } catch(e) {}

    var acted = false;
    contexts.forEach(function(ctx) {
      if(!ctx) return;
      if(ctx.state === 'suspended') {
        ctx.resume().then(function() {
          console.log('[audio] AudioContext unlocked — state:', ctx.state, '— awaiting Play button');
        }).catch(function(e){ console.warn('[audio] resume failed:', e); });
        acted = true;
      } else {
        console.log('[audio] AudioContext already running — state:', ctx.state, '— awaiting Play button');
        acted = true;
      }
    });

    if(!acted) {
      // No X_ITE context found — unlock with silent buffer then retry
      console.log('[audio] No X_ITE AudioContext found — unlocking and retrying');
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if(AC) {
          var unlock = new AC();
          var buf = unlock.createBuffer(1,1,22050);
          var s = unlock.createBufferSource();
          s.buffer = buf; s.connect(unlock.destination); s.start(0);
          setTimeout(function(){ unlock.close(); }, 100);
        }
      } catch(e) {}
      // Retry after 300ms — X_ITE may now allow context creation
      setTimeout(function() {
        try {
          var ctx3 = canvas.browser.getAudioContext();
          if(ctx3) {
            ctx3.resume().then(function(){
              console.log('[audio] AudioContext unlocked on retry — state:', ctx3.state, '— awaiting Play button');
            });
          } else {
            console.log('[audio] still no context after retry — awaiting Play button');
          }
        } catch(e) { console.warn('[audio] AudioContext retry error:', e); }
      }, 300);
    }

    document.removeEventListener('click',   _doResume);
    document.removeEventListener('keydown', _doResume);
    console.log('[audio] gesture handler complete — contexts found:', contexts.length);
  }
  document.addEventListener('click',   _doResume, { once: true });
  document.addEventListener('keydown', _doResume, { once: true });
  console.log('[audio] Waiting for user gesture to unlock AudioContext...');
}

// ── Avatar zone detection ─────────────────────────────────────────────────
// ProximitySensors detect the viewer camera, not avatars.
// This watcher reads avatar world positions from the interpolators each frame
// and fires SoundFader.prox_* when an avatar enters or exits a zone radius.
//
// Zone table: populated from _spZones + scene geometry at spInit() time.
// Each entry: { key, cx, cz, radius }
// Avatar positions: polled from Avatar_* node translations at ZONE_POLL_MS.

var _spZoneTable   = [];   // [{key, cx, cz, radius}]
var _spAvatarZones = {};   // {avatarSafeName: {zoneKey: bool}} — current in/out state
var _spZonePollId  = null;
var ZONE_POLL_MS   = 150;

// Hard-coded zone geometry matching garden_002.x3d
// Scene Composer should write these into cultivar/scene XML eventually.
var _SP_ZONE_GEOMETRY = {
  'Garden':        { cx: 13.078, cz:  8.511, radius: 5.0 },
  'Village_Plaza': { cx: 26.800, cz: 25.067, radius: 4.0 },
  'pool':          { cx: 30.000, cz:  7.000, radius: 4.0 }
};

function spBuildZoneTable() {
  _spZoneTable = [];
  _spZones.forEach(function(z) {
    // Prefer dynamically-built geometry from scene XML (spBuildZoneGeometryFromXml)
    // Fall back to legacy hardcoded table (garden_002 etc.)
    var g = _SP_ZONE_GEOMETRY[z.key];
    if (g) {
      _spZoneTable.push({ key: z.key, cx: g.cx, cz: g.cz, radius: g.radius });
    } else {
      console.warn('spBuildZoneTable: no geometry for zone', z.key, '— will be added when scene XML loads');
    }
  });
  console.log('spBuildZoneTable: built', _spZoneTable.length, 'of', _spZones.length, 'zones');
}

function spStartZonePoll() {
  if(_spZonePollId) clearInterval(_spZonePollId);
  _spZonePollId = setInterval(spPollAvatarZones, ZONE_POLL_MS);
}

function spStopZonePoll() {
  if(_spZonePollId) { clearInterval(_spZonePollId); _spZonePollId = null; }
}

function spPollAvatarZones() {
  if(!_spZoneTable.length) return;
  try {
    var scene = canvas.browser.currentScene;
    if(!scene) return;
    var avatarNames = window._avatarNodeNames || [];
    if(!avatarNames.length) return;
    avatarNames.forEach(function(nodeName) {
      var safeName = nodeName.replace(/^Avatar_/, '');
      try {
        var ax = null, az = null;
        // Primary: read translation directly from Avatar Transform node
        try {
          var node = scene.getNamedNode(nodeName);
          if(node && node.translation) {
            ax = node.translation.x;
            az = node.translation.z;
          }
        } catch(e) {}
        // Fallback: read from PositionInterpolator value_changed output
        if(ax === null) {
          try {
            var interp = scene.getNamedNode('Interp_' + safeName + '_1');
            if(interp && interp.value_changed) {
              ax = interp.value_changed.x;
              az = interp.value_changed.z;
            }
          } catch(e) {}
        }
        if(ax === null) return;
        if(!_spAvatarZones[safeName]) _spAvatarZones[safeName] = {};
        _spZoneTable.forEach(function(zone) {
          var dx = ax - zone.cx, dz = az - zone.cz;
          var inside = (Math.sqrt(dx*dx + dz*dz) <= zone.radius);
          var wasInside = !!_spAvatarZones[safeName][zone.key];
          if(inside !== wasInside) {
            _spAvatarZones[safeName][zone.key] = inside;
            spTriggerZone(zone.key, inside);
          }
        });
      } catch(e) {}
    });
  } catch(e) {}
}

// Called when any avatar crosses a zone boundary.
// Gated by _spPlaybackLive — zone audio only fires after Play, not on scene load
// or camera/Viewpoint binding (which fires ProximitySensors before performance starts).
var _spPlaybackLive = false;   // set true by spStartSceneTracks, false by spStopAll

function spTriggerZone(zoneKey, entering) {
  if (!_spPlaybackLive) {
    console.log('spTriggerZone: GATED (not playing) —', zoneKey, entering ? 'ENTER' : 'EXIT');
    return;
  }
  spSetFader('prox_' + zoneKey, entering ? 1.0 : 0.0);
  console.log('spTriggerZone:', zoneKey, entering ? 'ENTER' : 'EXIT');
}

// Trigger a dwell sound event for a zone from the loader
// Call this when a Dwell timer fires for an agent at a known zone.
function spTriggerDwell(zoneKey) {
  spSetFader('dwell_' + zoneKey, 1.0);
  // Brief pulse — SoundFader only acts on true
  setTimeout(function() { spSetFader('dwell_' + zoneKey, 0.0); }, 200);
}

</script>
