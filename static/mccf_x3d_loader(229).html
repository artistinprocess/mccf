// Execute an agent-orbit shot: BAKED path, parented under the avatar's own Transform.
//
// Architecture (Day 64): CAM_OrbitProto_{name} is a single AgentOrbitCamera ProtoInstance
// the Composer emits inside every Avatar_{name} Transform (see mccf_camera_protos.x3d for
// the ProtoBody — the Transform/Viewpoint/TimeSensor/2x Interpolator and their ROUTEs that
// used to be five separate top-level DEFs here now live inside the proto, wired statically).
// Because the ProtoInstance is a child of the avatar, the avatar's own world motion is
// automatic — this function only ever computes a RELATIVE offset around local origin
// [0,0,0], never the avatar's world position. There is no tracking math, no polling of the
// avatar's current position, because none is needed: parenting handles it for free. This
// function talks only to the ProtoInstance's exposed interface, never to its internals —
// the Day 63 SAI-into-proto test confirmed those internals are unreachable from outside.
//
// This is architecturally distinct from the free/world-space 'orbit' move shot
// (_executeMoveShot), which circles a fixed world point computed once at cue-fire time
// and does NOT follow a moving subject. agent_orbit follows the subject indefinitely,
// including movement that happens mid-orbit, because the Transform hierarchy carries it.
function _executeAgentOrbit(cue) {
  var subjectSafe = (cue.subject || '').replace(/[^A-Za-z0-9_]/g, '_');
  if (!subjectSafe) {
    console.warn('[EventCues] camera: agent_orbit — cue has no subject, skipped');
    return;
  }

  var radius   = (cue.distance !== null && cue.distance !== undefined) ? parseFloat(cue.distance) : 5;
  var height   = (cue.height   !== null && cue.height   !== undefined) ? parseFloat(cue.height)   : 1.7;
  var hAngle   = (cue.hAngle   !== null && cue.hAngle   !== undefined) ? parseFloat(cue.hAngle)   : 0;
  var vAngle   = (cue.vAngle   !== null && cue.vAngle   !== undefined) ? parseFloat(cue.vAngle)   : -8;
  var duration = (cue.dur      !== null && cue.dur      !== undefined) ? parseFloat(cue.dur)      : 4;
  var doLoop   = (cue.loop === true || cue.loop === 'true');

  var STEPS = 36;
  var keys = [];
  var posKeys = [];
  var oriKeys = [];
  var subjectPos = [0, 0, 0]; // local origin — avatar Transform IS the world position

  for (var i = 0; i <= STEPS; i++) {
    var frac = i / STEPS;
    var theta = (hAngle + frac * 360) * Math.PI / 180;
    var cx = radius * Math.sin(theta);
    var cy = height;
    var cz = radius * Math.cos(theta);
    var orient = _lookAtOrientation([cx, cy, cz], subjectPos, vAngle);
    keys.push(frac);
    posKeys.push(cx, cy, cz);
    oriKeys.push(orient[0], orient[1], orient[2], orient[3]);
  }

  // Day 64: the four internal vessel nodes (Transform/Viewpoint/TimeSensor/2x Interpolator)
  // and their four ROUTEs are gone from view — they now live inside AgentOrbitCamera's
  // ProtoBody (mccf_camera_protos.x3d), wired with static IS connections and static
  // ROUTEs baked in at proto-declare time. This function talks to exactly one node —
  // the ProtoInstance itself, DEF'd CAM_OrbitProto_{subject} by the Composer — through
  // its exposed interface. No addRoute calls needed anymore: routing is structural, not
  // runtime-assembled, so there's nothing left for this function to wire.
  var attempts = 0;
  function trySet() {
    attempts++;
    try {
      var scene = canvas.browser.currentScene;
      var orbitProto = null;
      // Day 77: CAM_OrbitProto_{subject} now lives inside the avatar's own Inline
      // scope (Character-Creator-authored rig), same reasoning and same fallback
      // order as _bindNamedViewpoint's update above.
      try { orbitProto = scene.getImportedNode('CAM_OrbitProto_' + subjectSafe); } catch(ie) {}
      if (!orbitProto) { try { orbitProto = scene.getNamedNode('CAM_OrbitProto_' + subjectSafe); } catch(ne) {} }

      if (orbitProto) {
        // Day 85: stale-retry guard — see _cameraCueFireSeq's declaration comment.
        if (cue._fireSeq !== undefined && cue._fireSeq !== _cameraCueFireSeq) {
          console.log('[EventCues] camera: stale agent_orbit bind skipped — a newer camera cue has fired since');
          return;
        }

        var keyField      = orbitProto.getField('key');
        var keyValueField = orbitProto.getField('keyValue');
        var oriValueField = orbitProto.getField('oriKeyValue');
        keyField.length      = 0;
        keyValueField.length = 0;
        oriValueField.length = 0;
        for (var ki = 0; ki <= STEPS; ki++) {
          keyField[ki]      = keys[ki];
          keyValueField[ki] = new X3D.SFVec3f(posKeys[ki*3], posKeys[ki*3+1], posKeys[ki*3+2]);
          oriValueField[ki] = new X3D.SFRotation(oriKeys[ki*4], oriKeys[ki*4+1], oriKeys[ki*4+2], oriKeys[ki*4+3]);
        }

        orbitProto.cycleInterval = duration;
        orbitProto.loop          = doLoop;

        // Day 77: was .getField('initialTranslation').setValue(...) — the exact SAI
        // pattern Camera Spec v1.3 §4 already proved unreliable, and the same fix
        // applied everywhere else this session. Every OTHER field in this function
        // already used direct assignment (cycleInterval, loop, the keyValue/
        // oriKeyValue array writes above) — only these two were left on the old
        // pattern, likely explaining "camera moves slightly but never reaches its
        // first position": set_bind would still correctly switch which viewpoint is
        // bound, but the starting pose could silently fail to register, leaving the
        // camera at a stale position until the keyframe animation gradually moved it.
        orbitProto.initialTranslation = new X3D.SFVec3f(posKeys[0], posKeys[1], posKeys[2]);
        orbitProto.initialRotation    = new X3D.SFRotation(oriKeys[0], oriKeys[1], oriKeys[2], oriKeys[3]);

        requestAnimationFrame(function() {
          orbitProto.set_bind = true;
          requestAnimationFrame(function() {
            var _t0 = (canvas.browser.currentTime && canvas.browser.currentTime > 0)
              ? canvas.browser.currentTime : (performance.now() / 1000);
            orbitProto.startTime = _t0;
            orbitProto.enabled   = true;
            console.log('[EventCues] camera: agent_orbit started — subject=' + subjectSafe
              + ' radius=' + radius + ' height=' + height + ' hAngle=' + hAngle
              + ' dur=' + duration + ' loop=' + doLoop);
          });
        });
        return;
      }

      console.warn('[EventCues] camera: agent_orbit — missing proto instance CAM_OrbitProto_'
        + subjectSafe + ' — re-export scene from Composer');

    } catch(e) { console.warn('[EventCues] camera: agent_orbit trySet exception:', e.message); }
    if (attempts < 10) setTimeout(trySet, 200);
    else console.warn('[EventCues] camera: agent_orbit — proto instance not found after retries');
  }
  trySet();
}

// Execute an agent-track shot: BAKED path, parented under the avatar's own Transform.
// Day 64: CAM_TrackProto_{name} is a single AgentTrackCamera ProtoInstance the Composer
// emits inside every Avatar_{name} Transform — same mechanism as AgentOrbitCamera, see
// mccf_camera_protos.x3d for the ProtoBody.
//
// Built agent-attached from the start, not converted after the fact from a free-camera
// version — Day 63 decision, following the "parenting beats tracking" principle and the
// orbit→agent_orbit precedent it's named for.
//
// Unlike orbit's circular sweep, track's keyframes are a linear local-space lerp:
//   x (lateral) = lerp(trackOffset, trackOffsetEnd, frac)  — local X, signed, perpendicular
//                                                             to the avatar's forward axis
//   y (height)  = constant (cue.height)
//   z (depth)   = constant (cue.trackDepth) — standoff distance behind/in front of the avatar
// All relative to local origin [0,0,0] (the avatar's own position) — never the avatar's
// world position. No tracking math, no polling, because parenting handles it for free.
//
// Per spec §3, loop applies ONLY to orbit/agent_orbit — agent_track always plays once
// and holds its last frame (TimeSensor loop=false), regardless of cue.loop.
function _executeAgentTrack(cue) {
  var subjectSafe = (cue.subject || '').replace(/[^A-Za-z0-9_]/g, '_');
  if (!subjectSafe) {
    console.warn('[EventCues] camera: agent_track — cue has no subject, skipped');
    return;
  }

  var off0    = (cue.trackOffset    !== null && cue.trackOffset    !== undefined) ? parseFloat(cue.trackOffset)    : -3;
  var off1    = (cue.trackOffsetEnd !== null && cue.trackOffsetEnd !== undefined) ? parseFloat(cue.trackOffsetEnd) : 3;
  var height  = (cue.height         !== null && cue.height         !== undefined) ? parseFloat(cue.height)         : 1.7;
  var depth   = (cue.trackDepth     !== null && cue.trackDepth     !== undefined) ? parseFloat(cue.trackDepth)     : 4;
  var vAngle  = (cue.vAngle         !== null && cue.vAngle         !== undefined) ? parseFloat(cue.vAngle)         : -8;
  var duration= (cue.dur            !== null && cue.dur            !== undefined) ? parseFloat(cue.dur)            : 4;
  // loop is orbit/agent_orbit-only per spec §3 — agent_track always plays once.
  var doLoop  = false;

  var STEPS = 36;
  var keys = [];
  var posKeys = [];
  var oriKeys = [];
  var localOrigin = [0, 0, 0]; // local origin — avatar Transform IS the world position

  for (var i = 0; i <= STEPS; i++) {
    var frac = i / STEPS;
    var cx = off0 + (off1 - off0) * frac;
    var cy = height;
    var cz = depth;
    var orient = _lookAtOrientation([cx, cy, cz], localOrigin, vAngle);
    keys.push(frac);
    posKeys.push(cx, cy, cz);
    oriKeys.push(orient[0], orient[1], orient[2], orient[3]);
  }

  // Day 64: converted to the same AgentTrackCamera proto pattern as agent_orbit — one
  // ProtoInstance (CAM_TrackProto_{subject}) replaces the five internal vessel DEFs this
  // function used to reach individually. No addRoute calls needed: routing is static
  // inside the ProtoBody now, not runtime-assembled.
  var attempts = 0;
  function trySet() {
    attempts++;
    try {
      var scene = canvas.browser.currentScene;
      var trackProto = null;
      // Day 77: CAM_TrackProto_{subject} now lives inside the avatar's own Inline
      // scope — same fix as _executeAgentOrbit above.
      try { trackProto = scene.getImportedNode('CAM_TrackProto_' + subjectSafe); } catch(ie) {}
      if (!trackProto) { try { trackProto = scene.getNamedNode('CAM_TrackProto_' + subjectSafe); } catch(ne) {} }

      if (trackProto) {

        // Day 85: stale-retry guard — see _cameraCueFireSeq's declaration comment.
        if (cue._fireSeq !== undefined && cue._fireSeq !== _cameraCueFireSeq) {
          console.log('[EventCues] camera: stale agent_track bind skipped — a newer camera cue has fired since');
          return;
        }

        var keyField      = trackProto.getField('key');
        var keyValueField = trackProto.getField('keyValue');
        var oriValueField = trackProto.getField('oriKeyValue');
        keyField.length      = 0;
        keyValueField.length = 0;
        oriValueField.length = 0;
        for (var ki = 0; ki <= STEPS; ki++) {
          keyField[ki]      = keys[ki];
          keyValueField[ki] = new X3D.SFVec3f(posKeys[ki*3], posKeys[ki*3+1], posKeys[ki*3+2]);
          oriValueField[ki] = new X3D.SFRotation(oriKeys[ki*4], oriKeys[ki*4+1], oriKeys[ki*4+2], oriKeys[ki*4+3]);
        }

        trackProto.cycleInterval = duration;
        trackProto.loop          = doLoop;

        // Day 77: same fix as agent_orbit's equivalent lines above — was
        // .getField('initialTranslation').setValue(...), the unreliable pattern.
        trackProto.initialTranslation = new X3D.SFVec3f(posKeys[0], posKeys[1], posKeys[2]);
        trackProto.initialRotation    = new X3D.SFRotation(oriKeys[0], oriKeys[1], oriKeys[2], oriKeys[3]);

        requestAnimationFrame(function() {
          trackProto.set_bind = true;
          requestAnimationFrame(function() {
            var _t0 = (canvas.browser.currentTime && canvas.browser.currentTime > 0)
              ? canvas.browser.currentTime : (performance.now() / 1000);
            trackProto.startTime = _t0;
            trackProto.enabled   = true;
            console.log('[EventCues] camera: agent_track started — subject=' + subjectSafe
              + ' offset=' + off0 + '→' + off1 + ' depth=' + depth + ' height=' + height
              + ' dur=' + duration);
          });
        });
        return;
      }

      console.warn('[EventCues] camera: agent_track — missing proto instance CAM_TrackProto_'
        + subjectSafe + ' — re-export scene from Composer');

    } catch(e) { console.warn('[EventCues] camera: agent_track trySet exception:', e.message); }
    if (attempts < 10) setTimeout(trySet, 200);
    else console.warn('[EventCues] camera: agent_track — proto instance not found after retries');
  }
  trySet();
}

// Compute orbit keyframes — full 360° sweep around a fixed world point.
// Extracted Day 63 from _executeMoveShot so keyframe math and SAI-writing are
// independent; the writing logic below is now shared by every move shot type.
//
// Orbit geometry — X3D right-handed coordinate system:
//   +X right, +Y up, +Z toward viewer, -Z into scene (default camera direction).
//   hAngle is measured from +Z axis, positive = counterclockwise viewed from above (right-hand +Y).
//   camPos: x = subjectX + radius*sin(θ),  z = subjectZ + radius*cos(θ)
//   Look-at yaw: atan2(-dx, -dz)  — negation because camera faces -Z by default.
function _computeOrbitMoveKeyframes(subjectPos, cue, steps) {
  var radius = (cue.distance !== null && cue.distance !== undefined) ? parseFloat(cue.distance) : 5;
  var height = (cue.height   !== null && cue.height   !== undefined) ? parseFloat(cue.height)   : 1.7;
  var hAngle = (cue.hAngle   !== null && cue.hAngle   !== undefined) ? parseFloat(cue.hAngle)   : 0;
  var vAngle = (cue.vAngle   !== null && cue.vAngle   !== undefined) ? parseFloat(cue.vAngle)   : -8;

  var keys = [], posKeys = [], oriKeys = [];
  for (var i = 0; i <= steps; i++) {
    var frac = i / steps;
    var theta = (hAngle + frac * 360) * Math.PI / 180;
    var cx = subjectPos[0] + radius * Math.sin(theta);
    var cy = subjectPos[1] + height;
    var cz = subjectPos[2] + radius * Math.cos(theta);
    var orient = _lookAtOrientation([cx, cy, cz], subjectPos, vAngle);
    keys.push(frac);
    posKeys.push(cx, cy, cz);
    oriKeys.push(orient[0], orient[1], orient[2], orient[3]);
  }
  return { keys: keys, posKeys: posKeys, oriKeys: oriKeys };
}

// Compute keyframes for the linear/parametric move shots: dolly_in, dolly_out,
// pan, tilt, crane_up. Lerps distance/height/hAngle/vAngle from their cue start
// values to their *End counterparts across `steps` samples, then runs each sample
// through the same _computeCamPosition/_lookAtOrientation math the static shots use.
//
// crane_up adds one more term: arcDepth, a sinusoidal bulge added to height that is
// zero at the start and end of the move and peaks at the midpoint (sin(π·frac)) —
// this is the "arc upward and back" shape spec §2 describes, layered on top of the
// plain start→end height lerp rather than replacing it. Every other linear shot
// simply has arcDepth=0 (the default when the field is absent), so this is a no-op
// for dolly/pan/tilt — one function correctly covers all five shots.
//
// Multiple steps matter even though this is conceptually "linear interpolation":
// pan/tilt change hAngle, which means the camera traces an ARC around the subject,
// not a straight line in world space — PositionInterpolator only lerps linearly
// between its keys, so a naive 2-keyframe version would cut the corner on any shot
// that isn't a pure radial dolly. Sampling the same way orbit does keeps one function
// correct for every case, including a cue that varies more than one parameter at once.
function _computeParametricMoveKeyframes(subjectPos, cue, steps) {
  var dist0 = (cue.distance    !== null && cue.distance    !== undefined) ? parseFloat(cue.distance)    : 5;
  var dist1 = (cue.distanceEnd !== null && cue.distanceEnd !== undefined) ? parseFloat(cue.distanceEnd) : dist0;
  var ht0   = (cue.height      !== null && cue.height      !== undefined) ? parseFloat(cue.height)      : 1.7;
  var ht1   = (cue.heightEnd   !== null && cue.heightEnd   !== undefined) ? parseFloat(cue.heightEnd)   : ht0;
  var hA0   = (cue.hAngle      !== null && cue.hAngle      !== undefined) ? parseFloat(cue.hAngle)      : 0;
  var hA1   = (cue.hAngleEnd   !== null && cue.hAngleEnd   !== undefined) ? parseFloat(cue.hAngleEnd)   : hA0;
  var vA0   = (cue.vAngle      !== null && cue.vAngle      !== undefined) ? parseFloat(cue.vAngle)      : -8;
  var vA1   = (cue.vAngleEnd   !== null && cue.vAngleEnd   !== undefined) ? parseFloat(cue.vAngleEnd)   : vA0;
  var arcDepth = (cue.arcDepth !== null && cue.arcDepth !== undefined) ? parseFloat(cue.arcDepth) : 0;

  var keys = [], posKeys = [], oriKeys = [];
  for (var i = 0; i <= steps; i++) {
    var frac = i / steps;
    var dist = dist0 + (dist1 - dist0) * frac;
    var ht   = ht0   + (ht1   - ht0)   * frac + arcDepth * Math.sin(Math.PI * frac);
    var hA   = hA0   + (hA1   - hA0)   * frac;
    var vA   = vA0   + (vA1   - vA0)   * frac;

    var camPos = _computeCamPosition(subjectPos, dist, ht, hA);
    var orient = _lookAtOrientation(camPos, subjectPos, vA);

    keys.push(frac);
    posKeys.push(camPos[0], camPos[1], camPos[2]);
    oriKeys.push(orient[0], orient[1], orient[2], orient[3]);
  }
  return { keys: keys, posKeys: posKeys, oriKeys: oriKeys };
}

// Execute a move shot: compute keyframes, write to interpolator vessels via SAI, start CAM_Timer.
//
// Architecture: CAM_Timer, CAM_PosInterp, CAM_OriInterp are static vessel nodes emitted by the
// Composer into every exported scene. Static ROUTEs wire them:
//   CAM_Timer.fraction_changed → CAM_PosInterp.set_fraction  → CAM_Free_Transform.set_translation
//   CAM_Timer.fraction_changed → CAM_OriInterp.set_fraction  → CAM_Free_Transform.set_rotation
// The Loader only writes key/keyValue (writable [in,out] fields) and controls the TimeSensor.
//
// Implemented: orbit (full 360° sweep, fixed world point — Day 62) and the five linear
// shots dolly_in / dolly_out / pan / tilt / crane_up (start→end lerp, +arcDepth bulge
// for crane_up — Day 63). track remains unimplemented — see _LINEAR_MOVE_SHOTS comment
// above for why it's held rather than built as a free-camera approximation.
//
// Per spec §3 Cue Data Schema: `loop` applies ONLY to orbit (and agent_orbit, handled
// separately in _executeAgentOrbit). Every other move shot ignores cue.loop and always
// plays once, holding its last frame — TimeSensor loop=false gives this for free, since
// fraction_changed simply stops firing after cycleInterval and the interpolator's last
// written value stays in place on CAM_Free_Transform.
function _executeMoveShot(cue) {
  var shot = cue.shot;
  var isOrbit  = (shot === 'orbit');
  var isLinear = !!_LINEAR_MOVE_SHOTS[shot];

  if (!isOrbit && !isLinear) {
    console.warn('[EventCues] camera: move shot «' + shot + '» not yet implemented');
    return;
  }

  var subjectPos = _resolveSubjectPos(cue.subject) || [0, 0, 0];
  var duration = (cue.dur !== null && cue.dur !== undefined) ? parseFloat(cue.dur) : 4;
  // loop is orbit-only per spec §3 — every other move shot plays once and holds last frame.
  var doLoop   = isOrbit && (cue.loop === true || cue.loop === 'true');

  // 36 steps = one keyframe every ~3% of the move. Matches the orbit convention
  // (one every 10° there) and is smooth enough for arcs (pan/tilt) as well as
  // straight lines (dolly).
  var STEPS = 36;
  var kf = isOrbit
    ? _computeOrbitMoveKeyframes(subjectPos, cue, STEPS)
    : _computeParametricMoveKeyframes(subjectPos, cue, STEPS);
  var keys = kf.keys, posKeys = kf.posKeys, oriKeys = kf.oriKeys;

  var attempts = 0;
  function trySet() {
    attempts++;
    try {
      var scene = canvas.browser.currentScene;
      var camXform  = scene.getNamedNode('CAM_Free_Transform');
      var vpFree    = scene.getNamedNode('VP_Free');
      var camTimer  = scene.getNamedNode('CAM_Timer');
      var posInterp = scene.getNamedNode('CAM_PosInterp');
      var oriInterp = scene.getNamedNode('CAM_OriInterp');

      if (camXform && vpFree && camTimer && posInterp && oriInterp) {

        // Day 85: stale-retry guard — see _cameraCueFireSeq's declaration comment.
        if (cue._fireSeq !== undefined && cue._fireSeq !== _cameraCueFireSeq) {
          console.log('[EventCues] camera: stale move-shot bind skipped — a newer camera cue has fired since');
          return;
        }

        // Write keyframes to interpolators using indexed MF array assignment.
        // Confirmed pattern from official X_ITE README (createNode/keyframe example):
        //   interpolator.key[i] = ...;  interpolator.keyValue[i] = new X3D.SFVec3f(...);
        // NOT a bulk MFFloat/MFVec3f constructor call — that API does not exist in X_ITE.
        // Truncate any stale authored placeholder values before repopulating.
        posInterp.key.length      = 0;
        posInterp.keyValue.length = 0;
        oriInterp.key.length      = 0;
        oriInterp.keyValue.length = 0;
        for (var ki = 0; ki <= STEPS; ki++) {
          posInterp.key[ki]      = keys[ki];
          posInterp.keyValue[ki] = new X3D.SFVec3f(posKeys[ki*3], posKeys[ki*3+1], posKeys[ki*3+2]);
          oriInterp.key[ki]      = keys[ki];
          oriInterp.keyValue[ki] = new X3D.SFRotation(oriKeys[ki*4], oriKeys[ki*4+1], oriKeys[ki*4+2], oriKeys[ki*4+3]);
        }

        // DIAGNOSTIC — confirm the interpolator nodes actually hold the keyframes we just wrote.
        console.log('[EventCues] camera: ' + shot + ' keyframe check — posInterp.key.length=' + posInterp.key.length
          + ' posInterp.keyValue.length=' + posInterp.keyValue.length
          + ' oriInterp.key.length=' + oriInterp.key.length
          + ' oriInterp.keyValue.length=' + oriInterp.keyValue.length);
        console.log('[EventCues] camera: ' + shot + ' keyframe[0]=', posInterp.keyValue[0] && posInterp.keyValue[0].toString());
        console.log('[EventCues] camera: ' + shot + ' keyframe[last]=', posInterp.keyValue[STEPS] && posInterp.keyValue[STEPS].toString());

        // Belt-and-suspenders — add the ROUTEs via SAI as well as relying on the static XML
        // ROUTEs from the Composer export. Browser.addRoute is idempotent-safe to call even
        // if the route already exists from the X3D file; confirms the chain at runtime.
        try {
          canvas.browser.addRoute(camTimer,  'fraction_changed', posInterp, 'set_fraction');
          canvas.browser.addRoute(camTimer,  'fraction_changed', oriInterp, 'set_fraction');
          canvas.browser.addRoute(posInterp, 'value_changed',    camXform,  'set_translation');
          canvas.browser.addRoute(oriInterp, 'value_changed',    camXform,  'set_rotation');
          console.log('[EventCues] camera: ' + shot + ' ROUTEs added via SAI (belt-and-suspenders)');
        } catch(e) { console.warn('[EventCues] camera: addRoute via SAI failed:', e.message); }

        // Configure timer — direct property assignment throughout (confirmed working pattern).
        camTimer.cycleInterval = duration;
        camTimer.loop          = doLoop;

        // Snap camera to move start position then bind VP_Free (TELEPORT, instantaneous).
        // This is intentional — the authored start values are where the shot begins.
        // Day 77: was .getField('translation'/'rotation').setValue(...) — the exact
        // unreliable pattern the comment above this block already claimed had been
        // replaced everywhere in this function. These two lines were simply missed.
        camXform.translation = new X3D.SFVec3f(posKeys[0], posKeys[1], posKeys[2]);
        camXform.rotation    = new X3D.SFRotation(oriKeys[0], oriKeys[1], oriKeys[2], oriKeys[3]);

        requestAnimationFrame(function() {
          vpFree.set_bind = true;
          // Start timer one rAF after bind so VP_Free is active before interpolators fire.
          // Use direct property assignment — confirmed working pattern from walk/avatar code.
          // startTime set before enabled=true, matching dwell/segment timer pattern (line ~1592).
          requestAnimationFrame(function() {
            // canvas.browser.currentTime returns 0 in some X_ITE builds (confirmed
            // elsewhere in this file, e.g. line ~1708) — fall back to performance.now()/1000
            // exactly as every other startTime write in this codebase already does.
            var _moveStartTime = (canvas.browser.currentTime && canvas.browser.currentTime > 0)
              ? canvas.browser.currentTime : (performance.now() / 1000);
            camTimer.startTime = _moveStartTime;
            camTimer.enabled   = true;
            console.log('[EventCues] camera: ' + shot + ' started — subject=' + (cue.subject||'?')
              + ' dur=' + duration + ' loop=' + doLoop);
          });
        });
        return;
      }

      var missing = [];
      if (!camXform)  missing.push('CAM_Free_Transform');
      if (!vpFree)    missing.push('VP_Free');
      if (!camTimer)  missing.push('CAM_Timer');
      if (!posInterp) missing.push('CAM_PosInterp');
      if (!oriInterp) missing.push('CAM_OriInterp');
      console.warn('[EventCues] camera: ' + shot + ' — missing vessel nodes:', missing.join(', '),
        '— re-export scene from Composer');

    } catch(e) { console.warn('[EventCues] camera: ' + shot + ' trySet exception:', e.message); }
    if (attempts < 10) setTimeout(trySet, 200);
    else console.warn('[EventCues] camera: ' + shot + ' — vessel nodes not found after retries');
  }
  trySet();
}

function _fireBehaviorEventCue(cue) {
  // Day 85: real bug fix, confirmed by grep — this called a function named
  // switchBehaviorTimer (no leading underscore), which does not exist
  // anywhere in this file. Every call threw a ReferenceError, silently
  // swallowed by the catch below, so this path has never actually worked.
  // Even fixed to the real function name, it would have been the wrong
  // one: _switchBehaviorTimer is the low-level walk/idle-only switcher,
  // keyed by a raw TimeSensor DEF name ('WalkTimer'/'DefaultTimer'), which
  // is what THIS legacy 'behavior' track was actually authored against.
  // The 'gesture' track below (current schema) is the one that needs
  // applyBehaviorClip's richer, named-clip handling instead — see that
  // function's own comment for why the two aren't interchangeable.
  // No current authoring UI produces 'behavior' track cues (the Day-81
  // Events Editor's TRACKS list is camera/light/gesture/path) — kept

// Day 85: the real fix for this session's stated priority — "get
// authored EventCues actually driving Anna's animation." This is the
// 'gesture' track's handler, for the CURRENT schema (target = agent name,
// clip = a real name from that agent's own authored behavior_clips list —
// see mccf_timeline_prototype.html's Clip dropdown, added alongside this).
// Uses applyBehaviorClip — confirmed by reading it directly: real
// oneshot-vs-loop handling and correct return-to-idle timing, not a bare
// enable/disable toggle — given the actual resolved clip object from
// _agentBehaviorClips[safeName].clips, not a bare string name.
// Day 88: real, new capability — resolves triggerRef (an <IMPORT>-exposed
// name, computed by Composer purely from cue.id — see the writer's own
// comment) via getImportedNode() first, same proven pattern as every
// other IMPORT-based lookup in this file, with a retry loop matching the
// one already proven necessary for the movie's own start trigger (an
// Inline'd asset isn't guaranteed to have finished loading the instant a
// cue's t0 arrives). Shared by both new track types below.
function _resolveEventCueTriggerNode(triggerRef, attempt, onFound, onGiveUp) {
  attempt = attempt || 1;
  var node;
  try {
    var scene = canvas.browser.currentScene;
    try { node = scene.getImportedNode(triggerRef); } catch(ie) {}
    if (!node) { try { node = scene.getNamedNode(triggerRef); } catch(ne) {} }
  } catch(e) {}
  if (node) { onFound(node, attempt); return; }
  if (attempt < 10) {
    setTimeout(function() { _resolveEventCueTriggerNode(triggerRef, attempt + 1, onFound, onGiveUp); }, 200);
  } else if (onGiveUp) {
    onGiveUp();
  }
}

// Turn cue — one-shot Y-axis rotation, routed to any placed agent or static
// asset. Same fetch-and-mutate pattern as the path ease-in and camera fly:
// TurnTimer/TurnInterp are baked once per cue at export time
// (buildTurnCueNodes/buildTurnCueRoutes, mccf_scene_composer.html); nothing
// is created dynamically here.
function _fireTurnEventCue(cue) {
  if (!cue.triggerRef || !cue.target) {
    console.warn('[EventCues] turn: cue missing triggerRef or target — nothing to fire:', cue);
    return;
  }
  _resolveEventCueTriggerNode(cue.triggerRef, 1,
    function(turnTimer, attempt) {
      try {
        var scene = canvas.browser.currentScene;
        var safeTarget = cue.target.replace(/[^A-Za-z0-9_]/g, '_');
        var targetNode = null;
        try { targetNode = scene.getNamedNode('Avatar_' + safeTarget); } catch(e1) {}
        if (!targetNode) { try { targetNode = scene.getNamedNode('PlacedAsset_' + safeTarget); } catch(e2) {} }
        if (!targetNode) {
          console.warn('[EventCues] turn: target "' + cue.target + '" not found as Avatar_' + safeTarget +
            ' or PlacedAsset_' + safeTarget + ' — nothing to rotate');
          return;
        }
        var interpName = 'TurnInterp_' + cue.triggerRef.replace(/^TurnTimer_/, '');
        var turnInterp = null;
        try { turnInterp = scene.getNamedNode(interpName); } catch(eI) {}
        if (!turnInterp) {
          console.warn('[EventCues] turn: ' + interpName + ' not found — scene needs a fresh Export X3D to pick up the turn cue nodes');
          return;
        }
        // Read the target's current Y-axis angle defensively — same
        // reasoning as the path ease-in's rotation read: real, genuine
        // uncertainty about SFRotation's exact read-back shape in this
        // codebase, confirmed only for writes, not reads. A turn only
        // means anything as a pure Y-axis rotation; if the current
        // rotation's axis isn't recognizably (0,1,0) (or the identity/
        // zero-angle axis X3D uses for "no rotation yet"), starting angle
        // defaults to 0 rather than guessing at unsupported axis math —
        // with a warning, so this is visible rather than silently wrong.
        var curAngle = 0;
        try {
          var curRot = targetNode.rotation;
          if (curRot && typeof curRot.angle === 'number') {
            var ax = curRot.x, ay = curRot.y, az = curRot.z;
            var isYAxis = (Math.abs(ax) < 1e-4 && Math.abs(az) < 1e-4 &&
                           (Math.abs(ay - 1) < 1e-4 || Math.abs(ay) < 1e-4));
            if (isYAxis) {
              curAngle = (Math.abs(ay) < 1e-4) ? 0 : curRot.angle;
            } else {
              console.warn('[EventCues] turn: ' + cue.target + '\'s current rotation axis isn\'t (0,1,0) — (' +
                ax + ',' + ay + ',' + az + '). Starting the turn from angle 0 rather than guessing; the turn ' +
                'itself will still apply correctly, just not layered on top of whatever non-Y rotation is ' +
                'already there.');
            }
          }
        } catch (eR) { /* default curAngle=0 already set */ }

        // Sign convention confirmed by direct author testing: positive
        // degrees = turn right, negative degrees = turn left. (X3D's own
        // right-hand-rule convention around +Y, viewed from above, would
        // suggest the opposite for a "forward = -Z" rig — negated here to
        // match the confirmed, tested result rather than that untested
        // assumption.) invert remains available in case a different
        // avatar's rig convention ever needs the opposite of this.
        var deltaRad = -(cue.degrees || 0) * Math.PI / 180;
        if (cue.invert) deltaRad = -deltaRad;
        var endAngle = curAngle + deltaRad;

        turnInterp.key.length = 0; turnInterp.keyValue.length = 0;
        turnInterp.key[0] = 0; turnInterp.keyValue[0] = new X3D.SFRotation(0, 1, 0, curAngle);
        turnInterp.key[1] = 1; turnInterp.keyValue[1] = new X3D.SFRotation(0, 1, 0, endAngle);

        var tNow = (canvas.browser.currentTime && canvas.browser.currentTime > 0)
          ? canvas.browser.currentTime : (performance.now() / 1000);
        turnTimer.stopTime  = tNow - 0.01;
        turnTimer.startTime = tNow + 0.05;
        console.log('[EventCues] turn: ' + cue.target + ' — ' + (cue.degrees||0) + '\u00b0 over ' +
          (cue.duration||2) + 's' + (cue.invert ? ' (inverted)' : '') + ', from ' +
          (curAngle*180/Math.PI).toFixed(1) + '\u00b0 to ' + (endAngle*180/Math.PI).toFixed(1) + '\u00b0',
          attempt > 1 ? '(attempt ' + attempt + ')' : '');
      } catch (e) {
        console.warn('[EventCues] turn: failed to fire (' + e.message + ')');
      }
    },
    function() {
      console.warn('[EventCues] turn: ' + cue.triggerRef + ' not found after retries — scene needs a fresh Export X3D to pick up the turn cue nodes');
    }
  );
}

// Day 88: real, new capability — recorded-path playback with a smooth
// ease-in from wherever the target actually is, never an instant jump.
// This is the one genuinely novel piece this session: everything else
// wrote to EXISTING nodes' fields; this has to CONSTRUCT a short
// transition at fire-time, since the target's current position isn't
// knowable until the cue actually fires. Rather than bet on an unverified
// JS-property convention for setting a freshly-created interpolator's
// multi-value key/keyValue fields, this builds a small, self-contained
// X3D XML string — the exact syntax already proven correct dozens of
// times today — and parses it into the live scene, matching the
// documented X3DExecutionContext SAI service. addRoute() (confirmed real
// via X_ITE's own GitHub examples) wires the two pieces this snippet
// can't reference on its own: the target's Transform (lives outside the
// snippet, in the main scene) and the pre-built main path timer.
function _firePathEventCue(cue) {
  if (!cue.target || !cue.pathId || !cue.triggerRef) {
    console.warn('[EventCues] path: cue missing target/pathId — nothing to fire:', cue);
    return;
  }
  if (cue.walkGesture) {
    // Reuses the exact same, already-proven gesture-firing logic — a
    // synthetic cue object is all _fireGestureEventCue actually needs.
    _fireGestureEventCue({ target: cue.target, clip: cue.walkGesture });
  }
  _resolveEventCueTriggerNode(cue.triggerRef, 1,
    function(mainTimer) {
      var scene = canvas.browser.currentScene;
      var safeTarget = cue.target.replace(/[^A-Za-z0-9_]/g, '_');
      var targetNode = null;
      try { targetNode = scene.getNamedNode('Avatar_' + safeTarget); } catch(e) {}
      if (!targetNode) { try { targetNode = scene.getNamedNode('PlacedAsset_' + safeTarget); } catch(e2) {} }
      // Real bug fix: pbPushPosition (and several sibling functions —
      // the broadcast-position write, pbJump, TTS-delay timing) already
      // have a guard for exactly this class of conflict —
      // `if (_x3dTimerActive[nodeName]) return;` — "if an X3D TimeSensor
      // is driving this avatar, don't also write its position from JS."
      // That guard has only ever been set by the OLD arc/waypoint
      // Timer_{agent}_N system (pbActivateX3DTimers). A RecordedPath-driven
      // agent never sets it, so every one of those guards silently never
      // fires for an agent like this — confirmed live: pbPushPosition
      // pushed Avatar_Anna straight to a waypoint file's "Begin"/"Sit"
      // coordinates (both landing at/near the Island/lake zone) while the
      // path's own continuous position control was simultaneously active,
      // fighting over her Transform. Setting the SAME existing flag here
      // makes all of those already-correct guards recognize a
      // RecordedPath-driven agent too, rather than adding a new,
      // narrower, one-off check just for this function. Cleared
      // automatically wherever _x3dTimerActive already gets wholesale
      // reset (pbReset, pbPlayAll's generation bump, pbStopX3DTimers) —
      // no separate cleanup needed.
      if (targetNode) {
        _x3dTimerActive['Avatar_' + safeTarget] = true;
        // Closes a real timing gap in the fix above: the flag only stops
        // FUTURE pbPushPosition calls from starting a write. A waypoint
        // "arrive" trigger firing before this cue's t0 (very common — the
        // very first waypoint arrival typically fires near t=0, while a
        // path cue often has its own t0 a second or so later) can already
        // have a JS lerp (setInterval-driven, running for pace seconds —
        // default 3s) actively in flight by the time this line runs. The
        // flag alone doesn't stop an already-running interval; it has to
        // be cancelled directly. Same cancellation pbPushPosition already
        // does to itself when starting a new lerp — reused here so a path
        // cue reliably wins over a lerp that's already mid-flight instead
        // of the two fighting over the same Transform for the next couple
        // of seconds.
        if (_lerpActive[safeTarget]) {
          clearInterval(_lerpActive[safeTarget].timer);
          delete _lerpActive[safeTarget];
        }
      }
      var tNow = (canvas.browser.currentTime && canvas.browser.currentTime > 0)
        ? canvas.browser.currentTime : (performance.now() / 1000);
      function startMainDirectly(why) {
        mainTimer.stopTime  = tNow - 0.01;
        mainTimer.startTime = tNow + 0.05;
        console.log('[EventCues] path: ' + cue.target + ' — main path timer started directly (' + why + ')');
      }
      if (!targetNode || !cue.pathStart) {
        startMainDirectly(!targetNode ? 'target node not found' : 'no pathStart recorded');
        return;
      }
      var cur;
      try { cur = targetNode.translation; } catch(e3) { cur = null; }
      // Defensive: if the read-back shape isn't what's expected (real,
      // remaining uncertainty about SFVec3f's exact property names on a
      // read, vs. the constructor pattern confirmed for writes), fail
      // safely to the instant-start fallback rather than risk computing
      // NaN distances and silently building a broken ease-in.
      if (cur && (typeof cur.x !== 'number' || typeof cur.y !== 'number' || typeof cur.z !== 'number')) {
        console.warn('[EventCues] path: read back translation in an unexpected shape', cur, '— treating as unreadable');
        cur = null;
      }
      var dx = cur ? (cue.pathStart[0]-cur.x) : 999, dy = cur ? (cue.pathStart[1]-cur.y) : 0, dz = cur ? (cue.pathStart[2]-cur.z) : 999;
      var dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
      if (!cur || dist < 0.3) {
        startMainDirectly(cur ? ('already at path start, dist=' + dist.toFixed(2)) : 'could not read current position');
        return;
      }
      // Ease-in: fixed, reasonable duration rather than distance-scaled —
      // simple, predictable, easy to reason about while this is new.
      var easeDur = 1.5;
      var cueSafe = cue.triggerRef.replace(/[^A-Za-z0-9_]/g, '_');
      // Day 88: real, new capability — rotation ease, sharing the exact
      // same EaseTimer as position (one clock, paired interpolators,
      // same architecture as the main path playback itself). Read
      // defensively, same reasoning as the translation read above —
      // genuine, real uncertainty about SFRotation's exact read-back
      // shape, not yet proven in this codebase the way writes are
      // (confirmed via X_ITE's own examples). If anything about this
      // looks wrong, orientation easing is just skipped — the target
      // still gets the correct facing the instant the main path timer's
      // own OrientationInterpolator takes over, it just won't have eased
      // into it smoothly. Position easing is unaffected either way.
      var curRot = null;
      if (cue.pathStartOrient) {
        try { curRot = targetNode.rotation; } catch(eR) { curRot = null; }
        if (curRot && (typeof curRot.x !== 'number' || typeof curRot.y !== 'number' || typeof curRot.z !== 'number' || typeof curRot.angle !== 'number')) {
          console.warn('[EventCues] path: read back rotation in an unexpected shape', curRot, '— skipping rotation ease, position ease unaffected');
          curRot = null;
        }
      }
      // Real fix, two bugs deep: this used to dynamically build a fresh
      // TimeSensor/Interpolator via scene.createX3DFromString() on every
      // single fire. That was broken on two separate counts, confirmed
      // live: (1) createX3DFromString belongs to Browser, not X3DScene —
      // "scene.createX3DFromString is not a function" fired on literally
      // every attempt, so ease-in has never actually run; every path cue
      // has always silently fallen back to an instant jump. (2) an earlier
      // same-day fix to reuse nodes across Plays used bulk array assignment
      // on the interpolator's keyValue field (`interp.keyValue = [...]`) —
      // also unsupported by X_ITE's SAI, which only accepts indexed
      // assignment (confirmed against X_ITE's own README, see
      // _flyCameraTo's identical situation and fix above). Properly fixed
      // by following this project's own already-proven pattern for exactly
      // this problem: Composer now bakes reusable PathEaseTimer/
      // PathEaseInterp/PathEaseOrient nodes (and their routes) into the
      // compiled scene once per path cue, at export time, next to that
      // cue's main path nodes — same relationship CAM_FlyTimer/
      // CAM_FlyPosInterp/CAM_FlyOriInterp have to _flyCameraTo. Nothing
      // is created at runtime here anymore; this just fetches the
      // pre-baked nodes and mutates their fields with the confirmed
      // indexed-assignment pattern, exactly like _flyCameraTo does.
      var easeTimer, easeInterp, easeOrient = null;
      try {
        easeTimer  = scene.getNamedNode('PathEaseTimer_' + cueSafe);
        easeInterp = scene.getNamedNode('PathEaseInterp_' + cueSafe);
        if (curRot) { try { easeOrient = scene.getNamedNode('PathEaseOrient_' + cueSafe); } catch(eo) { easeOrient = null; } }
      } catch(eLookup) {
        console.warn('[EventCues] path: PathEaseTimer_' + cueSafe + '/PathEaseInterp_' + cueSafe +
          ' not found (' + eLookup.message + ') — scene needs a fresh Export X3D to pick up the ease-in nodes. Falling back to instant jump + direct start.');
        startMainDirectly('ease-in nodes not found in scene');
        return;
      }
      if (!easeTimer || !easeInterp) {
        console.warn('[EventCues] path: PathEaseTimer_' + cueSafe + '/PathEaseInterp_' + cueSafe +
          ' not found — scene needs a fresh Export X3D to pick up the ease-in nodes. Falling back to instant jump + direct start.');
        startMainDirectly('ease-in nodes not found in scene');
        return;
      }
      try {
        easeInterp.key.length = 0; easeInterp.keyValue.length = 0;
        easeInterp.key[0] = 0; easeInterp.keyValue[0] = new X3D.SFVec3f(cur.x, cur.y, cur.z);
        easeInterp.key[1] = 1; easeInterp.keyValue[1] = new X3D.SFVec3f(cue.pathStart[0], cue.pathStart[1], cue.pathStart[2]);
        if (curRot && easeOrient) {
          easeOrient.key.length = 0; easeOrient.keyValue.length = 0;
          easeOrient.key[0] = 0; easeOrient.keyValue[0] = new X3D.SFRotation(curRot.x, curRot.y, curRot.z, curRot.angle);
          easeOrient.key[1] = 1; easeOrient.keyValue[1] = new X3D.SFRotation(
            cue.pathStartOrient[0], cue.pathStartOrient[1], cue.pathStartOrient[2], cue.pathStartOrient[3]);
        }
        // Restart the one-shot timer: stop just before now, start just after —
        // same pattern startMainDirectly uses on mainTimer above. The route
        // from this timer's cycleTime into mainTimer.set_startTime is baked
        // statically into the scene now, so it keeps working across every
        // repeated start/stop cycle without needing to be re-added here.
        easeTimer.stopTime  = tNow - 0.01;
        easeTimer.startTime = tNow + 0.05;
        console.log('[EventCues] path: ' + cue.target + ' — easing in over ' + easeDur + 's (dist=' + dist.toFixed(2) + 'm'+(curRot&&easeOrient?', with rotation':'')+'), then main path timer starts');
      } catch(e4) {
        console.warn('[EventCues] path: ease-in field mutation failed (' + e4.message + ') — falling back to instant jump + direct start');
        startMainDirectly('ease-in mutation failed');
      }
    },
    function() {
      console.warn('[EventCues] path: ' + cue.triggerRef + ' (main path timer) not found after retries — check the recorded path has real keys and the target (' + cue.target + ') is actually placed');
    }
  );
}

// Gesture cues scheduled at/near t0=0 race pbActivateX3DTimers: fireScheduledEventCues
// is set up via setTimeout(...,0) at the very top of _pbPlayAllInner, before the
// await fetch('/arc/playback/start/all') that _behaviorTimerMap-building (and
// _agentBehaviorClips seeding, via _seedArcRecord) waits behind. A cue at t0=0 or
// t0=1 can therefore fire before either is populated at all -- not bug #7's "12 of
// 14 found" partial-map shape, but a genuinely empty/undefined timerMap, previously
// showing as "no timerMap for <agent>". Same bounded-retry shape as
// pbActivateX3DTimers's own timer-map loop, so an early cue gets a real chance to
// resolve instead of silently no-op'ing.
var GESTURE_CUE_MAX_ATTEMPTS = 20;
var GESTURE_CUE_RETRY_MS = 250;

function _fireGestureEventCue(cue, _retry) {
  if (!cue.target || !cue.clip) {
    console.warn('[EventCues] gesture: cue missing target or clip — nothing to fire:', cue);
    return;
  }
  var safeName = cue.target.replace(/[^A-Za-z0-9_]/g, '_');
  var gen = (_retry && _retry.gen !== undefined) ? _retry.gen : _pbCbGeneration;
  var attempts = _retry ? _retry.attempts : 0;

  // Self-expire if a newer Play/Reset has superseded this cue.
  if (gen !== _pbCbGeneration) return;

  var config = _agentBehaviorClips[safeName];
  var clipsReady = !!(config && config.clips && config.clips.length);
  var timerMapReady = !!_behaviorTimerMap[safeName];

  if (!clipsReady || !timerMapReady) {
    if (attempts < GESTURE_CUE_MAX_ATTEMPTS) {
      if (attempts === 0) {
        console.log('[EventCues] gesture: ' + cue.target + ' not ready yet for "' + cue.clip + '" (' +
          (!clipsReady ? 'behavior_clips not loaded' : 'timer map not resolved') +
          ') — retrying (up to ' + GESTURE_CUE_MAX_ATTEMPTS + '×' + GESTURE_CUE_RETRY_MS + 'ms) instead of dropping the cue');
      }
      setTimeout(function() { _fireGestureEventCue(cue, { attempts: attempts + 1, gen: gen }); }, GESTURE_CUE_RETRY_MS);
    } else {
      console.warn('[EventCues] gesture: gave up on "' + cue.clip + '" for ' + cue.target + ' after ' +
        GESTURE_CUE_MAX_ATTEMPTS + ' retries (' +
        (!clipsReady ? 'behavior_clips never loaded' : 'timer map never resolved') +
        ') — check pbActivateX3DTimers logs for this agent.');
    }
    return;
  }

  var clipObj = config.clips.find(function(c) { return c.name === cue.clip; });
  if (!clipObj) {
    console.warn('[EventCues] gesture: clip "' + cue.clip + '" not found in', cue.target + "'s behavior_clips — available:", config.clips.map(function(c){ return c.name; }).join(', '));
    return;
  }
  var ok = applyBehaviorClip(safeName, clipObj);
  if (ok) {
    console.log('[EventCues] gesture:', cue.target, '→', cue.clip, attempts ? ('(resolved after ' + attempts + ' retries)') : '');
  } else {
    console.warn('[EventCues] gesture: FAILED to apply', cue.clip, 'on', cue.target,
                 '— clip was found in behavior_clips but applyBehaviorClip could not enable the timer (see warning above).');
  }
}

// TODO Day 56+: poll /field, compare EBPS values, fire threshold cues (trigger="field E>0.6" etc.)

// _pivotAgentToSegment — rotate avatar to face direction of travel
// ─────────────────────────────────────────────
// Writes Y-axis rotation to Avatar_ parent Transform at transit start.
// heading = atan2(dx, dz): angle from +Z toward +X in X3D Y-up world.
function _pivotAgentToSegment(safeName, seg) {
  var cache = _agentWaypointCache[safeName] || {};
  // Cache is keyed by 1-based stepNo. Segment seg: from step seg → step seg+1.
  var fromWP = cache[seg];
  var toWP   = cache[seg + 1];

  // Fallback: if stepno-keyed positions missing, try _waypointPosMap by name.
  // Arc step IDs (wp.id) are stored in cache as a side-channel when available.
  if (!fromWP || !toWP) {
    var fromId = cache['id_' + seg];
    var toId   = cache['id_' + (seg + 1)];
    if (fromId && _waypointPosMap[fromId]) fromWP = _waypointPosMap[fromId];
    if (toId   && _waypointPosMap[toId])   toWP   = _waypointPosMap[toId];
  }

  if (!fromWP || !toWP) {
    console.log('_pivotAgentToSegment: missing waypoints for', safeName,
      'seg', seg, '— cache keys:', Object.keys(cache).join(','));
    return;
  }

  var dx = parseFloat(toWP.pos_x || 0) - parseFloat(fromWP.pos_x || 0);
  var dz = parseFloat(toWP.pos_z || 0) - parseFloat(fromWP.pos_z || 0);
  if (Math.abs(dx) < 0.001 && Math.abs(dz) < 0.001) return;

  var heading = Math.atan2(dx, dz);

  try {
    var scene = canvas.browser.currentScene;
    if (!scene) return;
    var avatarNode = scene.getNamedNode('Avatar_' + safeName);
    if (!avatarNode) return;
    avatarNode.rotation = new X3D.SFRotation(0, 1, 0, heading);
    console.log('_pivotAgentToSegment:', safeName, 'seg', seg,
      'dx=' + dx.toFixed(2), 'dz=' + dz.toFixed(2),
      'heading=' + (heading * 180 / Math.PI).toFixed(1) + 'deg');
  } catch(e) {
    console.warn('_pivotAgentToSegment error:', safeName, e.message);
  }
}

// _wirePathTimerBehavior — wire isActive/fraction_changed on path Timer nodes
// ─────────────────────────────────────────────
// Uses pure X3D timer events to drive walk/idle — no setTimeout, no TTS coupling.
//   Timer_N isActive TRUE       → WalkTimer on   (transit begins)
//   Timer_N fraction_changed≥0.99 → DefaultTimer on (transit ends)
// Called after behavior timer map resolves, once per agent per play.
// segCount = number of path segments = total_steps - 1.
function _wirePathTimerBehavior(safeName, gen) {
  var scene;
  try { scene = canvas.browser.currentScene; } catch(e) { return; }
  if (!scene) return;

  // Day 77: probe Timer_{agent}{orderSuffix}_1 through _8 — was bare
  // Timer_{agent}_N before, which for an agent's SECOND (or later) group
  // found that agent's group-1 timer (still present in the scene graph,
  // just finished and inactive) instead of the real, currently-running
  // order-suffixed one — wiring walk/idle behavior to a dead node that
  // would never fire isActive/fraction_changed again. Same
  // _pbAgentCurrentOrder lookup as pbActivateX3DTimers/_pbAdvanceSeg/
  // pbReleaseDwell use for the same reason.
  var _suf = _pbOrderSuffix(_pbAgentCurrentOrder[safeName]);
  var MAX_SEGS = 8;
  for (var seg = 1; seg <= MAX_SEGS; seg++) {
    (function(s) {
      var timerName = 'Timer_' + safeName + _suf + '_' + s;
      var timerNode;
      try { timerNode = scene.getNamedNode(timerName); } catch(e) {}
      if (!timerNode) {
        console.log('_wirePathTimerBehavior: ' + timerName + ' not found — skipping');
        return;
      }

      // isActive TRUE → WalkTimer on
      var isActiveField;
      try { isActiveField = timerNode.getField('isActive'); } catch(e) {}
      if (isActiveField && typeof isActiveField.addFieldCallback === 'function') {
        isActiveField.addFieldCallback('bhWalk_' + safeName + _suf + '_' + s + '_' + gen, function(value) {
          if (_pbCbGeneration !== gen) return;
          if (value === true || value === 'true' || value === 1) {
            console.log('Timer ' + timerName + ' isActive=true → pivot then WalkTimer');
            // Pivot first so avatar faces direction of travel before walking.
            // 50ms gap gives X3D one render frame to apply the rotation.
            var _pivName = safeName;
            var _pivSeg  = s;
            var _pivGen  = gen;
            _pivotAgentToSegment(_pivName, _pivSeg);
            setTimeout(function() {
              if (_pbCbGeneration !== _pivGen) return;
              _switchBehaviorTimer(_pivName, 'WalkTimer', null);
            }, 50);
          }
        });
      }

      // fraction_changed >= 0.99 → DefaultTimer on (end of transit)
      var fracField;
      try { fracField = timerNode.getField('fraction_changed'); } catch(e) {}
      if (fracField && typeof fracField.addFieldCallback === 'function') {
        var _arrived = false;  // one-shot per timer run
        fracField.addFieldCallback('bhIdle_' + safeName + _suf + '_' + s + '_' + gen, function(value) {
          if (_pbCbGeneration !== gen) return;
          var f = parseFloat(value);
          if (f >= 0.99 && !_arrived) {
            _arrived = true;
            console.log('Timer ' + timerName + ' fraction=' + f.toFixed(3) + ' → DefaultTimer');
            _switchBehaviorTimer(safeName, 'DefaultTimer', null);
          }
          // Reset one-shot when timer restarts (fraction drops back toward 0)
          if (f < 0.05) _arrived = false;
        });
      }

      console.log('_wirePathTimerBehavior: wired ' + timerName);
    })(seg);
  }
}

function pbActivateX3DTimers(cultivars, cultivarSessionMap) {
  // cultivars: array of cultivar names to wire
  // cultivarSessionMap: optional {cultivarName: session_id} — if provided, each
  //   Arrival_ callback calls pbStepSession(session_id) instead of pbStep().
  //   Pass undefined/null for single-arc play (uses pbStep() fallback).
  // Uses cultivar names from arc playback state — does NOT enumerate scene.namedNodes
  // because X_ITE SAI does not expose Script DEF nodes via namedNodes enumeration.
  // getNamedNode('Arrival_Cindy') works; Object.keys(scene.namedNodes) misses Script nodes.
  //
  // Day 77: now called ONCE PER ORDER GROUP (from _pbPlayAllInner's group loop),
  // not once upfront for every cultivar in the whole scene — an agent with
  // multiple paths needs THIS function to run again for each of its later
  // groups, wiring Arrival_{agent}_{order}'s callback and arming
  // Timer_{agent}_{order}_1, not just its first path's bare names every time.
  // _x3dTimerActive/window._pbPollingSegment resets moved OUT of this function
  // to _pbPlayAllInner's one-time-per-Play-All reset block — resetting them
  // here would have wiped group 1's still-active polling/tracking state the
  // moment group 2 called this function again within the SAME play session.
  console.log('pbActivateX3DTimers: entered, cultivars =', cultivars);
  if (!canvas || !canvas.browser) { console.warn('pbActivateX3DTimers: no browser'); return; }
  try {
    var scene = canvas.browser.currentScene;
    if (!scene) { console.warn('pbActivateX3DTimers: no currentScene'); return; }
    if (!window._pbPollingSegment) window._pbPollingSegment = {};

    if (!cultivars || cultivars.length === 0) {
      console.warn('pbActivateX3DTimers: no cultivars passed — cannot wire Arrival_ or start Timers');
      return;
    }

    cultivars.forEach(function(cultivarName) {
      var safeName = cultivarName.replace(/[^A-Za-z0-9_]/g, '_');
      var _suf = _pbOrderSuffix(_pbAgentCurrentOrder[safeName]);
      var arrNodeName = 'Arrival_' + safeName + _suf;
      var timerNodeName = 'Timer_' + safeName + _suf + '_1';
      var avatarName = 'Avatar_' + safeName;
      // Session id for this cultivar — null means single-arc (use pbStep)
      var sid = (cultivarSessionMap && cultivarSessionMap[cultivarName]) || null;

      // Wire Arrival_ segmentArrived -> pbStepSession(sid) or pbStep()
      // addFieldCallback on outputOnly Script fields not reliably supported — always poll.
      try {
        var arrNode = scene.getNamedNode(arrNodeName);
        if (!arrNode) {
          console.warn('pbActivateX3DTimers: ' + arrNodeName + ' not found in scene');
        } else {
          var cbWired = false;
          try {
            var field = arrNode.getField('segmentArrived');
            if (field && typeof field.addFieldCallback === 'function') {
              var _lastCbSeg = -1;
              var _cbGen = _pbCbGeneration;  // capture generation at wire time
            // Key includes generation so re-registration on Reset+Replay always succeeds.
            // X_ITE ignores addFieldCallback if the key already exists — a stale key
            // from the previous run would block the new callback from wiring.
            field.addFieldCallback(arrNodeName + '_cb_' + _cbGen, function(value) {
                // Self-expire if a newer pbPlay has run
                if (_pbCbGeneration !== _cbGen) return;
                var seg = parseInt(value) || 0;
                if (seg <= _lastCbSeg) {
                  console.log('segmentArrived callback DUPLICATE suppressed: ' + arrNodeName + ' seg=' + seg);
                  return;
                }
                _lastCbSeg = seg;
                console.log('segmentArrived callback: ' + arrNodeName + ' seg=' + seg);
                _x3dLastArrivedSeg[safeName] = seg;
                // Walk/idle switching is now owned by _wirePathTimerBehavior:
                //   Timer_N isActive=true  → WalkTimer on
                //   Timer_N fraction≥0.99  → DefaultTimer on
                // segmentArrived only advances the arc step counter.
                if (sid) {
                  pbStepSession(sid);
                } else {
                  pbStep();
                }
              });
              cbWired = true;
              console.log('pbActivateX3DTimers: wired segmentArrived callback on', arrNodeName,
                          sid ? '(session: ' + sid + ')' : '(single-arc)', '— skipping poll');
            }
          } catch(cbErr) {}
          if (!cbWired) {
            console.log('pbActivateX3DTimers: addFieldCallback unavailable for', arrNodeName, '— using poll');
          }
          // Only install poll if callback not wired
          window._pbPollingSegment[arrNodeName] = !cbWired;
          if (!cbWired) (function(node, name, sessionId) {
            var lastSeg = -1;
            var _pollWasActive = window._pbPollingSegment[name];
            var pollId = setInterval(function() {
              if (!window._pbPollingSegment || !window._pbPollingSegment[name]) {
                clearInterval(pollId);
                if (_pollWasActive) console.log('pbActivateX3DTimers: poll stopped for', name);
                return;
              }
              try {
                var v = node.segmentArrived;
                if (v === undefined || v === null) {
                  var f = node.getField ? node.getField('segmentArrived') : null;
                  v = f ? f.getValue() : 0;
                }
                v = parseInt(v) || 0;
                if (v > lastSeg) {
                  lastSeg = v;
                  console.log('segmentArrived poll: ' + name + ' seg=' + v);
                  if (sessionId) {
                    pbStepSession(sessionId);
                  } else {
                    pbStep();
                  }
                }
              } catch(e) {}
            }, 200);
          })(arrNode, arrNodeName, sid);
        }
      } catch(e) { console.warn('pbActivateX3DTimers: could not wire', arrNodeName, e); }

      // Start Timer_{agent}_1
      try {
        var timerNode = scene.getNamedNode(timerNodeName);
        if (!timerNode) {
          console.warn('pbActivateX3DTimers: ' + timerNodeName + ' not found in scene');
        } else {
          // Mark avatar as X3D-driven so pbPushPosition and applyArcCV skip it.
          // Timer_1 is started by pbReleaseDwell after WP1 TTS+dwell completes,
          // via startAgent — same path as all subsequent timers use startNextTimer.
          _x3dTimerActive[avatarName] = true;
          console.log('pbActivateX3DTimers: armed X3D driving for', avatarName, '— Timer_1 starts after WP1 dwell');
        }
      } catch(e) { console.warn('pbActivateX3DTimers: could not start', timerNodeName, e); }

      // Task 2 — Build behavior timer map for this agent.
      // Maps base DEF names (e.g. 'WalkTimer') to live scene nodes.
      // Uses a JS-side map rather than DEF rename — X_ITE SAI does not expose
      // a reliable DEF rename API, and multi-instance addressing via JS map is
      // sufficient for MCCF's single-scene-per-session model.
      // The scene's <IMPORT> statements already register the timer nodes into the
      // parent scene's imported node table at parse time. We just need to retrieve
      // them via getImportedNode once the Inline has finished loading.
      // addImportedNode is NOT needed — calling it throws "already in use" because
      // the declarative IMPORT did it first. (Confirmed Day 24 diagnostic.)
      (function(sName, gen) {
        var attempts = 0;
        var MAX_ATTEMPTS = 20;
        var RETRY_MS = 250;
        // Hoisted out of tryMapTimers so a timer found on attempt N survives
        // into attempt N+1 -- previously this was declared fresh inside the
        // function and discarded every retry, so retrying never actually
        // helped even when it ran.
        var timerMapForAgent = {};
        function tryMapTimers() {
          if (_pbCbGeneration !== gen) return;  // reset fired — abandon
          attempts++;
          try {
            var sc = canvas.browser.currentScene;
            if (!sc) { if (attempts < MAX_ATTEMPTS) setTimeout(tryMapTimers, RETRY_MS); return; }

            // Confirm the Inline is present — DEF="HAnim_AgentSafeName"
            var inlineNode = null;
            try { inlineNode = sc.getNamedNode('HAnim_' + sName); } catch(e2) {}
            if (!inlineNode) {
              console.log('pbActivateX3DTimers: no HAnim_' + sName + ' Inline — cylinder or static avatar');
              return;
            }

            // Retrieve imported nodes registered by the scene's <IMPORT> statements.
            // AS names follow convention: TimerBase_AgentSafeName (e.g. DefaultTimer_Cindy).
            // Build the full set of timer bases: standard + any custom clips for this agent.
            // _agentBehaviorClips[sName] is populated by _seedArcRecord before this runs.
            var _timerBases = BEHAVIOR_TIMER_BASES.slice();
            var _agentClipCfg = _agentBehaviorClips[sName];
            if (_agentClipCfg && _agentClipCfg.clips) {
              _agentClipCfg.clips.forEach(function(clip) {
                var td = clip.timerDEF || (clip.name + 'Timer');
                if (_timerBases.indexOf(td) === -1) _timerBases.push(td);
              });
            }
            _timerBases.forEach(function(base) {
              if (timerMapForAgent[base]) return;  // already resolved on a prior attempt
              var importedName = base + '_' + sName;
              try {
                var node = sc.getImportedNode(importedName);
                if (node) timerMapForAgent[base] = node;
              } catch(e2) {
                // Not yet available — Inline still loading
              }
            });

            var foundTimers  = Object.keys(timerMapForAgent);
            var stillMissing = _timerBases.filter(function(b) { return !timerMapForAgent[b]; });
            var complete     = stillMissing.length === 0;

            if (foundTimers.length > 0 && (complete || attempts >= MAX_ATTEMPTS)) {
              _behaviorTimerMap[sName] = timerMapForAgent;
              if (complete) {
                console.log('pbActivateX3DTimers: behavior timers mapped for', sName,
                            '(attempt ' + attempts + ', complete) —', foundTimers.join(', '));
              } else {
                // Previously this case would have silently declared success
                // on whatever partial set attempt 1 happened to find (e.g.
                // 12 of 14 expected timers) and never retried for the rest --
                // exactly what left Timer3/Timer7 permanently unresolved for
                // Anna despite both having valid <IMPORT> statements. Now it
                // only stops here after genuinely exhausting the retries.
                console.warn('pbActivateX3DTimers: behavior timers PARTIALLY mapped for', sName,
                            '(attempt ' + attempts + ', gave up retrying) — found:',
                            foundTimers.join(', '), '— still missing:', stillMissing.join(', '),
                            '— any gesture cue targeting a missing timer will fail; re-check that timer\'s <IMPORT> in the exported scene.');
              }
              // Start DefaultTimer so avatar plays idle animation before first waypoint
              var defNode = timerMapForAgent['DefaultTimer'];
              if (defNode) {
                try {
                  // enabled=true is the correct mechanism — confirmed Day 25.
                  // startTime not needed; enabled=true begins the cycle immediately.
                  defNode.enabled = true;
                  _agentCurrentClip[sName]  = 'Default';
                  _agentLastLoopClip[sName] = 'Default';
                  console.log('pbActivateX3DTimers: DefaultTimer started for', sName);
                } catch(e3) {
                  console.warn('pbActivateX3DTimers: DefaultTimer start failed for', sName, e3);
                }
              }
              // Wire isActive/fraction_changed on all path Timer nodes for clean
              // walk/idle switching driven purely by X3D timer events.
              _wirePathTimerBehavior(sName, gen);
            } else if (attempts < MAX_ATTEMPTS) {
              console.log('pbActivateX3DTimers: behavior timers not yet complete for', sName,
                          '— have:', foundTimers.join(', ') || '(none)',
                          '— missing:', stillMissing.join(', '),
                          '— retry', attempts, '/', MAX_ATTEMPTS);
              setTimeout(tryMapTimers, RETRY_MS);
            } else {
              console.warn('pbActivateX3DTimers: no behavior timers found for', sName,
                          '— gave up after', MAX_ATTEMPTS, 'attempts. Every gesture cue for this agent will silently no-op (see applyBehaviorClip warnings when cues fire). Check the exported scene XML for <IMPORT inlineDEF="HAnim_' + sName + '" ... AS="..._' + sName + '"/> lines.');
            }
          } catch(e) {
            console.warn('pbActivateX3DTimers: behavior timer map error for', sName, e);
            if (attempts < MAX_ATTEMPTS) setTimeout(tryMapTimers, RETRY_MS);
          }
        }
        tryMapTimers();
      })(safeName, _pbCbGeneration);

    });
  } catch(e) { console.warn('pbActivateX3DTimers error:', e); }
}

function pbStopX3DTimers() {
  // Disable timers by deriving names from _x3dTimerActive keys (Avatar_X -> Timer_X_1, Timer_X_2, etc.)
  // Does NOT use scene.namedNodes enumeration — Script nodes not reliably enumerated by X_ITE SAI.
  if (canvas && canvas.browser) {
    try {
      var scene = canvas.browser.currentScene;
      if (scene) {
        Object.keys(_x3dTimerActive).forEach(function(avatarName) {
          var suffix = avatarName.replace(/^Avatar_/, '');
          // Day 77: sweep every possible order group (1-8), not just the bare
          // (order=1) name — this is a full stop/cleanup, and an agent could
          // have any of its later paths active when Stop is pressed, not just
          // its first. Over-trying nonexistent nodes is harmless (try/catch);
          // under-cleaning would leave a later group's timer still running
          // after Stop.
          for (var ord = 1; ord <= 8; ord++) {
            var _stopSuf = _pbOrderSuffix(ord);
            // Disable up to 8 segments worth of timers and dwells
            for (var i = 1; i <= 8; i++) {
              ['Timer_'+suffix+_stopSuf+'_'+i, 'Dwell_'+suffix+_stopSuf+'_'+i].forEach(function(nodeName) {
                try {
                  var n = scene.getNamedNode(nodeName);
                  if (n) n.enabled = false;
                } catch(e) {}
              });
            }
          }
        });
      }
    } catch(e) {}
  }
  _x3dTimerActive = {};
  // Stop CAM_Timer (free/world-space move shot orbit/dolly etc.) if running
  try {
    var _camScene = canvas && canvas.browser && canvas.browser.currentScene;
    if (_camScene) {
      var _camT = _camScene.getNamedNode('CAM_Timer');
      if (_camT) {
        _camT.enabled = false;
        console.log('[EventCues] camera: CAM_Timer stopped by pbStopX3DTimers');
      }
      // Stop every agent's orbit timer too — agent_orbit is per-avatar, not singular.
      var _orbitNames = window._avatarNodeNames || [];
      _orbitNames.forEach(function(nm) {
        try {
          var safeNm = nm.replace(/^Avatar_/, '');
          // Day 64: CAM_OrbitTimer_{name} is no longer a reachable top-level DEF — it lives
          // inside AgentOrbitCamera's ProtoBody. Stop orbit via the proto instance's own
          // exposed 'enabled' field instead, which is IS'd through to that internal timer.
          var _orbitProto = _camScene.getNamedNode('CAM_OrbitProto_' + safeNm);
          if (_orbitProto) {
            _orbitProto.enabled = false;
            console.log('[EventCues] camera: CAM_OrbitProto_' + safeNm + ' stopped by pbStopX3DTimers');
          }
          // Day 63: agent_track is also per-avatar, same structural reason as orbit above —
          // one timer per avatar, not a singular free-camera timer, so it needs the same loop.
          // Day 64: CAM_TrackTimer_{name} is no longer a reachable top-level DEF — it
          // lives inside AgentTrackCamera's ProtoBody. Stop via the proto instance's own
          // exposed 'enabled' field, matching the same fix already applied to orbit.
          var _trackProto = _camScene.getNamedNode('CAM_TrackProto_' + safeNm);

var _lerpActive = {};      // suffix → { timer, stepNum }
var _lerpDest   = {};      // suffix → { x, z } — intended destination, set once per step change

function pbPushPosition(wp) {
  if (!wp) return;
  var x = parseFloat(wp.pos_x)||0, y = parseFloat(wp.pos_y)||0, z = parseFloat(wp.pos_z)||0;
  if (!wp.cultivar) { console.warn('pbPushPosition: no cultivar in wp', wp); return; }
  // If X3D TimeSensor is driving this avatar, skip JS lerp entirely
  var safeName = wp.cultivar.replace(/[^A-Za-z0-9_]/g,'_');
  var nodeName = 'Avatar_' + safeName;
  if (_x3dTimerActive[nodeName]) return;
  try {
    var scene = canvas.browser.currentScene;
    if (!scene) return;
    var safeName = wp.cultivar.replace(/[^A-Za-z0-9_]/g,'_');
    var nodeName = 'Avatar_' + safeName;
    var avatarNode = scene.getNamedNode(nodeName);
    if (!avatarNode) {
      console.warn('pbPushPosition: node not found:', nodeName, '— cultivar was:', wp.cultivar);
      return;
    }

    // If already lerping toward this exact destination, do not restart — let it finish.
    var dest = _lerpDest[safeName];
    if (dest && Math.abs(dest.x - x) < 0.01 && Math.abs(dest.z - z) < 0.01) return;

    // New destination — cancel any in-progress lerp and start fresh.
    if (_lerpActive[safeName]) {
      clearInterval(_lerpActive[safeName].timer);
      delete _lerpActive[safeName];
    }
    _lerpDest[safeName] = { x: x, z: z };

    // Read start position from stored destination of previous lerp (not from SAI read-back,
    // which may lag). Fall back to SAI read only when no prior destination is known.
    var startX, startZ;
    if (dest) {
      startX = dest.x;
      startZ = dest.z;
    } else {
      var cur = avatarNode.translation;
      startX = cur ? (cur.x || 0) : 0;
      startZ = cur ? (cur.z || 0) : 0;
    }

    var pace = parseFloat((document.getElementById('pb-pace')||{}).value) || 3.0;
    var LERP_FPS = 30;
    var totalSteps = Math.max(1, Math.round(pace * LERP_FPS));
    var stepMs     = Math.round(1000 / LERP_FPS);

    console.log('pbPushPosition:', nodeName, 'from', startX, startZ, '→', x, z);

    var state = { stepNum: 0 };
    state.timer = setInterval(function() {
      state.stepNum++;
      var t = state.stepNum / totalSteps;
      t = t * t * (3 - 2 * t);  // smoothstep
      var lx = startX + (x - startX) * t;
      var lz = startZ + (z - startZ) * t;
      try {
        avatarNode.translation = new X3D.SFVec3f(lx, y, lz);
      } catch(e) {}
      if (state.stepNum >= totalSteps) {
        clearInterval(state.timer);
        delete _lerpActive[safeName];
        try { avatarNode.translation = new X3D.SFVec3f(x, y, z); } catch(e) {}
      }
    }, stepMs);

    _lerpActive[safeName] = state;

  } catch(e) { console.warn('pbPushPosition error:', e); }
}

// ─────────────────────────────────────────────
// _validateAndBuildOrderGroups — V4 waypointOrder validator
// ─────────────────────────────────────────────
// Reads <Path waypointOrder="N"> from _scene.xml DOM.
// Returns {1:[safeName,...], 2:[...], ...} on success.
// Returns null and shows error on any missing/invalid waypointOrder.
// Also warns (does not halt) if order numbers have gaps.
// Called in pbPlayAll before any agent is fired.
function _validateAndBuildOrderGroups(sceneDoc, cultivarList) {
  var el = document.getElementById('pb-step-info');
  var pathEls = sceneDoc ? sceneDoc.querySelectorAll('Path') : [];

  if (!pathEls.length) {
    // Not an authoring error -- plenty of valid scenes are pure EventCue
    // cinematics (camera/gesture/movie cues) with no waypoint locomotion
    // at all. Return false (not null) so the caller can tell this apart
    // from a genuine validation failure below and fall through to
    // simultaneous-fire instead of halting the whole scene's avatar
    // activation -- that halt was silently skipping pbActivateX3DTimers
    // for every agent, so gesture timers never got mapped at all.
    if (el) el.textContent = 'No <Path> elements in scene XML — running as a pure EventCue scene (no waypoint sequencing).';
    console.log('_validateAndBuildOrderGroups: no Path elements — treating as EventCue-only scene, not an error');
    return false;
  }

  var groups = {};         // {orderInt: [safeName, ...]}
  // Day 77: {safeName + '::' + orderInt: normalizedPathName} — needed because the
  // server creates one playback session PER PATH (session_id derives from the
  // arc file's path_name), so an agent with multiple paths has multiple
  // sessions. A cultivar-name-only session map can only ever hold one of them.
  // This lets the per-group loop in _pbPlayAllInner correlate "this session"
  // to "this agent's path for THIS specific order" by matching path names,
  // not just agent names.
  var pathNames = {};
  var errors = [];

  pathEls.forEach(function(pEl) {
    var agent = pEl.getAttribute('agent') || '';
    var name  = pEl.getAttribute('name')  || '';
    var orderRaw = pEl.getAttribute('waypointOrder');

    // Missing entirely or empty string → authoring error
    if (orderRaw === null || orderRaw === undefined || String(orderRaw).trim() === '' || orderRaw === 'MISSING') {
      errors.push('Path "' + name + '" (agent: ' + agent + '): waypointOrder MISSING');
      return;
    }

    var orderInt = parseInt(orderRaw, 10);
    if (isNaN(orderInt) || orderInt < 1) {
      errors.push('Path "' + name + '" (agent: ' + agent + '): waypointOrder "' + orderRaw + '" is not a positive integer');
      return;
    }

    var safeName = agent.replace(/[^A-Za-z0-9_]/g, '_');
    if (!groups[orderInt]) groups[orderInt] = [];
    if (groups[orderInt].indexOf(safeName) === -1) groups[orderInt].push(safeName);
    pathNames[safeName + '::' + orderInt] = name.replace(/[^A-Za-z0-9]/g, '').toLowerCase();
  });

  if (errors.length) {
    var msg = 'HALT — waypointOrder errors:\n' + errors.join('\n');
    if (el) el.innerHTML = '<span style="color:#f06060">' + msg.replace(/\n/g,'<br>') + '</span>';
    console.error('_validateAndBuildOrderGroups:', msg);
    return null;
  }

  // Warn on gaps (1 and 3 with no 2) — not a halt, author may have reserved space
  var orderNums = Object.keys(groups).map(Number).sort(function(a,b){return a-b;});
  for (var gi = 1; gi < orderNums.length; gi++) {
    if (orderNums[gi] - orderNums[gi-1] > 1) {
      console.warn('_validateAndBuildOrderGroups: gap in order numbers between',
        orderNums[gi-1], 'and', orderNums[gi], '— may be intentional');
    }
  }

  console.log('_validateAndBuildOrderGroups: groups =', JSON.stringify(groups));
  return { groups: groups, pathNames: pathNames };
}

// ─────────────────────────────────────────────
// _pbWaitForGroup — resolves when all agents in group have _pbArcComplete=true
// ─────────────────────────────────────────────
// Polls every 200ms. Timeout after 10 minutes (safety valve).
function _pbWaitForGroup(groupSafeNames) {
  return new Promise(function(resolve) {
    var POLL_MS = 200;
    var MAX_POLLS = 3000; // 10 minutes
    var polls = 0;
    function check() {
      polls++;
      var allDone = groupSafeNames.every(function(sn) { return !!_pbArcComplete[sn]; });
      if (allDone) {
        console.log('_pbWaitForGroup: all complete —', groupSafeNames);
        resolve();
        return;
      }
      if (polls >= MAX_POLLS) {
        console.warn('_pbWaitForGroup: timeout waiting for', groupSafeNames,
          '— completed:', Object.keys(_pbArcComplete).filter(function(k){return _pbArcComplete[k];}));
        resolve(); // resolve anyway so scene doesn't hang forever
        return;
      }
      setTimeout(check, POLL_MS);
    }
    check();
  });
}

// ─────────────────────────────────────────────
// pbPlayAll — ordered group sequencer (V4)
// ─────────────────────────────────────────────
// Calls POST /arc/playback/start/all to start every arc as independent
// server sessions. Groups are fired in ascending waypointOrder. Each group
// fires simultaneously; the next group waits for ALL _pbArcComplete in the
// current group before starting.
//
// HARD STOP: if any Path in _scene.xml is missing waypointOrder, the scene
// does not run. The validator logs the specific path name and halts.

async function pbPlayAll() {
  console.log('pbPlayAll: called — _pbCbGeneration=', _pbCbGeneration, '_x3dTimerActive keys:', Object.keys(_x3dTimerActive));

  if (window._pbPlayAllInFlight) {
    console.warn('pbPlayAll: already in flight — ignoring duplicate call');
    return;

          if (_ogResult === false) {
            // No <Path> elements at all -- not an error. Leave orderGroups
            // falsy-but-not-null so the halt check below (which only fires
            // on a genuine null, i.e. a real waypointOrder validation
            // error) doesn't stop here, and so we fall into the existing
            // simultaneous-fire else-branch below, which already calls
            // pbActivateX3DTimers unconditionally for every cultivar.
            orderGroups = false;
          } else {
            orderGroups = _ogResult ? _ogResult.groups : null;
            if (_ogResult) _pathNamesByAgentOrder = _ogResult.pathNames;
          }
          validatorRan = true;
        } else {
          console.warn('pbPlayAll: scene XML fetch failed (' + sceneXmlResp.status + ') — skipping waypointOrder validation, firing simultaneously');
        }
      } catch(xmlErr) {
